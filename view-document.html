<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signature de Document - Domtom Connect</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #10b981; --dark: #020617; --slate: #64748b; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #fafafa; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .quote-container { background: white; width: 100%; max-width: 800px; padding: 60px; border-radius: 32px; box-shadow: 0 40px 100px rgba(0,0,0,0.1); border: 1px solid #f1f5f9; }
        .header { display: flex; justify-content: space-between; margin-bottom: 60px; border-bottom: 2px solid #f1f5f9; padding-bottom: 40px; }
        .total-box { background: var(--dark); color: white; padding: 40px; border-radius: 24px; text-align: right; margin-top: 40px; }
        .sig-canvas { background: #f8fafc; border: 2px dashed #cbd5e1; border-radius: 20px; cursor: crosshair; touch-action: none; }
        .btn-sign { background: var(--primary); color: white; border: none; padding: 18px 48px; border-radius: 16px; font-weight: 800; font-size: 1.1rem; cursor: pointer; width: 100%; margin-top: 24px; }
        .loader { width: 30px; height: 30px; border: 3px solid #f3f3f3; border-top: 3px solid var(--primary); border-radius: 50%; display: inline-block; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="app-mount">
        <div style="text-align:center; margin-top:100px;"><span class="loader"></span></div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
        const urlParams = new URLSearchParams(window.location.search);
        const docId = urlParams.get('id');

        // Initialisation Supabase
        const supabase = createClient('https://YOUR_PROJECT.supabase.co', 'YOUR_KEY');

        async function init() {
            if(!docId) { document.getElementById('app-mount').innerHTML = "Document introuvable."; return; }
            const { data: doc } = await supabase.from('business_docs').select('*, expert:expert_id(full_name)').eq('id', docId).single();
            if(!doc) { document.getElementById('app-mount').innerHTML = "Document expiré."; return; }
            render(doc);
        }

        function render(doc) {
            const isSigned = doc.status === 'paid' || doc.status === 'signed' || doc.status === 'sent';
            
            document.getElementById('app-mount').innerHTML = `
                <div class="quote-container">
                    <div class="header">
                        <div>
                            <h1 style="margin:0; font-weight:950; letter-spacing:-0.04em;">DEVIS PROFESSIONNEL</h1>
                            <p style="color:var(--slate); margin-top:8px;">REF: #${doc.id.slice(0,8).toUpperCase()}</p>
                        </div>
                        <div style="text-align:right">
                            <div style="font-weight:800;">Émis par :</div>
                            <div style="font-weight:950; color:var(--primary);">${doc.expert?.full_name || 'Expert Domtom Connect'}</div>
                        </div>
                    </div>

                    <div style="margin-bottom:40px;">
                        <h4 style="font-size:0.75rem; color:var(--slate); text-transform:uppercase;">Objet de la mission</h4>
                        <div style="font-size:1.4rem; font-weight:800; color:var(--dark);">${doc.project_title}</div>
                        <p style="color:var(--slate); font-weight:600; margin-top:12px;">Client: ${doc.client_name}</p>
                    </div>

                    <div class="total-box">
                        <div style="font-size:0.9rem; opacity:0.6; margin-bottom:8px;">MONTANT TOTAL HT</div>
                        <div style="font-size:3rem; font-weight:950;">${doc.total_amount.toFixed(2)} €</div>
                    </div>

                    ${!isSigned ? `
                        <div style="margin-top:60px;">
                            <h4 style="font-size:0.75rem; color:var(--slate); text-transform:uppercase; margin-bottom:16px;">Signature Manuscrite Digitale</h4>
                            <div style="position:relative;">
                                <canvas id="signature-pad" class="sig-canvas" width="680" height="200"></canvas>
                                <button onclick="clearSig()" style="position:absolute; top:12px; right:12px; background:white; border:1px solid #e2e8f0; padding:6px 12px; border-radius:8px; font-size:0.7rem; font-weight:800; cursor:pointer;">Effacer</button>
                            </div>
                            <button onclick="handleSign()" id="btn-sign-main" class="btn-sign">SIGNER ET VALIDER LE DEVIS</button>
                        </div>
                    ` : `
                        <div style="margin-top:60px; text-align:center; padding:40px; background:#f0fdf4; border-radius:24px; border:2px solid #10b981; color:#059669;">
                            <div style="font-size:2rem; margin-bottom:12px;">✅</div>
                            <h3 style="margin:0; font-weight:950;">DOCUMENT SIGNÉ</h3>
                            <p style="font-weight:600; opacity:0.8;">La mission peut désormais débuter.</p>
                        </div>
                    `}
                </div>
            `;

            if(!isSigned) initCanvas();
        }

        let canvas, ctx, drawing = false;
        function initCanvas() {
            canvas = document.getElementById('signature-pad');
            if(!canvas) return;
            ctx = canvas.getContext('2d');
            ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.strokeStyle = '#020617';

            const start = (e) => { drawing = true; draw(e); };
            const stop = () => { drawing = false; ctx.beginPath(); };
            const draw = (e) => {
                if(!drawing) return;
                const rect = canvas.getBoundingClientRect();
                const x = (e.clientX || e.touches[0].clientX) - rect.left;
                const y = (e.clientY || e.touches[0].clientY) - rect.top;
                ctx.lineTo(x, y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x, y);
            };

            canvas.addEventListener('mousedown', start); canvas.addEventListener('mouseup', stop); canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('touchstart', start); canvas.addEventListener('touchend', stop); canvas.addEventListener('touchmove', draw);
        }

        window.clearSig = () => { if(ctx) ctx.clearRect(0, 0, canvas.width, canvas.height); };

        window.handleSign = async () => {
             const btn = document.getElementById('btn-sign-main');
             btn.disabled = true; btn.textContent = "Validation sécurisée...";
             await supabase.from('business_docs').update({ status: 'sent', updated_at: new Date() }).eq('id', docId);
             Swal.fire({ title: "Validé !", text: "Le contrat est signé.", icon: "success" }).then(() => location.reload());
        }

        init();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
