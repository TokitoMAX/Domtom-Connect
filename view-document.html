<!DOCTYPE html>
<html lang="fr">
<head>
    <meta name="robots" content="noindex, follow"/>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signature de Document - Domtom Connect</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f1f4f2; min-height: 100vh; padding: 40px 20px; display: flex; justify-content: center; align-items: flex-start; }
        .doc-card { background: white; width: 100%; max-width: 760px; border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.08); overflow: hidden; }
        .doc-header { background: #070908; color: white; padding: 40px; display: flex; justify-content: space-between; align-items: flex-start; }
        .doc-body { padding: 48px; }
        .section-label { font-size: 0.65rem; font-weight: 950; color: #a7b0ac; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
        .divider { border: none; border-top: 1px solid #f1f4f2; margin: 32px 0; }
        .total-block { background: #f6f8f7; border-radius: 16px; padding: 28px; text-align: right; border: 1px solid #e6eae8; }
        .sig-canvas { width: 100%; height: 160px; background: white; border: 2px dashed #d4dad7; border-radius: 16px; cursor: crosshair; display: block; touch-action: none; }
        .btn-primary { width: 100%; background: #10b981; color: white; border: none; padding: 18px; border-radius: 14px; font-weight: 950; font-size: 1rem; cursor: pointer; font-family: inherit; transition: 0.2s; }
        .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .status-signed { background: #ecfdf5; border: 2px solid #10b981; border-radius: 16px; padding: 32px; text-align: center; }
        .loader { display: inline-block; width: 28px; height: 28px; border: 3px solid #e6eae8; border-top-color: #10b981; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .line-table { width: 100%; border-collapse: collapse; }
        .line-table th { padding: 10px 12px; font-size: 0.65rem; font-weight: 950; color: #a7b0ac; text-transform: uppercase; text-align: left; border-bottom: 1px solid #f1f4f2; }
        .line-table td { padding: 14px 12px; font-weight: 600; color: #2b3632; border-bottom: 1px solid #f6f8f7; }
        .line-table td:last-child { text-align: right; font-weight: 800; color: #070908; }
    </style>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-1C5QTWZFER"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-1C5QTWZFER');
</script>
</head>
<body>
    <div class="doc-card" id="doc-root">
        <div style="padding: 80px; text-align: center;">
            <span class="loader"></span>
            <p style="margin-top: 20px; color: #717c77; font-weight: 700;">Chargement du document sécurisé...</p>
        </div>
    </div>

    <script>
        // ─── Init Supabase (sans module ES pour compatibilité locale) ───
        const _db = supabase.createClient(
            'https://vlpzmxddgdjjtrpbtksd.supabase.co',
            'sb_publishable_C87PskG61FXoIIZMZcu8LQ_kH1iFkCF'
        );

        const docId = new URLSearchParams(window.location.search).get('id');

        // ─── Signature Pad ───
        let canvas, ctx, isDrawing = false, hasSig = false;

        function initPad() {
            canvas = document.getElementById('sig-pad');
            if (!canvas) return;
            ctx = canvas.getContext('2d');
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#070908';

            const getPos = (e) => {
                const r = canvas.getBoundingClientRect();
                const src = e.touches ? e.touches[0] : e;
                return { x: (src.clientX - r.left) * (canvas.width / r.width), y: (src.clientY - r.top) * (canvas.height / r.height) };
            };

            canvas.addEventListener('mousedown', (e) => { isDrawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); });
            canvas.addEventListener('mousemove', (e) => { if (!isDrawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); hasSig = true; });
            canvas.addEventListener('mouseup', () => isDrawing = false);
            canvas.addEventListener('mouseleave', () => isDrawing = false);
            canvas.addEventListener('touchstart', (e) => { e.preventDefault(); isDrawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); });
            canvas.addEventListener('touchmove', (e) => { e.preventDefault(); if (!isDrawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); hasSig = true; });
            canvas.addEventListener('touchend', () => isDrawing = false);
        }

        function clearPad() {
            if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
            hasSig = false;
        }

        // ─── Render ───
        function render(doc) {
            const signed = ['sent', 'paid'].includes(doc.status);
            const items = (() => { try { return JSON.parse(doc.items || '[]'); } catch { return []; } })();
            const net = (doc.total_amount || 0) * 0.875; // 12.5% commission

            document.getElementById('doc-root').innerHTML = `
                <div class="doc-header">
                    <div>
                        <div style="font-size: 0.65rem; font-weight: 950; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px;">Domtom Connect · Devis Pro</div>
                        <div style="font-size: 1.8rem; font-weight: 950;">${doc.project_title || 'Prestation Expert'}</div>
                        <div style="color: rgba(255,255,255,0.5); font-weight: 600; margin-top: 6px;">Réf. #${doc.id.slice(0,8).toUpperCase()}</div>
                    </div>
                    <div style="text-align: right;">
                        <div style="font-size: 0.65rem; color: rgba(255,255,255,0.4); text-transform: uppercase; margin-bottom: 4px;">Statut</div>
                        <span style="background: ${signed ? '#10b981' : '#f59e0b'}; color: white; padding: 4px 14px; border-radius: 100px; font-size: 0.7rem; font-weight: 950; text-transform: uppercase;">${signed ? 'Signé' : 'En attente'}</span>
                    </div>
                </div>

                <div class="doc-body">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 32px; margin-bottom: 40px;">
                        <div>
                            <div class="section-label">Client</div>
                            <div style="font-size: 1.2rem; font-weight: 900; color: #070908;">${doc.client_name || '—'}</div>
                        </div>
                        <div>
                            <div class="section-label">Date d'émission</div>
                            <div style="font-size: 1.1rem; font-weight: 800; color: #070908;">${new Date(doc.created_at).toLocaleDateString('fr-FR', { day: '2-digit', month: 'long', year: 'numeric' })}</div>
                        </div>
                    </div>

                    <hr class="divider">

                    ${items.length > 0 ? `
                    <table class="line-table">
                        <thead>
                            <tr>
                                <th>Description</th>
                                <th>Qté</th>
                                <th>Prix Unit.</th>
                                <th>Total</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${items.map(i => `
                            <tr>
                                <td>${i.description || '—'}</td>
                                <td>${i.qty}</td>
                                <td>${parseFloat(i.price).toFixed(2)} €</td>
                                <td>${parseFloat(i.total).toFixed(2)} €</td>
                            </tr>`).join('')}
                        </tbody>
                    </table>
                    <hr class="divider">
                    ` : ''}

                    <div class="total-block">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 12px;">
                            <span style="font-weight: 700; color: #717c77;">Montant total HT</span>
                            <span style="font-size: 1.5rem; font-weight: 950; color: #070908;">${(doc.total_amount || 0).toFixed(2)} €</span>
                        </div>
                        <div style="font-size: 0.75rem; color: #a7b0ac; font-weight: 700;">
                            Le montant net reversé à l'expert (hors frais DTC 12.5%) est de <strong style="color: #10b981;">${net.toFixed(2)} €</strong>
                        </div>
                    </div>

                    <hr class="divider">

                    ${signed ? `
                    <div class="status-signed">
                        <div style="font-size: 2rem; margin-bottom: 12px;"><i class="fas fa-check-circle"></i></div>
                        <div style="font-size: 1.2rem; font-weight: 950; color: #059669;">Document signé et validé</div>
                        <div style="color: #717c77; font-weight: 600; margin-top: 8px;">Ce devis a été accepté numériquement. La mission peut démarrer.</div>
                    </div>
                    ` : `
                    <div>
                        <div style="font-weight: 950; color: #070908; font-size: 1.1rem; margin-bottom: 8px;">Signature du Client</div>
                        <div style="font-size: 0.85rem; color: #717c77; font-weight: 600; margin-bottom: 20px;">En signant ci-dessous, vous acceptez les conditions de la prestation et vous engagez à régler le montant indiqué.</div>

                        <div style="position: relative; margin-bottom: 12px;">
                            <canvas id="sig-pad" class="sig-canvas" width="680" height="160"></canvas>
                            <button onclick="clearPad()" style="position: absolute; top: 10px; right: 10px; background: white; border: 1px solid #e6eae8; padding: 6px 12px; border-radius: 8px; font-size: 0.7rem; font-weight: 800; cursor: pointer; color: #717c77;">Effacer</button>
                        </div>

                        <button class="btn-primary" id="btn-sign" onclick="handleSign('${doc.id}')">SIGNER ET ACCEPTER LE DEVIS</button>
                        <div style="text-align: center; font-size: 0.75rem; color: #a7b0ac; font-weight: 700; margin-top: 12px;">Signature électronique sécurisée via Domtom Connect</div>
                    </div>
                    `}
                </div>
            `;

            if (!signed) { setTimeout(initPad, 50); }
        }

        async function handleSign(id) {
            if (!hasSig) { Swal.fire('Signature requise', 'Veuillez signer dans le cadre avant de valider.', 'warning'); return; }
            const btn = document.getElementById('btn-sign');
            btn.disabled = true; btn.textContent = 'Validation en cours...';
            const { error } = await _db.from('business_docs').update({ status: 'sent', updated_at: new Date().toISOString() }).eq('id', id);
            if (error) { Swal.fire('Erreur', error.message, 'error'); btn.disabled = false; btn.textContent = 'SIGNER ET ACCEPTER LE DEVIS'; return; }
            Swal.fire({ title: 'Signé !', text: 'Votre accord a bien été transmis à l\'expert.', icon: 'success', confirmButtonColor: '#10b981' }).then(() => location.reload());
        }

        // ─── Boot ───
        async function boot() {
            if (!docId) { document.getElementById('doc-root').innerHTML = '<div style="padding:60px; text-align:center; color:#ef4444; font-weight:800;">Lien invalide. Aucun document spécifié.</div>'; return; }
            const { data, error } = await _db.from('business_docs').select('*').eq('id', docId).single();
            if (error || !data) { document.getElementById('doc-root').innerHTML = '<div style="padding:60px; text-align:center; color:#ef4444; font-weight:800;">Document introuvable ou lien expiré.</div>'; return; }
            render(data);
        }

        boot();
    </script>
</body>
</html>
