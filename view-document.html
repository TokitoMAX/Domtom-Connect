<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultation Document – Domtom Connect</title>
    <link rel="icon" type="image/png" href="assets/images/logo-domtomconnect.png">
    <link rel="stylesheet" href="assets/css/style.css?v=10.1">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #f1f5f9; min-height: 100vh; padding: 40px 20px; font-family: 'Plus Jakarta Sans', sans-serif; }
        .client-container { max-width: 900px; margin: 0 auto; }
        .paper-view { background: white; padding: 60px; border-radius: 4px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; position: relative; min-height: 800px; }
        .signature-footer { margin-top: 40px; display: flex; justify-content: flex-end; align-items: center; gap: 20px; padding: 32px; background: white; border-radius: 16px; border: 1px solid #e2e8f0; }
        .status-badge { padding: 6px 16px; border-radius: 100px; font-size: 0.8rem; font-weight: 800; text-transform: uppercase; }
        .status-signed { background: #ecfdf5; color: #10b981; border: 1px solid #10b981; }
        .doc-header { display: flex; justify-content: space-between; margin-bottom: 60px; }
        .items-table { width: 100%; border-collapse: collapse; margin: 30px 0; }
        .items-table th { text-align: left; padding: 12px; border-bottom: 2px solid #f1f5f9; color: #64748b; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .items-table td { padding: 16px 12px; border-bottom: 1px solid #f1f5f9; color: #1e293b; font-size: 0.95rem; }
        .total-area { float: right; width: 300px; margin-top: 30px; }
        .total-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #f1f5f9; }
        .total-final { font-size: 1.25rem; font-weight: 900; color: #0f172a; border-bottom: none; padding-top: 20px; }
    </style>
</head>
<body>
    <div class="client-container">
        <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
            <img src="assets/images/logo-domtomconnect.png" alt="Logo" style="height:40px;">
            <div id="status-container"></div>
        </header>

        <div id="doc-paper" class="paper-view">
            <p style="text-align:center; color:#64748b;">Chargement du document...</p>
        </div>

        <div id="signature-actions" class="signature-footer" style="display:none;">
            <p style="margin:0; font-size:0.9rem; color:#64748b; font-weight:500;">En cliquant sur signer, vous acceptez les termes de ce document.</p>
            <button onclick="openSignatureModal()" class="cta-button primary" style="background:#10b981; border:none; padding:16px 32px; font-weight:900;">SIGNER LE DOCUMENT</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://vlpzmxddgdjjtrpbtksd.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_C87PskG61FXoIIZMZcu8LQ_kH1iFkCF';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentDoc = null;

        async function init() {
            const params = new URLSearchParams(window.location.search);
            const docId = params.get('id');
            if (!docId) return renderError("ID du document manquant.");

            const { data, error } = await _supabase
                .from('business_docs')
                .select('*')
                .eq('id', docId)
                .single();

            if (error || !data) return renderError("Impossible de charger ce document.");
            currentDoc = data;
            renderDocument(data);
        }

        function renderDocument(doc) {
            const isSigned = doc.signature_status === 'signed';
            const statusContainer = document.getElementById('status-container');
            
            if (isSigned) {
                statusContainer.innerHTML = '<span class="status-badge status-signed">Document Signe & Approuve</span>';
                document.getElementById('signature-actions').style.display = 'none';
            } else if (doc.signature_status === 'pending') {
                statusContainer.innerHTML = '<span class="status-badge" style="background:#fff7ed; color:#f97316; border:1px solid #f97316;">En attente de signature</span>';
                document.getElementById('signature-actions').style.display = 'flex';
            }

            const headerHTML = `
                <div class="doc-header">
                    <div class="expert-info">
                        <h2 style="font-weight:900; margin:0 0 10px 0;">${doc.expert_details?.name || 'Prestataire'}</h2>
                        <p style="margin:0; color:#64748b; font-size:0.9rem;">${doc.expert_details?.address || ''}</p>
                    </div>
                    <div class="doc-meta" style="text-align:right;">
                        <h1 style="font-weight:900; margin:0; text-transform:uppercase; letter-spacing:0.05em;">${doc.type === 'invoice' ? 'Facture' : 'Devis'}</h1>
                        <p style="margin:5px 0 0; color:#64748b; font-weight:800;">N° ${doc.number}</p>
                        <p style="margin:5px 0 0; font-size:0.85rem; color:#94a3b8;">Emis le ${new Date(doc.created_at).toLocaleDateString()}</p>
                    </div>
                </div>
                <div class="client-block" style="margin-bottom:60px;">
                    <label style="font-size:0.7rem; font-weight:800; color:#94a3b8; text-transform:uppercase; display:block; margin-bottom:8px;">Destinataire</label>
                    <div style="padding:24px; background:#f8fafc; border-radius:12px; border:1px solid #f1f5f9; width:fit-content; min-width:300px;">
                        <h3 style="margin:0; font-weight:800;">${doc.client_details?.name || 'Client'}</h3>
                        <p style="margin:8px 0 0; color:#64748b; font-size:0.9rem; line-height:1.5;">${doc.client_details?.address || ''}</p>
                    </div>
                </div>
            `;

            const tableHTML = `
                <table class="items-table">
                    <thead>
                        <tr>
                            <th>Description</th>
                            <th style="text-align:center;">Qté</th>
                            <th style="text-align:right;">Prix Unit.</th>
                            <th style="text-align:right;">Total HT</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${(doc.items || []).map(item => `
                            <tr>
                                <td style="font-weight:700;">${item.desc}</td>
                                <td style="text-align:center;">${item.qty}</td>
                                <td style="text-align:right;">${item.unitPrice}€</td>
                                <td style="text-align:right; font-weight:800;">${(item.qty * item.unitPrice).toFixed(2)}€</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;

            const totalHTML = `
                <div class="total-area">
                    <div class="total-row"><span>Total HT</span> <span>${(doc.total_ttc - (doc.total_tax || 0)).toFixed(2)}€</span></div>
                    <div class="total-row"><span>TVA (${doc.tax_config?.rate || 0}%)</span> <span>${(doc.total_tax || 0).toFixed(2)}€</span></div>
                    <div class="total-row total-final"><span>Total TTC</span> <span>${doc.total_ttc?.toFixed(2)}€</span></div>
                    ${doc.deposit_perc > 0 ? `<div class="total-row" style="margin-top:10px; color:#10b981; font-weight:800;"><span>Acompte (${doc.deposit_perc}%)</span> <span>${(doc.total_ttc * doc.deposit_perc / 100).toFixed(2)}€</span></div>` : ''}
                </div>
                <div style="clear:both;"></div>
            `;

            const signatureProofHTML = isSigned ? `
                <div style="margin-top:60px; padding:32px; background:#f0fdf4; border:1px solid #10b981; border-radius:12px;">
                    <h4 style="margin:0 0 16px 0; color:#065f46; font-weight:900; text-transform:uppercase; font-size:0.75rem;">Preuve de Signature Numerique</h4>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; font-size:0.85rem; color:#065f46;">
                        <div><strong>Signataire :</strong> ${doc.signature_data?.client_name}</div>
                        <div><strong>Date :</strong> ${new Date(doc.signature_data?.signed_at).toLocaleString()}</div>
                        <div><strong>Addresse IP :</strong> ${doc.signature_data?.ip}</div>
                        <div><strong>Certificat :</strong> Fingerprint-${doc.id.substring(0,8)}</div>
                    </div>
                    <div style="margin-top:20px; font-family:'Dancing Script', cursive; font-size:1.5rem; color:#10b981;">
                        ${doc.signature_data?.client_name}
                    </div>
                </div>
            ` : '';

            document.getElementById('doc-paper').innerHTML = headerHTML + tableHTML + totalHTML + signatureProofHTML;
        }

        async function openSignatureModal() {
            const { value: name } = await Swal.fire({
                title: 'Confirmer votre Signature',
                text: 'En tapant votre nom, vous approuvez ce document numériquement.',
                input: 'text',
                inputLabel: 'Votre Nom Complet',
                inputPlaceholder: 'Ex: Jean Dupont',
                showCancelButton: true,
                confirmButtonText: 'SIGNER & APPROUVER',
                confirmButtonColor: '#10b981',
                inputValidator: (value) => {
                    if (!value) return 'Veuillez saisir votre nom pour signer.'
                }
            });

            if (name) {
                processSignature(name);
            }
        }

        async function processSignature(clientName) {
            Swal.fire({ title: 'Traitement de la signature...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            
            try {
                const ipData = await fetch('https://api.ipify.org?format=json').then(r => r.json()).catch(() => ({ ip: 'Unknown' }));
                
                const signatureData = {
                    ...currentDoc.signature_data,
                    client_name: clientName,
                    signed_at: new Date().toISOString(),
                    ip: ipData.ip,
                    status: 'signed'
                };

                const { error } = await _supabase
                    .from('business_docs')
                    .update({ 
                        signature_status: 'signed',
                        signature_data: signatureData
                    })
                    .eq('id', currentDoc.id);

                if (error) throw error;

                Swal.fire({
                    title: 'Merci !',
                    text: 'Le document a été signé et le prestataire en a été informé.',
                    icon: 'success'
                }).then(() => {
                    location.reload();
                });

            } catch (err) {
                Swal.fire('Erreur', 'Impossible de valider la signature.', 'error');
            }
        }

        function renderError(msg) {
            document.getElementById('doc-paper').innerHTML = `<p style="text-align:center; color:#ef4444; font-weight:800;">${msg}</p>`;
        }

        init();
    </script>
</body>
</html>
