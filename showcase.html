<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique Connect | Domtom Connect</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #fff; margin: 0; padding: 0; }
        .loader { width: 48px; height: 48px; border: 5px solid #020617; border-bottom-color: transparent; border-radius: 50%; display: inline-block; box-sizing: border-box; animation: rotation 1s linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg) } 100% { transform: rotate(360deg) } }
        #details-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(2, 6, 23, 0.8); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 20px; box-sizing: border-box; }
        #details-modal-overlay.open { display: flex; }
        @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>
    <div id="public-showcase-container"></div>
    <div id="details-modal-overlay"></div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
        window._supabase = createClient(window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? 'http://localhost:54321' : 'https://your-supabase-url.supabase.co', 'your-anon-key');
        
        // Note: Real keys should be in a config, using global for now to match platform.
        // If app.js is already present, we should use it.
    </script>
    
    <script src="assets/js/modules/showcase.module.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const providerId = urlParams.get('id');
            const container = document.getElementById('public-showcase-container');
            
            if (providerId && window.ShowcaseModule) {
                await window.ShowcaseModule.renderPublicShowcase(container, providerId);
            } else {
                container.innerHTML = '<div style="text-align:center;padding:100px;font-family:sans-serif;"><h1>Oops!</h1><p>Boutique non trouvée.</p></div>';
            }
        });
    </script>
</body>
</html>
