<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérifiez votre email | Domtom Connect</title>
    <link rel="stylesheet" href="../assets/css/style.css?v=10.1">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f6f8f7;
            padding: 24px;
        }

        .auth-card {
            width: 100%;
            max-width: 480px;
            padding: 48px;
            border: 1px solid var(--gray-200);
            border-radius: 24px;
            background: var(--white);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            text-align: center;
        }

        .auth-icon {
            width: 80px;
            height: 80px;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 32px;
            color: #10b981;
        }

        .auth-title {
            font-size: 1.75rem;
            font-weight: 850;
            margin-bottom: 16px;
            letter-spacing: -0.03em;
            color: #0c100e;
        }

        .auth-text {
            color: #717c77;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 32px;
        }
    </style>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-1C5QTWZFER"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-1C5QTWZFER');
</script>
</head>

<body class="auth-page">

    <main class="auth-card">
        <div class="auth-icon">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
        </div>
        <h1 class="auth-title">Vérifiez vos emails</h1>
        <p class="auth-text">
            Un lien de confirmation vient de vous être envoyé.<br>
            Veuillez cliquer sur ce lien pour activer votre compte et accéder à votre espace.
        </p>

        <div id="magic-link-section"
            style="margin-top: 32px; padding-top: 32px; border-top: 1px solid var(--gray-200);">
            <p class="auth-text" style="font-size: 0.9rem; margin-bottom: 20px;">
                Vous n'avez pas reçu le mail ? <br> (Vérifiez les spams ou cliquez ci-dessous)
            </p>
            <button id="send-magic-link" class="cta-button primary" style="width: 100%; height: 50px; background: #10b981; border: none; font-weight: 800; border-radius: 12px; color: white;">
                Renvoyer le lien d'activation
            </button>
            <p id="feedback" style="margin-top: 15px; font-size: 0.85rem; display: none; font-weight: 600;"></p>
        </div>

        <a href="../login" class="cta-button secondary"
            style="margin-top: 24px; display: flex; align-items: center; justify-content: center; background: #f1f4f2; color: #56615c; border: 1px solid #e6eae8; border-radius: 12px; height: 50px; font-weight: 700; text-decoration: none;">
            Retour à la connexion
        </a>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        const btn = document.getElementById('send-magic-link');
        const feedback = document.getElementById('feedback');

        btn.addEventListener('click', async () => {
            try {
                btn.disabled = true;
                btn.textContent = 'Envoi en cours...';

                const session = await getSession();
                const email = session?.user?.email;

                if (!email) {
                    throw new Error("Session introuvable. Veuillez vous reconnecter.");
                }

                const { error } = await _supabase.auth.signInWithOtp({
                    email: email,
                    options: {
                        emailRedirectTo: window.location.origin + '/mon-projet'
                    }
                });

                if (error) throw error;

                feedback.textContent = "Lien envoyé ! Consultez votre boîte mail.";
                feedback.style.color = "#10b981";
                feedback.style.display = "block";
                btn.textContent = 'Renvoyer à nouveau';

            } catch (err) {
                feedback.textContent = err.message;
                feedback.style.color = "#dc2626";
                feedback.style.display = "block";
                btn.disabled = false;
                btn.textContent = "Renvoyer mon lien d'activation";
            } finally {
                setTimeout(() => { btn.disabled = false; }, 5000);
            }
        });
    </script>
</body>

</html>
