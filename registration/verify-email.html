<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérifiez votre email – Domtom Connect</title>
    <link rel="stylesheet" href="../assets/css/style.css?v=3.0">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--white);
            padding: 24px;
        }

        .auth-card {
            width: 100%;
            max-width: 480px;
            padding: 48px;
            border: 1px solid var(--gray-200);
            border-radius: var(--border-radius-lg);
            background: var(--white);
            box-shadow: var(--shadow-xl);
            text-align: center;
        }

        .auth-icon {
            font-size: 3rem;
            margin-bottom: 24px;
            color: var(--primary-color);
        }

        .auth-title {
            font-size: 1.75rem;
            font-weight: 800;
            margin-bottom: 16px;
            letter-spacing: -0.02em;
        }

        .auth-text {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 32px;
        }
    </style>
</head>

<body class="auth-page">

    <main class="auth-card">
        <div class="auth-icon">📧</div>
        <h1 class="auth-title">Vérifiez vos emails</h1>
        <p class="auth-text">
            Un lien de confirmation vient de vous être envoyé.
            Veuillez cliquer sur ce lien pour activer votre compte et accéder à votre dashboard.
        </p>
        <a href="../login.html" class="cta-button primary">Retour à la connexion</a>
    </main>

</body>

</html>
