<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérifiez votre email – Domtom Connect</title>
    <link rel="stylesheet" href="../assets/css/style.css?v=3.0">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--white);
            padding: 24px;
        }

        .auth-card {
            width: 100%;
            max-width: 480px;
            padding: 48px;
            border: 1px solid var(--gray-200);
            border-radius: var(--border-radius-lg);
            background: var(--white);
            box-shadow: var(--shadow-xl);
            text-align: center;
        }

        .auth-icon {
            font-size: 3rem;
            margin-bottom: 24px;
            color: var(--primary-color);
        }

        .auth-title {
            font-size: 1.75rem;
            font-weight: 800;
            margin-bottom: 16px;
            letter-spacing: -0.02em;
        }

        .auth-text {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 32px;
        }
    </style>
</head>

<body class="auth-page">

    <main class="auth-card">
        <div class="auth-icon">📧</div>
        <h1 class="auth-title">Vérifiez vos emails</h1>
        <p class="auth-text">
            Un lien de confirmation vient de vous être envoyé.
            Veuillez cliquer sur ce lien pour activer votre compte et accéder à votre mon-projet.
        </p>

        <div id="magic-link-section"
            style="margin-top: 32px; padding-top: 32px; border-top: 1px solid var(--gray-200);">
            <p class="auth-text" style="font-size: 0.9rem; margin-bottom: 20px;">
                Vous n'avez pas reçu le mail ? <br> (Vérifiez les spams ou cliquez ci-dessous)
            </p>
            <button id="send-magic-link" class="cta-button secondary" style="width: 100%;">Envoyer mon lien d'activation
                Domtom Connect</button>
            <p id="feedback" style="margin-top: 15px; font-size: 0.85rem; display: none;"></p>
        </div>

        <a href="../login" class="cta-button primary"
            style="margin-top: 24px; display: block; background: var(--gray-100); color: var(--text-primary); border: 1px solid var(--gray-200);">Retour
            à la connexion</a>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        const btn = document.getElementById('send-magic-link');
        const feedback = document.getElementById('feedback');

        btn.addEventListener('click', async () => {
            try {
                btn.disabled = true;
                btn.textContent = 'Envoi en cours...';

                const session = await getSession();
                const email = session?.user?.email;

                if (!email) {
                    throw new Error("Session introuvable. Veuillez vous reconnecter.");
                }

                const { error } = await _supabase.auth.signInWithOtp({
                    email: email,
                    options: {
                        emailRedirectTo: window.location.origin + '/mon-projet'
                    }
                });

                if (error) throw error;

                feedback.textContent = "Lien envoyé ! Consultez votre boîte mail.";
                feedback.style.color = "var(--primary-color)";
                feedback.style.display = "block";
                btn.textContent = 'Renvoyer le lien';

            } catch (err) {
                feedback.textContent = err.message;
                feedback.style.color = "#dc2626";
                feedback.style.display = "block";
                btn.disabled = false;
                btn.textContent = "Renvoyer mon lien d'activation";
            } finally {
                setTimeout(() => { btn.disabled = false; }, 5000);
            }
        });
    </script>
</body>

</html>
