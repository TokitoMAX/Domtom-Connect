<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>Devenir Expert – Domtom Connect</title>
    <meta name="description"
        content="Rejoignez l'écosystème Domtom Connect et proposez votre expertise aux projets des Antilles et de la Guyane.">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="../assets/css/style.css?v=3.0">

    <style>
        .onboarding-page {
            background: var(--bg-light);
            min-height: 100vh;
            padding: 80px 24px;
        }

        .onboarding-container {
            max-width: 640px;
            margin: 0 auto;
        }

        .onboarding-card {
            background: var(--white);
            padding: 48px;
            border-radius: var(--border-radius-lg);
            border: 1px solid var(--gray-200);
            box-shadow: var(--shadow-xl);
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 32px;
            color: var(--text-primary);
        }

        .form-grid {
            display: grid;
            gap: 24px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: grid;
            gap: 8px;
        }

        .form-label {
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            font-size: 0.9375rem;
            background: var(--bg-light);
            transition: all 0.2s ease;
        }

        .form-textarea {
            min-height: 120px;
            resize: vertical;
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(0, 191, 166, 0.1);
        }

        .onboarding-header {
            text-align: center;
            margin-bottom: 48px;
        }

        .header-logo {
            width: 48px;
            height: 48px;
            margin-bottom: 24px;
        }

        .info-box {
            background: var(--bg-light);
            border: 1px solid var(--gray-200);
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 32px;
        }

        .info-box strong {
            display: block;
            margin-bottom: 8px;
            color: var(--primary-color);
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .onboarding-card {
                padding: 32px 24px;
            }
        }
    </style>
</head>

<body class="onboarding-page">

    <div class="onboarding-container">
        <header class="onboarding-header">
            <a href="/">
                <img src="../assets/images/logo-domtomconnect.png" alt="Domtom Connect" class="header-logo">
            </a>
            <h1 class="auth-title">Rejoindre le réseau Elite</h1>
            <p class="auth-subtitle">Monétisez votre expertise et collaborez sur les meilleurs projets Outre-mer.</p>
        </header>

        <main class="onboarding-card">
            <div class="info-box">
                <strong>💡 Pourquoi postuler ?</strong>
                <p style="font-size: 0.875rem; color: var(--text-secondary);">Accédez à des missions qualifiées, boostez
                    votre visibilité locale et rejoignez une communauté d'experts validés.</p>
            </div>

            <form class="form-grid" id="providerForm" onsubmit="handleProviderSubmit(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Prénom *</label>
                        <input type="text" class="form-input" name="first_name" placeholder="Jean" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Nom *</label>
                        <input type="text" class="form-input" name="last_name" placeholder="Dupont" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">E-mail professionnel *</label>
                    <input type="email" class="form-input" name="email" placeholder="jean@expertise.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Spécialité principale *</label>
                    <select class="form-select" name="specialty" required>
                        <option value="">Sélectionnez un domaine...</option>
                        <option value="btp">BTP / Rénovation</option>
                        <option value="digital">Digital / IT / IA</option>
                        <option value="legal">Juridique / Finance</option>
                        <option value="marketing">Marketing / Comm</option>
                        <option value="conseil">Conseil Stratégique</option>
                        <option value="sante">Santé / Bien-être</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">TJM Estimé (€)</label>
                        <input type="number" class="form-input" name="tjm" placeholder="450">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Zone d'intervention *</label>
                        <select class="form-select" name="territory" required>
                            <option value="GP">Guadeloupe</option>
                            <option value="MQ">Martinique</option>
                            <option value="GF">Guyane</option>
                            <option value="RE">Réunion</option>
                            <option value="DIASPORA">Diaspora (Global)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Votre expertise terrain (DOM-TOM) *</label>
                    <textarea class="form-textarea" name="expertise_domtom"
                        placeholder="Quelles sont vos expériences marquantes sur ces territoires ?" required></textarea>
                </div>

                <button type="submit" class="cta-button primary" style="width: 100%; margin-top: 12px;" id="submitBtn">
                    Créer mon profil d'expert
                </button>
            </form>
        </main>
    </div>

    <script>
        function handleProviderSubmit(event) {
            event.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Envoi...';

            const formData = new FormData(event.target);
            const data = Object.fromEntries(formData);

            fetch('https://formspree.io/f/myzbqepy', {
                method: 'POST',
                body: JSON.stringify(data),
                headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' }
            }).then(response => {
                if (response.ok) {
                    document.getElementById('providerForm').innerHTML = `
                        <div style="text-align: center; padding: 40px 0;">
                            <div style="font-size: 3rem; margin-bottom: 24px;">✨</div>
                            <h2 style="font-weight: 800; margin-bottom: 12px;">Profil en cours de validation</h2>
                            <p style="color: var(--text-secondary); margin-bottom: 32px;">Notre équipe analyse votre profil. Vous recevrez une réponse sous 48h.</p>
                            <a href="/" class="cta-button primary">Retour à l'accueil</a>
                        </div>
                    `;
                } else {
                    btn.disabled = false;
                    btn.textContent = 'Erreur - Réessayer';
                }
            });
        }
    </script>
</body>

</html>
