<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>Inscription Porteur de Projet – Domtom Connect</title>
    <meta name="description"
        content="Démarrez votre projet aux Antilles ou en Guyane avec l'aide des meilleurs experts.">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="../assets/css/style.css?v=3.0">

    <style>
        .onboarding-page {
            background: var(--bg-light);
            min-height: 100vh;
            padding: 80px 24px;
        }

        .onboarding-container {
            max-width: 640px;
            margin: 0 auto;
        }

        .onboarding-card {
            background: var(--white);
            padding: 48px;
            border-radius: var(--border-radius-lg);
            border: 1px solid var(--gray-200);
            box-shadow: var(--shadow-xl);
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 32px;
            color: var(--text-primary);
        }

        .form-grid {
            display: grid;
            gap: 24px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: grid;
            gap: 8px;
        }

        .form-label {
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            font-size: 0.9375rem;
            background: var(--bg-light);
            transition: all 0.2s ease;
        }

        .form-textarea {
            min-height: 120px;
            resize: vertical;
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(0, 191, 166, 0.1);
        }

        #businessFields {
            display: none;
        }

        .toggle-group {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .toggle-btn {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            background: var(--bg-light);
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 600;
            text-align: center;
            transition: all 0.2s ease;
        }

        .toggle-btn.active {
            border-color: var(--primary-color);
            background: var(--white);
            color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(0, 191, 166, 0.1);
        }

        .onboarding-header {
            text-align: center;
            margin-bottom: 48px;
        }

        .header-logo {
            width: 48px;
            height: 48px;
            margin-bottom: 24px;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .onboarding-card {
                padding: 32px 24px;
            }
        }
    </style>
</head>

<body class="onboarding-page">

    <div class="onboarding-container">
        <header class="onboarding-header">
            <a href="/">
                <img src="../assets/images/logo-domtomconnect.png" alt="Domtom Connect" class="header-logo">
            </a>
            <h1 class="auth-title">Initiez votre Épopée</h1>
            <p class="auth-subtitle">Transformez votre vision en une mission concrète. Domtom Connect vous guide de
                l'idée jusqu'à l'impact.</p>
        </header>

        <main class="onboarding-card">
            <h2 class="section-title">Étape 1 : Le Manifeste</h2>
            <form class="form-grid" id="onboardingForm" onsubmit="handleOnboarding(event)">
                <input type="hidden" name="profile_type" id="profileType" value="project_owner">

                <div class="form-group">
                    <label class="form-label">Nom de votre Épopée (Titre du projet) *</label>
                    <input type="text" class="form-input" name="project_title"
                        placeholder="Ex: Révolution de l'Agrotech, Le futur de l'immobilier..." required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Secteur d'Activité *</label>
                        <select class="form-select" name="project_type" required>
                            <option value="">Sélectionnez...</option>
                            <option value="tech_digital">Tech & Digital</option>
                            <option value="btp_ing">Ingénierie & BTP</option>
                            <option value="conseil_strat">Conseil Stratégique / Finance</option>
                            <option value="marketing_sales">Growth & Marketing</option>
                            <option value="autre">Autre secteur</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Territoire Cible *</label>
                        <select class="form-select" name="territory" required>
                            <option value="">Sélectionnez...</option>
                            <option value="martinique">Martinique</option>
                            <option value="guadeloupe">Guadeloupe</option>
                            <option value="guyane">Guyane</option>
                            <option value="reunion">La Réunion</option>
                            <option value="ocean_indien">Océan Indien</option>
                            <option value="diaspora">Diaspora / Multi-Territoires</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Votre Vision (Votre "Pourquoi") *</label>
                    <textarea class="form-textarea" name="description"
                        placeholder="Quel problème combattez-vous ? Quelle est votre ambition à 3 ans ? (C'est le cœur de votre Manifeste)"
                        required></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Budget estimé</label>
                        <select class="form-select" name="budget">
                            <option value="discovery">À définir (Étude)</option>
                            <option value="small">
                                < 5 000€</option>
                            <option value="medium">5 000€ - 15 000€</option>
                            <option value="large">15 000€ - 50 000€</option>
                            <option value="enterprise">> 50 000€</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Urgence</label>
                        <select class="form-select" name="timeline">
                            <option value="urgent">Immédiat (ASAP)</option>
                            <option value="one_month">Dans le mois</option>
                            <option value="three_months">D'ici 3 mois</option>
                            <option value="exploration">Veille / Exploration</option>
                        </select>
                    </div>
                </div>

                <hr style="border: 0; border-top: 1px solid var(--gray-100); margin: 8px 0;">

                <h2 class="section-title" style="margin-bottom: 12px; font-size: 1.25rem;">Vos Coordonnées</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Nom de l'entité (ou Nom propre) *</label>
                        <input type="text" class="form-input" name="company" placeholder="Ex: Jean Dupont / Tech SARL"
                            required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Numéro SIRET (Optionnel)</label>
                        <input type="text" class="form-input" name="siret" placeholder="Pour vérification Business">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">E-mail professionnel *</label>
                    <input type="email" class="form-input" name="email" placeholder="email@domaine.com" required>
                </div>

                <button type="submit" class="cta-button primary"
                    style="width: 100%; margin-top: 12px; padding: 16px; font-size: 1rem;" id="submitBtn">
                    Enregistrer mon Manifeste →
                </button>
                <p style="text-align: center; font-size: 0.75rem; color: var(--text-muted); margin-top: 16px;">
                    Vos données sont confidentielles. Un expert Domtom Connect vous contactera sous 24h.
                </p>
            </form>
        </main>
    </div>

    <!-- Supabase & Auth -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/form-security.js"></script>

    <script>
        async function handleOnboarding(event) {
            event.preventDefault();
            const form = event.target;
            const btn = document.getElementById('submitBtn');
            const formData = new FormData(form);

            // Validations Anti-Fake (si dispo)
            const emailField = formData.get('email');
            const descField = formData.get('description');
            const companyField = formData.get('company');

            if (window.formSecurity) {
                if (!window.formSecurity.isValidEmail(emailField)) {
                    alert("Veuillez saisir un email professionnel valide.");
                    return;
                }
                if (!window.formSecurity.isValidText(descField, 15)) {
                    alert("Votre brief projet est trop court. Merci de détailler votre besoin.");
                    return;
                }
                if (!window.formSecurity.isValidName(companyField)) {
                    alert("Veuillez saisir un nom d'entité ou nom propre valide.");
                    return;
                }
            }

            btn.disabled = true;
            btn.innerText = 'Envoi en cours...';

            try {
                // 1. Sauvegarde dans Supabase si l'utilisateur est connecté
                const session = await getSession();
                if (session) {
                    const projectData = {
                        owner_id: session.user.id,
                        title: formData.get('project_title') || 'Nouveau Projet',
                        description: `Type: ${formData.get('project_type')}\nBrief: ${formData.get('description')}\nBudget: ${formData.get('budget')}`,
                        territory: formData.get('territory') || 'Non précisé',
                        status: 'Idée',
                        needs: formData.get('description'),
                        is_listed: false
                    };

                    const { error: sbError } = await _supabase
                        .from('projects')
                        .insert([projectData]);

                    if (sbError) console.error('Erreur Supabase:', sbError);

                    await upsertProfile({
                        id: session.user.id,
                        role: 'project_owner',
                        domtom_verified: true
                    });
                }

                // 2. Envoi Formspree
                const response = await fetch('https://formspree.io/f/myzbqepy', {
                    method: 'POST',
                    body: formData,
                    headers: { 'Accept': 'application/json' }
                });

                if (response.ok) {
                    form.innerHTML = `
                        <div style="background: #ecfdf5; color: #065f46; padding: 40px 24px; border-radius: 12px; border: 1px solid #10b981; text-align: center;">
                            <div style="margin-bottom: 24px;">
                                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="20 6 9 17 4 12"></polyline>
                                </svg>
                            </div>
                            <h3 style="margin-bottom: 12px; font-weight:800;">🚀 Manifeste créé avec succès !</h3>
                            <p style="color:var(--text-secondary); margin-bottom: 32px;">Votre épopée commence ici. Nous allons maintenant vous guider pour tracer votre Boussole (Roadmap).</p>
                            <a href="../mon-espace" class="cta-button primary" style="display: inline-block;">Accéder au Success Engine</a>
                        </div>
                    `;
                } else {
                    throw new Error('Erreur lors de l\'envoi Formspree');
                }
            } catch (error) {
                console.error(error);
                alert("Oups ! Une erreur est survenue lors de l'envoi. Veuillez réessayer.");
                btn.disabled = false;
                btn.innerText = 'Soumettre mon besoin';
            }
        }
    </script>
</body>

</html>
