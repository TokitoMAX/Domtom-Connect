<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Thumbnail Builder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@800;900&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 1280px;
            height: 720px;
            overflow: hidden;
            background: #000;
            position: relative;
            font-family: 'Cabinet Grotesk', sans-serif;
        }

        .bg-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(1.1) brightness(0.95);
        }

        /* Dark Vignette / Gradient Scrim */
        .scrim-left {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(3, 6, 5, 0.96) 0%, rgba(3, 6, 5, 0.85) 45%, rgba(3, 6, 5, 0.2) 75%, transparent 100%);
            z-index: 2;
        }

        .ambient-emerald {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: rgba(0, 191, 166, 0.25);
            filter: blur(120px);
            top: -100px;
            left: -100px;
            z-index: 3;
            pointer-events: none;
        }

        /* Typography & Content Layout */
        .content {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 80px;
            max-width: 850px;
        }

        .brand-pill {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 18px;
            background: rgba(0, 191, 166, 0.15);
            border: 2px solid #00BFA6;
            border-radius: 100px;
            width: fit-content;
            margin-bottom: 24px;
            box-shadow: 0 0 25px rgba(0, 191, 166, 0.3);
        }

        .brand-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00BFA6;
            box-shadow: 0 0 10px #00BFA6;
        }

        .brand-text {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 2.5px;
            color: #FFFFFF;
            text-transform: uppercase;
        }

        .headline {
            font-size: 78px;
            font-weight: 900;
            line-height: 0.98;
            letter-spacing: -2px;
            color: #FFFFFF;
            text-transform: uppercase;
            text-shadow: 0 10px 30px rgba(0,0,0,0.8);
            margin-bottom: 18px;
        }

        .headline .highlight {
            color: #00BFA6;
            display: block;
            text-shadow: 0 0 45px rgba(0, 191, 166, 0.6);
        }

        .subline {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 24px;
            font-weight: 800;
            color: #E5E7EB;
            line-height: 1.3;
            margin-bottom: 28px;
            max-width: 580px;
        }

        .tag-row {
            display: flex;
            gap: 12px;
        }

        .tag-badge {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
            font-weight: 800;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #FFFFFF;
            letter-spacing: 0.5px;
            backdrop-filter: blur(10px);
        }

        .tag-badge.cta {
            background: #00BFA6;
            color: #000;
            border-color: #00BFA6;
            font-weight: 900;
            box-shadow: 0 4px 20px rgba(0, 191, 166, 0.4);
        }
    </style>
</head>
<body>
    <img src="../assets/images/thumbnail_base.jpg" class="bg-img" alt="Background">
    <div class="scrim-left"></div>
    <div class="ambient-emerald"></div>

    <div class="content">
        <div class="brand-pill">
            <div class="brand-dot"></div>
            <div class="brand-text">DOMTOM CONNECT</div>
        </div>
        <h1 class="headline">
            LE PIÈGE
            <span class="highlight">DU DIRIGEANT</span>
        </h1>
        <p class="subline">Arrête de vouloir être un super-héros tout seul dans ton coin.</p>
        <div class="tag-row">
            <div class="tag-badge cta">STAY CO.</div>
            <div class="tag-badge">Caraïbes • Afrique • Diaspora</div>
        </div>
    </div>
</body>
</html>
