<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement Confirmé | Domtom Connect</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900;950&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 40px;
            border: 4px solid #000;
            box-shadow: 20px 20px 0px #000;
            padding: 60px 50px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .icon {
            width: 80px;
            height: 80px;
            background: #f0fdf4;
            border: 3px solid #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 30px;
            box-shadow: 5px 5px 0px #000;
        }
        h1 {
            font-size: 2.4rem;
            font-weight: 950;
            letter-spacing: -0.06em;
            color: #000;
            margin-bottom: 15px;
        }
        p {
            color: #64748b;
            font-weight: 700;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 10px;
        }
        .amount-box {
            background: #f0fdf4;
            border: 3px solid #000;
            border-radius: 20px;
            padding: 20px;
            margin: 30px 0;
            box-shadow: 5px 5px 0px #166534;
        }
        .amount-box .label {
            font-size: 0.75rem;
            font-weight: 950;
            text-transform: uppercase;
            color: #166534;
            letter-spacing: 0.05em;
        }
        .amount-box .value {
            font-size: 2rem;
            font-weight: 950;
            color: #000;
            margin-top: 5px;
        }
        .btn {
            display: inline-block;
            background: #000;
            color: #fff;
            border: none;
            padding: 18px 36px;
            border-radius: 100px;
            font-weight: 950;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            margin-top: 10px;
            box-shadow: 5px 5px 0px #475569;
            transition: transform 0.2s;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn-secondary {
            background: transparent;
            color: #64748b;
            border: none;
            font-weight: 900;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: underline;
            display: block;
            margin-top: 15px;
        }
        .confetti {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon" id="success-icon"><i class="fas fa-check-circle"></i></div>
        <h1 id="success-title">PAIEMENT CONFIRMÉ !</h1>
        <p id="success-msg">Votre achat a été validé avec succès.</p>
        <p id="sub-msg">L'expert a été notifié et vous contactera très prochainement.</p>

        <div class="amount-box">
            <div class="label" id="amount-label">Montant payé</div>
            <div class="value" id="amount-display">Chargement...</div>
        </div>

        <p style="font-size:0.8rem; margin-top:5px;" id="email-notif">
            Un e-mail de confirmation vous a été envoyé.
        </p>

        <a href="mon-espace.html" class="btn">Accéder à mon espace</a>
        
        <div id="event-actions" style="display:none; margin-top:20px; flex-direction:column; gap:12px; align-items:center;">
            <button onclick="downloadPDF()" class="btn" style="background:#10b981; box-shadow:5px 5px 0px #065f46; width:100%;"><i class="fas fa-download"></i> TÉLÉCHARGER MON BILLET (PDF)</button>
            <a id="calendar-link" href="#" target="_blank" class="btn-secondary" style="text-decoration:none; display:flex; align-items:center; gap:8px; justify-content:center;">
                <i class="fas fa-calendar-alt"></i> Ajouter à Google Calendar
            </a>
        </div>

        <a href="/" class="btn-secondary">Retour à l'accueil</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const sessionId = params.get('session_id');
        const type = params.get('type') || 'showcase';

        document.addEventListener('DOMContentLoaded', async () => {
            const title = document.getElementById('success-title');
            const msg = document.getElementById('success-msg');
            const subMsg = document.getElementById('sub-msg');
            const icon = document.getElementById('success-icon');
            const amountDisplay = document.getElementById('amount-display');

            // 1. UI Adjustments based on type
            if (type === 'subscription') {
                title.textContent = 'PACK ACTIVÉ !';
                msg.textContent = 'Votre abonnement est désormais actif.';
                subMsg.textContent = 'Vous avez maintenant accès à tous vos privilèges territoriaux.';
                icon.textContent = '<i class="fas fa-rocket"></i>';
                document.getElementById('amount-label').textContent = 'Statut';
                amountDisplay.textContent = 'ACTIF';
            } else if (type === 'quote') {
                title.textContent = 'DEVIS RÉGLÉ !';
                msg.textContent = 'Le paiement de votre devis a été reçu.';
                subMsg.textContent = 'La mission peut désormais débuter officiellement.';
                icon.textContent = '<i class="fas fa-file-alt"></i>';
            }

            // 2. Data Fetching
            if (sessionId) {
                try {
                    const table = type === 'showcase' ? 'showcase_orders' : (type === 'event' ? 'tickets' : 'business_docs');
                    const { data: order } = await window._supabase
                        .from(table)
                        .select('*')
                        .eq('stripe_session_id', sessionId)
                        .single();

                    if (order) {
                        const amount = order.total_price || order.total_amount || order.amount_paid;
                        amountDisplay.textContent = `${amount.toFixed(2)} €`;

                        if (type === 'event') {
                            document.getElementById('event-actions').style.display = 'flex';
                            prepareEventActions(order);
                        }
                    } else {
                        amountDisplay.textContent = 'Validé ✓';
                    }
                } catch (e) {
                    console.warn("Retry fetching order...");
                    setTimeout(() => window.location.reload(), 2000);
                }
            }
        });

        let eventData = null;
        let ticketData = null;

        async function prepareEventActions(ticket) {
            ticketData = ticket;
            const { data: ev } = await window._supabase.from('events').select('*').eq('id', ticket.event_id).single();
            if (ev) {
                eventData = ev;
                // Google Calendar Link
                const start = ev.event_date.replace(/-/g, '') + 'T180000Z'; // Dummy time if missing
                const end = ev.event_date.replace(/-/g, '') + 'T220000Z';
                const calUrl = `https://www.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(ev.title)}&details=${encodeURIComponent(ev.description || '')}&location=${encodeURIComponent(ev.location)}&dates=${start}/${end}`;
                document.getElementById('calendar-link').href = calUrl;
            }
        }

        async function downloadPDF() {
            if (!eventData || !ticketData) return;
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            // Style
            doc.setFillColor(15, 23, 42); // Navy
            doc.rect(0, 0, 210, 40, 'F');
            
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(22);
            doc.text('DOMTOM CONNECT', 20, 25);
            doc.setFontSize(10);
            doc.text('VOTRE BILLET OFFICIEL', 150, 25);

            doc.setTextColor(0, 0, 0);
            doc.setFontSize(28);
            doc.text(eventData.title.toUpperCase(), 20, 70);

            doc.setFontSize(12);
            doc.setTextColor(100, 100, 100);
            doc.text(`DATE : ${eventData.event_date}`, 20, 85);
            doc.text(`LIEU : ${eventData.location}`, 20, 95);
            
            doc.setDrawColor(226, 232, 240);
            doc.line(20, 110, 190, 110);

            doc.setFontSize(14);
            doc.setTextColor(0, 0, 0);
            doc.text('INFOS ACHETEUR', 20, 130);
            doc.setFontSize(11);
            doc.text(`Email : ${ticketData.buyer_email}`, 20, 140);
            doc.text(`Montant : ${ticketData.amount_paid.toFixed(2)} €`, 20, 150);

            // QR Code (Placeholder image or API)
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${ticketData.qr_token}`;
            doc.addImage(qrUrl, 'PNG', 140, 120, 50, 50);

            doc.setFontSize(9);
            doc.setTextColor(150, 150, 150);
            doc.text(`ID Billet : ${ticketData.id}`, 20, 280);
            doc.text('Présentez ce QR Code à l\'entrée de l\'événement.', 20, 285);

            doc.save(`Billet_${eventData.title.replace(/\s+/g, '_')}.pdf`);
        }

        // Auto-redirect
        setTimeout(() => {
            window.location.href = 'mon-espace.html';
        }, 15000);
    </script>
</body>
</html>
