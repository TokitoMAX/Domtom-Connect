<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Institutionnel – Domtom Connect</title>
    <link rel="stylesheet" href="../assets/css/style.css?v=3.5">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #10b981; --primary-dark: #059669; --secondary: #1e40af; --slate-900: #0f172a; }
        body { background-color: #f1f5f9; color: var(--slate-900); font-family: 'Inter', sans-serif; margin: 0; }
        .navbar { background: white; border-bottom: 1px solid #e2e8f0; padding: 12px 0; }
        .nav-logo { height: 38px; }
        .profile-hero { 
            background: #0f172a; padding: 100px 0 160px; color: white; position: relative; border-bottom: 4px solid var(--primary);
            background-image: radial-gradient(at 100% 0%, rgba(30, 64, 175, 0.3) 0, transparent 50%);
        }
        .hero-banner-bg { position: absolute; top: 0; left: 0; right: 0; height: 100%; z-index: 1; opacity: 0.4; }
        .hero-container { display: flex; align-items: center; gap: 40px; position: relative; z-index: 5; }
        .profile-avatar-large { width: 180px; height: 180px; border-radius: 32px; background: white; object-fit: cover; display: flex; align-items: center; justify-content: center; font-size: 4.5rem; font-weight: 950; color: #1e293b; border: 6px solid rgba(255,255,255,0.1); }
        .profile-name { font-size: 3.5rem; font-weight: 950; margin: 0; display: flex; align-items: center; gap: 16px; letter-spacing: -0.04em; }
        .verified-badge { background: #1e40af; color: white; font-size: 0.9rem; padding: 6px 14px; border-radius: 30px; display: inline-flex; align-items: center; gap: 8px; font-weight: 700; }
        .profile-title { font-size: 1.5rem; color: #3b82f6; font-weight: 800; margin-top: 8px; }
        .profile-main-grid { display: grid; grid-template-columns: 1fr 380px; gap: 40px; margin-top: -100px; position: relative; z-index: 10; }
        .profile-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); border-radius: 32px; padding: 48px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08); border: 1px solid rgba(255, 255, 255, 0.5); margin-bottom: 40px; }
        .section-title { font-size: 1.75rem; font-weight: 900; color: var(--slate-900); margin-bottom: 32px; display: flex; align-items: center; gap: 16px; }
        .section-title i { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; background: rgba(30, 64, 175, 0.1); color: #1e40af; border-radius: 14px; }
        .bio-text { line-height: 1.8; color: var(--slate-700); font-size: 1.15rem; font-weight: 500; }
        .portfolio-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .portfolio-card-premium { background: white; border: 1px solid #e2e8f0; border-radius: 20px; padding: 24px; transition: all 0.3s ease; }
        .portfolio-card-premium:hover { border-color: #1e40af; transform: translateY(-4px); }
        .contact-btn { display: flex; align-items: center; justify-content: center; width: 100%; padding: 18px; background: #1e40af; color: white; text-decoration: none; border-radius: 16px; font-weight: 800; }
        .metric-item { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .metric-item i { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: rgba(30, 64, 175, 0.1); color: #1e40af; border-radius: 10px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container"><a href="/"><img src="../assets/images/logo-domtomconnect.png" class="nav-logo"></a></div>
    </nav>

    <section class="profile-hero">
        <div id="p-banner" class="hero-banner-bg"></div>
        <div class="container container-large">
            <div class="hero-container">
                <div id="p-avatar" class="profile-avatar-large"></div>
                <div class="profile-hero-info">
                    <div class="role-type-pill company" style="background:rgba(16,185,129,0.1); color:#064e3b; padding:6px 12px; border-radius:8px; font-size:0.75rem; font-weight:800; display:inline-block; margin-bottom:12px;">Profil Institutionnel</div>
                    <h1 class="profile-name" id="p-name">Chargement...</h1>
                    <div class="profile-title" id="p-title">Institutional Hub</div>
                </div>
            </div>
        </div>
    </section>

    <main class="container">
        <div class="profile-main-grid">
            <div class="profile-content">
                <div class="profile-card">
                    <div class="section-title"><i class="fas fa-building"></i> Présentation Institutionnelle</div>
                    <div id="p-bio" class="bio-text">Chargement de la vision...</div>
                </div>
                <div class="profile-card">
                    <div class="section-title"><i class="fas fa-project-diagram"></i> Projets & Missions Publiés</div>
                    <div class="portfolio-grid" id="p-project-list"></div>
                </div>
            </div>
            <aside class="profile-sidebar">
                <div class="profile-card" style="padding: 28px;">
                    <a href="#" id="contact-link" class="contact-btn">Collaborer</a>
                    <div id="metrics-content" style="margin-top:24px;"></div>
                </div>
            </aside>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        async function loadCompanyProfile() {
            try {
                const id = new URLSearchParams(window.location.search).get('id');
                const { data: p, error } = await _supabase.from('profiles').select('*').eq('id', id).single();
                if (error || !p) return;

                document.title = `${p.company || p.full_name} - Entreprise | Domtom Connect`;
                
                // Banner
                if (p.banner_url) document.getElementById('p-banner').style.backgroundImage = `url(${p.banner_url})`;
                
                // Avatar
                const avatarEl = document.getElementById('p-avatar');
                if (p.avatar_url) avatarEl.innerHTML = `<img src="${p.avatar_url}" style="width:100%; height:100%; object-fit:cover; border-radius:18px;">`;
                else avatarEl.textContent = (p.company || p.full_name)[0].toUpperCase();

                // Name & Verified Badge
                const nameStr = p.company || p.full_name || 'Entreprise';
                document.getElementById('p-name').innerHTML = `${nameStr} <span class="verified-badge"><i class="fas fa-check-circle"></i> Vérifiée</span>`;
                document.getElementById('p-title').textContent = p.title || 'Institution / Entreprise';
                
                // Vision unifiée
                const bioStr = [p.bio, p.written_presentation].filter(t => t).join('\n\n');
                document.getElementById('p-bio').innerHTML = (bioStr || 'Vision institutionnelle en cours.').replace(/\n/g, '<br>');

                // Metrics
                const html = `
                    <div class="metric-item"><i class="fas fa-calendar-alt"></i><div><span style="font-size:0.75rem; color:#64748b;">CRÉATION</span><br><b>${p.creation_year || 'N/A'}</b></div></div>
                    <div class="metric-item"><i class="fas fa-users"></i><div><span style="font-size:0.75rem; color:#64748b;">ÉQUIPE</span><br><b>${p.team_size || 'N/A'}</b></div></div>
                    ${p.siret ? `<div class="metric-item"><i class="fas fa-balance-scale"></i><div><span style="font-size:0.75rem; color:#64748b;">SIRET</span><br><b style="font-size:0.8rem;">${p.siret}</b></div></div>` : ''}
                `;
                document.getElementById('metrics-content').innerHTML = html;

                // Projects
                const { data: projects } = await _supabase.from('projects').select('*').eq('owner_id', p.id).eq('is_listed', true);
                document.getElementById('p-project-list').innerHTML = (projects || []).map(proj => `
                    <div class="portfolio-card-premium">
                        <h4 style="margin:0;">${proj.title}</h4>
                        <p style="font-size:0.9rem; color:#64748b;">${proj.description?.slice(0, 100)}...</p>
                        <a href="project.html?id=${proj.id}" style="color:#1e40af; font-weight:700; text-decoration:none; font-size:0.85rem;">Voir le projet →</a>
                    </div>
                `).join('') || 'Aucun projet publié.';

                document.getElementById('contact-link').href = `../messages?to=${p.id}`;

            } catch (e) { console.error(e); }
        }
        document.addEventListener('DOMContentLoaded', loadCompanyProfile);
    </script>
</body>
</html>
