<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offres de Mission – Domtom Connect</title>
    <link rel="stylesheet" href="../assets/css/style.css?v=3.5">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Bandeau CTA publication */
        .expert-cta-banner {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 48px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }
        .expert-cta-banner::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.1) 0%, transparent 70%);
            pointer-events: none;
        }
        .expert-cta-banner p { font-size: 1rem; color: #cbd5e1; margin: 0; line-height: 1.6; position: relative; z-index: 1; }
        .expert-cta-banner strong { font-size: 1.25rem; font-weight: 800; color: white; display: block; margin-bottom: 8px; }

        /* Cartes Mission PREMIUM v4 (Malt-Style) */
        .premium-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 32px;
            display: flex;
            flex-direction: column;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
            overflow: hidden;
        }
        .premium-card:hover { transform: translateY(-4px); border-color: var(--primary); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05); }

        .premium-card-header { display: flex; align-items: center; gap: 20px; margin-bottom: 24px; }
        .company-logo-box {
            width: 64px; height: 64px; border-radius: 14px; background: #f8fafc; border: 1px solid #f1f5f9;
            display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 800;
            color: #64748b; overflow: hidden; flex-shrink: 0;
        }
        .company-logo-box img { width: 100%; height: 100%; object-fit: cover; }
        .job-title-line h3 { font-size: 1.4rem; font-weight: 900; color: #0f172a; margin: 0 0 6px 0; letter-spacing: -0.02em; }
        .job-meta-header { font-size: 0.9rem; font-weight: 600; color: #64748b; display: flex; align-items: center; gap: 12px; }

        .job-highlights-row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 24px; padding: 12px; background: #f8fafc; border-radius: 12px; border: 1px solid #f1f5f9; }
        .highlight-pill { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 700; color: #475569; background: white; padding: 6px 12px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .highlight-pill i { color: var(--primary); font-size: 0.9rem; }

        .job-segmented-content { margin-bottom: 24px; }
        .job-section { margin-bottom: 16px; }
        .job-section-title { font-size: 0.75rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        .job-section-body { font-size: 0.95rem; color: #334155; line-height: 1.6; }
        .job-section-body strong { color: #0f172a; font-weight: 700; }

        .premium-actions { display: flex; align-items: center; gap: 16px; margin-top: auto; border-top: 1px solid #f1f5f9; padding-top: 24px; }
        .btn-postuler-premium { background: #0f172a; color: white; border: none; border-radius: 12px; padding: 14px 28px; font-size: 1rem; font-weight: 800; flex: 1; cursor: pointer; transition: all 0.2s; text-align: center; box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.1); }
        .btn-postuler-premium:hover { background: #1e293b; transform: translateY(-2px); }
        .btn-postuler-premium:disabled { background: #f1f5f9; color: #94a3b8; cursor: not-allowed; transform: none; box-shadow: none; }

        .btn-delete { background: #fff; color: #94a3b8; border: 1px solid #e2e8f0; width: 40px; height: 40px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .btn-delete:hover { background: #fef2f2; color: #ef4444; border-color: #fee2e2; }

        .locked-data { filter: grayscale(1) opacity(0.3); user-select: none; pointer-events: none; }
        .premium-lock-badge { background: #f8fafc; color: #64748b; font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 4px; border: 1px solid #e2e8f0; text-transform: uppercase; }

        /* Search Bar */
        .search-bar-v3 { background: white; border-radius: 16px; padding: 10px; box-shadow: 0 10px 25px -10px rgba(15, 23, 42, 0.1); display: flex; gap: 10px; max-width: 1000px; margin: -40px auto 32px; position: relative; z-index: 100; border: 1px solid #f1f5f9; }
        .search-bar-v3 input, .search-bar-v3 select { border: 1px solid #f1f5f9; background: #f8fafc; border-radius: 12px; padding: 12px 18px; font-weight: 600; font-size: 0.9rem; color: #1e293b; transition: all 0.2s; }
        .search-bar-v3 input:focus, .search-bar-v3 select:focus { outline: none; border-color: #0ea5e9; background: white; }

        /* Modals */
        .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.6); z-index: 10000; display: none; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(8px); }
        .modal-overlay.open { display: flex; }
        .modal { background: white; border-radius: 24px; padding: 32px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; position: relative; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .modal-close { background: #f1f5f9; border: none; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 1.2rem; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 800; color: #64748b; margin-bottom: 8px; text-transform: uppercase; }
        .form-input, .form-select, .form-textarea { width: 100%; padding: 12px 16px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 0.95rem; background: #f8fafc; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

        @media (max-width: 768px) { .search-bar-v3 { flex-direction: column; margin-top: 20px; } .form-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="nav-brand">
                <img src="../assets/images/logo-domtomconnect.png" alt="Logo" class="nav-logo">
                <span class="nav-brand-name">Domtom Connect</span>
            </a>
            <div class="nav-content">
                <div class="nav-links">
                    <a href="/marketplace/directory">Talents</a>
                    <a href="/marketplace/jobs">Missions</a>
                    <a href="/marketplace/projects">Projets</a>
                    <a href="/marketplace/companies">Entreprises</a>
                </div>
                <div class="nav-actions" id="nav-actions-container"></div>
            </div>
        </div>
    </nav>

    <header class="directory-header">
        <div class="container">
            <div class="section-header">
                <h1>Missions & Opportunités</h1>
                <p>Trouvez votre prochain projet stratégique au cœur de la diaspora.</p>
            </div>
            <div class="search-bar-v3">
                <input type="text" id="search-input" placeholder="Mots-clés..." style="flex: 2;">
                <select id="type-filter" style="flex: 1;">
                    <option value="">Contrat</option>
                    <option value="CDI">CDI</option><option value="CDD">CDD</option><option value="Freelance">Freelance</option>
                </select>
                <button class="cta-button primary" onclick="loadJobs()">Filtrer</button>
            </div>
        </div>
    </header>

    <main class="container" style="padding: 60px 24px;">
        <div class="expert-cta-banner" id="company-banner" style="display:none;">
            <div>
                <p><strong>Recrutez un expert stratégique</strong></p>
                <p>Publiez votre fiche de poste en 2 minutes.</p>
            </div>
            <button class="cta-button primary" onclick="openJobModal()">Publier une offre</button>
        </div>
        <div class="directory-grid" id="jobs-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 32px;"></div>
        <div id="empty-state" style="display: none; text-align: center; padding: 100px 0;">
            <p style="font-size: 1.5rem; font-weight: 800;">Aucune mission trouvée</p>
        </div>
    </main>

    <!-- Modal Postuler -->
    <div id="apply-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="apply-modal-job-title">Postuler</h2>
                <button class="modal-close" onclick="closeApplyModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Note de motivation</label>
                    <textarea id="apply-note" class="form-textarea" style="min-height: 150px;"></textarea>
                </div>
                <button class="btn-postuler-premium" id="btn-confirm-apply" style="width: 100%;">Confirmer ma candidature</button>
            </div>
        </div>
    </div>

    <!-- Modal Job (Post/Edit) -->
    <div id="job-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="job-modal-title">Publier une offre</h2>
                <button class="modal-close" onclick="closeJobModal()">&times;</button>
            </div>
            <form onsubmit="saveJob(event)">
                <div class="form-group">
                    <label>Titre du poste</label>
                    <input type="text" id="j-title" class="form-input" required>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Type</label><select id="j-type" class="form-select"><option value="Freelance">Freelance</option><option value="CDI">CDI</option></select></div>
                    <div class="form-group"><label>Zone</label><select id="j-territory" class="form-select"><option value="Martinique">Martinique</option><option value="Guadeloupe">Guadeloupe</option><option value="Guyane">Guyane</option><option value="Réunion">Réunion</option></select></div>
                </div>
                <div class="form-group">
                    <label>Missions</label>
                    <textarea id="j-missions" class="form-textarea" style="min-height: 100px;" required></textarea>
                </div>
                <div class="form-group">
                    <label>Profil Recherché</label>
                    <textarea id="j-profil" class="form-textarea" style="min-height: 100px;" required></textarea>
                </div>
                <button type="submit" class="btn-postuler-premium" id="modal-save-btn" style="width:100%;">Publier</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        let currentUserId = null, currentUserRole = null, cachedProfiles = {}, currentSubscriptionTier = 'free', userApplications = [], allJobs = [], currentEditJobId = null;

        async function init() {
            const session = await getSession();
            if (session) {
                currentUserId = session.user.id;
                const { data: profile } = await _supabase.from('profiles').select('*').eq('id', currentUserId).single();
                if (profile) {
                    currentUserRole = profile.role;
                    currentSubscriptionTier = profile.subscription_tier || 'free';
                    if (currentUserRole === 'entreprise') document.getElementById('company-banner').style.display = 'flex';
                }
                const { data: apps } = await _supabase.from('job_applications').select('job_id').eq('candidate_id', currentUserId);
                if (apps) userApplications = apps.map(a => a.job_id);
            }
            await loadGlobalNavbar();
            await loadJobs();
        }

        async function loadJobs() {
            const { data: jobs } = await _supabase.from('job_offers').select('*').eq('is_active', true).order('created_at', { ascending: false });
            allJobs = jobs || [];
            if (allJobs.length > 0) {
                const companyIds = [...new Set(allJobs.map(j => j.company_id))];
                const { data: profiles } = await _supabase.from('profiles').select('id, full_name, avatar_url').in('id', companyIds);
                profiles.forEach(p => cachedProfiles[p.id] = p);
            }
            renderJobs();
        }

        function parseMarkdown(text) {
            if (!text) return "";
            return text
                .replace(/### (.*)/g, '<h4 style="margin: 16px 0 8px 0; color: #0f172a; font-size: 1rem;">$1</h4>')
                .replace(/\*\*(.*)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
        }

        function renderJobs() {
            const container = document.getElementById('jobs-container');
            container.innerHTML = allJobs.map(renderJobCard).join('');
        }

        function renderJobCard(job) {
            const company = cachedProfiles[job.company_id] || { full_name: 'Entreprise' };
            const logo = company.avatar_url ? `<img src="${company.avatar_url}">` : company.full_name.slice(0, 2).toUpperCase();
            const isPremium = ['authority', 'influence', 'business'].includes(currentSubscriptionTier);
            const isOwner = currentUserId === job.company_id;
            const canSee = isPremium || isOwner || currentUserRole === 'basique';
            
            let d = job.description || "";
            let missionsRaw = d.split('### PROFIL')[0].replace('### MISSIONS', '').trim();
            let profilRaw = d.includes('### PROFIL') ? d.split('### PROFIL')[1].trim() : "Non spécifié.";

            const missions = parseMarkdown(missionsRaw);
            const profil = parseMarkdown(profilRaw);

            return `
                <div class="premium-card">
                    <div class="premium-card-header">
                        <div class="company-logo-box">${logo}</div>
                        <div class="job-title-line">
                            <div class="job-meta-header"><span>${canSee ? company.full_name : 'Confidentiel'}</span></div>
                            <h3>${job.title}</h3>
                        </div>
                    </div>
                    <div class="job-highlights-row">
                        <div class="highlight-pill"><i class="fas fa-file-contract"></i> ${job.mission_type}</div>
                        <div class="highlight-pill"><i class="fas fa-map-marker-alt"></i> ${job.territory}</div>
                    </div>
                    <div class="job-segmented-content ${!canSee ? 'locked-data' : ''}">
                        <div class="job-section"><div class="job-section-title">🚀 La Mission</div><div class="job-section-body">${missions}</div></div>
                        <div class="job-section"><div class="job-section-title">👤 Profil</div><div class="job-section-body">${profil}</div></div>
                    </div>
                    <div class="premium-actions">
                        ${isOwner ? '<button class="btn-postuler-premium" disabled>Votre offre</button>' : 
                          userApplications.includes(job.id) ? '<button class="btn-postuler-premium" disabled>Candidature envoyée</button>' :
                          canSee ? `<button onclick="openApplyModal('${job.id}','${job.title}')" class="btn-postuler-premium">Postuler</button>` :
                          '<button class="btn-postuler-premium" style="background:#ef4444;">Pack Premium Requis</button>'}
                    </div>
                </div>`;
        }

        async function saveJob(e) {
            e.preventDefault();
            const data = {
                company_id: currentUserId,
                title: document.getElementById('j-title').value,
                description: `### MISSIONS\n${document.getElementById('j-missions').value}\n\n### PROFIL\n${document.getElementById('j-profil').value}`,
                mission_type: document.getElementById('j-type').value,
                territory: document.getElementById('j-territory').value,
                is_active: true
            };
            const { error } = await _supabase.from('job_offers').insert([data]);
            if (error) alert(error.message); else location.reload();
        }

        function openJobModal() { document.getElementById('job-modal').classList.add('open'); }
        function closeJobModal() { document.getElementById('job-modal').classList.remove('open'); }
        function openApplyModal(id, title) { document.getElementById('apply-modal-job-title').textContent = title; document.getElementById('apply-modal').classList.add('open'); }
        function closeApplyModal() { document.getElementById('apply-modal').classList.remove('open'); }

        init();
    </script>
</body>
</html>
