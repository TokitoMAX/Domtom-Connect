<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solutions d'Experts – Domtom Connect</title>
    <link rel="stylesheet" href="../assets/css/style.css?v=11.1">
    <style>
        :root {
            --primary: #10b981;
            --slate-950: #020617;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--slate-950);
            color: #f8fafc;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        .hero-solutions {
            padding: 140px 0 100px;
            background: radial-gradient(circle at 0% 0%, rgba(16, 185, 129, 0.15) 0%, transparent 40%),
                        radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.1) 0%, transparent 40%);
            text-align: center;
            position: relative;
        }

        .hero-glow {
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 1000px; height: 600px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.1) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
        }

        .badge-premium {
            display: inline-flex;
            align-items: center;
            padding: 8px 20px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 100px;
            color: #34d399;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            margin-bottom: 32px;
        }

        .title-hero {
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            font-weight: 950;
            letter-spacing: -0.05em;
            margin: 0 0 24px 0;
            line-height: 1;
            color: #ffffff;
        }

        .subtitle-hero {
            font-size: 1.25rem;
            color: #94a3b8;
            max-width: 700px;
            margin: 0 auto;
            font-weight: 500;
            line-height: 1.6;
        }

        /* GRID */
        .solutions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 40px;
            padding: 80px 0 120px;
        }

        .card-solution {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 32px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
            overflow: hidden;
        }

        .card-solution:hover {
            transform: translateY(-10px);
            border-color: rgba(16, 185, 129, 0.4);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.5);
        }

        .card-image {
            width: 100%;
            height: 220px;
            border-radius: 20px;
            object-fit: cover;
            background: #0f172a;
        }

        .card-category {
            position: absolute;
            top: 48px; left: 48px;
            background: rgba(16, 185, 129, 0.9);
            color: #064e3b;
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 0.7rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .card-title {
            font-size: 1.6rem;
            font-weight: 900;
            color: white;
            margin: 0;
            letter-spacing: -0.02em;
        }

        .card-desc {
            font-size: 0.95rem;
            color: #94a3b8;
            line-height: 1.6;
            font-weight: 500;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-footer {
            margin-top: auto;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-expert {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-avatar {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: var(--primary);
            color: #064e3b;
            display: flex;
            align-items: center; justify-content: center;
            font-weight: 900;
            font-size: 0.9rem;
            border: 2px solid rgba(255,255,255,0.1);
        }

        .card-price {
            font-weight: 950;
            font-size: 1.4rem;
            color: var(--primary);
        }

        @media (max-width: 768px) {
            .hero-solutions { padding: 100px 0 60px; }
            .solutions-grid { grid-template-columns: 1fr; padding: 24px; }
            .card-solution { padding: 24px; }
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.9);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .modal-overlay.open {
            display: flex;
        }
    </style>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/ui-components.js?v=11.2"></script>
    <script src="../assets/js/modules/showcase.module.js?v=11.1"></script>
</head>
<body>
    <nav class="navbar" style="background:transparent; border:none;"></nav>

    <header class="hero-solutions">
        <div class="hero-glow"></div>
        <div class="container">
            <div class="badge-premium">Marketplace d'Excellence</div>
            <h1 class="title-hero">Les Solutions d'Experts</h1>
            <p class="subtitle-hero">Propulsez vos projets avec les meilleurs services de l'écosystème territorial. Expertises certifiées et accompagnement sur-mesure.</p>
        </div>
    </header>

    <main class="container">
        <div id="solutions-list" class="solutions-grid">
            <div style="grid-column: 1/-1; text-align: center; padding: 100px;">
                <div style="width:40px; height:40px; border:3px solid rgba(16, 185, 129, 0.1); border-top-color:var(--primary); border-radius:50%; animation:spin 1s linear infinite; margin:0 auto;"></div>
                <p style="margin-top:20px; color:#64748b; font-weight:800; text-transform:uppercase; font-size:0.75rem; letter-spacing:0.1em;">Récupération des offres...</p>
            </div>
        </div>
    </main>

    <div id="details-modal-overlay" class="modal-overlay"></div>

    <script>
        async function init() {
            console.log("[Solutions] Initializing...");
            
            // 1. Robust Supabase Check
            const db = window._supabase || (typeof initSupabase === 'function' ? initSupabase() : null);
            if (!db) {
                console.warn("[Solutions] Supabase not ready, retrying...");
                return setTimeout(init, 100);
            }

            // 2. Load Navbar
            if (typeof loadGlobalNavbar === 'function') await loadGlobalNavbar();
            
            // 3. Load Data
            await loadSolutions();
        }

        async function loadSolutions() {
            const db = window._supabase || (typeof initSupabase === 'function' ? initSupabase() : null);
            const container = document.getElementById('solutions-list');
            if (!container) return;

            // Loading state
            container.innerHTML = `
                <div style="grid-column: 1/-1; text-align: center; padding: 100px;">
                    <div style="width:40px; height:40px; border:3px solid rgba(16, 185, 129, 0.1); border-top-color:var(--primary); border-radius:50%; animation:spin 1s linear infinite; margin:0 auto;"></div>
                    <p style="margin-top:20px; color:#64748b; font-weight:800; text-transform:uppercase; font-size:0.75rem; letter-spacing:0.1em;">Récupération des offres...</p>
                </div>
            `;

            try {
                const { data, error } = await db
                    .from('showcase_items')
                    .select('*, profiles(full_name, avatar_url, role)')
                    .eq('status', 'active')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 100px;"><h2 style="font-weight:950; color:#64748b;">Aucune solution disponible pour le moment.</h2></div>';
                    return;
                }

                container.innerHTML = data.map(item => {
                    const expert = item.profiles || {};
                    const isCompany = expert.role === 'entreprise';
                    const profileLink = isCompany ? `profile-detail-company.html?id=${item.user_id}` : `profile-detail-expert.html?id=${item.user_id}`;
                    
                    return `
                        <div class="card-solution" onclick="ShowcaseModule.openPublicItemModal('${item.id}')">
                            <div class="card-category">${isCompany ? 'Entreprise' : 'Expert'}</div>
                            ${item.image_url ? `<img src="${item.image_url}" class="card-image">` : `<div class="card-image" style="display:flex; align-items:center; justify-content:center; font-size:4rem; opacity:0.1;">🚀</div>`}
                            <h3 class="card-title">${item.title}</h3>
                            <p class="card-desc">${item.description || 'Expertise dédiée au développement territorial.'}</p>
                            <div class="card-footer">
                                <div class="card-expert" onclick="event.stopPropagation(); window.location.href='${profileLink}'">
                                    <div class="card-avatar">
                                        ${expert.avatar_url ? `<img src="${expert.avatar_url}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">` : (expert.full_name?.charAt(0) || 'E')}
                                    </div>
                                    <span style="font-size:0.9rem; font-weight:800; color:white;">${expert.full_name}</span>
                                </div>
                                <div class="card-price">${item.price ? item.price.toFixed(0) : '0'}€</div>
                            </div>
                        </div>
                    `;
                }).join('');

                if (window.UIComponents && window.UIComponents.applyAuthWall) {
                    window.UIComponents.applyAuthWall(container, 'solutions');
                }

            } catch (err) {
                console.error('[Solutions] Error:', err);
                container.innerHTML = '<p style="grid-column: 1/-1; text-align:center; padding:100px; font-weight:700; color:#ef4444;">Erreur de chargement des solutions.</p>';
            }
        }

        init();
    </script>

    <style>@keyframes spin { to { transform: rotate(360deg); } } </style>
</body>
</html>
