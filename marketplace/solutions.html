<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solutions & Offres d'Experts - Domtom Connect</title>
    <link rel="stylesheet" href="../assets/css/style.css?v=11.1">
    <link rel="stylesheet" href="../assets/css/directory.css?v=1.1">
    <style>
        .solutions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 32px;
            padding: 40px 0 80px;
        }

        .solution-card {
            background: #ffffff;
            border: 1px solid #f1f5f9;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .solution-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
            border-color: #10b981;
        }

        .solution-image {
            width: 100%;
            height: 200px;
            border-radius: 16px;
            object-fit: cover;
            background: #f8fafc;
        }

        .solution-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .solution-category {
            background: rgba(16, 185, 129, 0.1);
            color: #059669;
            padding: 6px 12px;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .solution-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: #111827;
            margin: 0;
            letter-spacing: -0.02em;
        }

        .solution-desc {
            font-size: 0.95rem;
            color: #4b5563;
            line-height: 1.6;
            font-weight: 500;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .solution-footer {
            margin-top: auto;
            border-top: 1px solid #f1f5f9;
            padding-top: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .expert-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .expert-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #f1f5f9;
            color: #10b981;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 800;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .investment-tag {
            font-weight: 900;
            font-size: 1.2rem;
            color: #10b981;
        }

        /* Hero */
        .solutions-hero {
            background: radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.05) 0px, transparent 50%),
                        radial-gradient(at 100% 0%, rgba(17, 24, 39, 0.03) 0px, transparent 50%),
                        #ffffff;
            padding: 120px 0 80px;
            text-align: center;
            border-bottom: 1px solid #f1f5f9;
        }

        .hero-badge {
            display: inline-block;
            background: #1e293b;
            color: #fff;
            padding: 6px 16px;
            border-radius: 100px;
            font-weight: 800;
            font-size: 0.8rem;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .hero-title-main {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 900;
            letter-spacing: -0.04em;
            color: #111827;
            margin: 0 0 16px 0;
        }

        @media (max-width: 768px) {
            .solutions-hero { padding: 80px 0 40px; }
            .solutions-grid { grid-template-columns: 1fr; padding: 24px; gap: 24px; }
            body, html { overflow-x: hidden !important; }
        }

        /* Modal Overlay - Institutional */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none; align-items: flex-start; justify-content: center;
            z-index: 10000;
            overflow-y: auto;
            padding: 40px 20px;
        }
        .modal-overlay.open { display: flex; }
        .showcase-modal-close {
            position: absolute; top: 20px; right: 20px;
            background: rgba(15, 23, 42, 0.1); color: #0f172a; border: none;
            width: 40px; height: 40px; border-radius: 50%;
            font-size: 1.5rem; cursor: pointer; z-index: 10;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .showcase-modal-close:hover {
            background: #0f172a; color: white;
        }
    </style>

    <!-- CORE PLATFORM SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/ui-components.js?v=11.1"></script>
    <script src="../assets/js/modules/showcase.module.js?v=11.1"></script>
</head>
<body style="background: #fdfdfd;">
    <nav class="navbar">
        <div class="container"></div>
    </nav>

    <header class="solutions-hero">
        <div class="container">
            <span class="hero-badge">Offres & Services</span>
            <h1 class="hero-title-main">Les Solutions d'Experts</h1>
            <p style="font-size: 1.2rem; color: #64748b; font-weight: 750; max-width: 600px; margin: 0 auto;">Découvrez les services exclusifs et l'accompagnement sur-mesure de notre écosystème territorial.</p>
        </div>
    </header>

    <main class="container">
        <div id="solutions-list" class="solutions-grid">
            <!-- Shimmer / Loader -->
             <div style="grid-column: 1/-1; text-align: center; padding: 80px;">
                <div class="loader" style="width:50px; height:50px; border:4px solid #000; border-top-color:transparent; border-radius:50%; animation:spin 1s linear infinite; margin:0 auto;"></div>
             </div>
        </div>
    </main>

    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>

    <div id="details-modal-overlay" class="modal-overlay"></div>

    <script>
        async function loadSolutions() {
            const db = window._supabase || (typeof initSupabase === 'function' ? initSupabase() : null);
            if (!db) return setTimeout(loadSolutions, 500);

            const container = document.getElementById('solutions-list');
            try {
                const { data, error } = await db
                    .from('showcase_items')
                    .select('*, profiles(full_name, avatar_url, territory)')
                    .eq('status', 'active')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 80px;"><h2 style="font-weight:950;">Aucune solution publiée pour le moment.</h2></div>';
                    return;
                }

                container.innerHTML = data.map(item => {
                    const expert = item.profiles || {};
                    const isCompany = expert.role === 'entreprise';
                    const profileLink = isCompany ? `profile-detail-company.html?id=${item.user_id}` : `profile-detail-expert.html?id=${item.user_id}`;
                    
                    return `
                        <div class="solution-card" onclick="ShowcaseModule.openPublicItemModal('${item.id}')">
                            <div style="position:relative;">
                                ${item.image_url ? `<img src="${item.image_url}" class="solution-image">` : `<div class="solution-image" style="display:flex; align-items:center; justify-content:center; font-size:3rem; opacity:0.1;">🚀</div>`}
                                <div style="position:absolute; bottom:15px; left:15px;" class="solution-category">${isCompany ? 'Entreprise' : 'Expert'}</div>
                            </div>
                            <div class="solution-header">
                                <h3 class="solution-title">${item.title}</h3>
                            </div>
                            <p class="solution-desc">${item.description || 'Expertise dédiée à l\'accélération de vos projets territoriaux.'}</p>
                            
                            <div class="solution-footer">
                                <div class="expert-info" onclick="event.stopPropagation(); window.location.href='${profileLink}'" title="Voir le profil">
                                    <div class="expert-avatar">
                                        ${expert.avatar_url ? `<img src="${expert.avatar_url}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">` : (expert.full_name?.charAt(0) || 'E')}
                                    </div>
                                    <span style="font-size:0.85rem; font-weight:900; color:#000;">${expert.full_name}</span>
                                </div>
                                <div class="investment-tag">${item.price_prefix || 'À partir de'} ${item.price.toFixed(0)}€</div>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error("Load Solutions Error:", err);
                container.innerHTML = '<p>Erreur lors du chargement des solutions.</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (typeof loadGlobalNavbar === 'function') loadGlobalNavbar();
            loadSolutions();
        });
    </script>

    <footer style="background: #fff; border-top: 3.5px solid #000; padding: 60px 0; margin-top: 80px;">
        <div class="container">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 30px;">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <img src="../assets/images/logo-domtomconnect.png" style="height: 30px; filter: grayscale(1); border: 2px solid #000; border-radius: 5px; padding: 2px;">
                    <p style="font-size: 0.85rem; color: #000; font-weight: 900;">&copy; 2026 Domtom Connect. Propulser l'Excellence.</p>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
