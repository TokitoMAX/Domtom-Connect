<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solutions & Offres d'Experts - Domtom Connect</title>
    <link rel="stylesheet" href="../assets/css/style.css?v=11.1">
    <link rel="stylesheet" href="../assets/css/directory.css?v=1.1">
    <link rel="stylesheet" href="../assets/css/brutalist-showcase.css">
    <link rel="icon" type="image/png" href="../assets/images/logo-domtomconnect.png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        .solutions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            padding: 40px 0;
        }

        .solution-card {
            background: white;
            border: 3px solid #000;
            border-radius: 30px;
            padding: 24px;
            box-shadow: 8px 8px 0px #000;
            transition: transform 0.2s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .solution-card:hover {
            transform: translate(-4px, -4px);
            box-shadow: 12px 12px 0px #000;
        }

        .solution-image {
            width: 100%;
            height: 200px;
            border-radius: 20px;
            border: 2.5px solid #000;
            object-fit: cover;
            background: #f1f5f9;
        }

        .solution-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .solution-category {
            background: #10b981;
            color: white;
            padding: 4px 12px;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 900;
            border: 2px solid #000;
        }

        .solution-title {
            font-size: 1.4rem;
            font-weight: 950;
            color: #000;
            margin: 0;
            letter-spacing: -0.04em;
        }

        .solution-desc {
            font-size: 0.95rem;
            color: #64748b;
            line-height: 1.5;
            font-weight: 700;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .solution-footer {
            margin-top: auto;
            border-top: 2px solid #f1f5f9;
            padding-top: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .expert-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .expert-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1.5px solid #000;
            background: #000;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 900;
        }

        .investment-tag {
            font-weight: 950;
            font-size: 1.1rem;
            color: #000;
        }

        /* Hero */
        .solutions-hero {
            background: #fff;
            padding: 100px 0 60px;
            text-align: center;
            border-bottom: 3px solid #000;
        }

        .hero-badge {
            display: inline-block;
            background: #000;
            color: #fff;
            padding: 6px 16px;
            border-radius: 100px;
            font-weight: 950;
            font-size: 0.8rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .hero-title-main {
            font-size: 3.5rem;
            font-weight: 950;
            letter-spacing: -0.06em;
            margin: 0 0 15px 0;
        }

        @media (max-width: 768px) {
            .hero-title-main { font-size: 2.2rem; }
            .solutions-grid { grid-template-columns: 1fr; padding: 20px; }
        }

        /* Modal Overlay Brute */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            display: none; align-items: center; justify-content: center;
            z-index: 10000;
        }
        .modal-overlay.open { display: flex; }
        .showcase-modal-close {
            position: absolute; top: 25px; right: 25px;
            background: #000; color: #fff; border: none;
            width: 45px; height: 45px; border-radius: 50%;
            font-size: 1.5rem; cursor: pointer; z-index: 10;
            display: flex; align-items: center; justify-content: center;
        }
    </style>

    <!-- CORE PLATFORM SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/ui-components.js?v=11.1"></script>
    <script src="../assets/js/modules/showcase.module.js?v=11.1"></script>
</head>
<body style="background: #fdfdfd;">
    <nav class="navbar">
        <div class="container"></div>
    </nav>

    <header class="solutions-hero">
        <div class="container">
            <span class="hero-badge">Offres & Services</span>
            <h1 class="hero-title-main">Les Solutions d'Experts</h1>
            <p style="font-size: 1.2rem; color: #64748b; font-weight: 750; max-width: 600px; margin: 0 auto;">Découvrez les services exclusifs et l'accompagnement sur-mesure de notre écosystème territorial.</p>
        </div>
    </header>

    <main class="container">
        <div id="solutions-list" class="solutions-grid">
            <!-- Shimmer / Loader -->
             <div style="grid-column: 1/-1; text-align: center; padding: 80px;">
                <div class="loader" style="width:50px; height:50px; border:4px solid #000; border-top-color:transparent; border-radius:50%; animation:spin 1s linear infinite; margin:0 auto;"></div>
             </div>
        </div>
    </main>

    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>

    <div id="details-modal-overlay" class="modal-overlay"></div>

    <script>
        async function loadSolutions() {
            const db = window._supabase || (typeof initSupabase === 'function' ? initSupabase() : null);
            if (!db) return setTimeout(loadSolutions, 500);

            const container = document.getElementById('solutions-list');
            try {
                const { data, error } = await db
                    .from('showcase_items')
                    .select('*, profiles(full_name, avatar_url, territory)')
                    .eq('status', 'active')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 80px;"><h2 style="font-weight:950;">Aucune solution publiée pour le moment.</h2></div>';
                    return;
                }

                container.innerHTML = data.map(item => {
                    const expert = item.profiles || {};
                    return `
                        <div class="solution-card" onclick="ShowcaseModule.openPublicItemModal('${item.id}')">
                            <div style="position:relative;">
                                ${item.image_url ? `<img src="${item.image_url}" class="solution-image">` : `<div class="solution-image" style="display:flex; align-items:center; justify-content:center; font-size:3rem; opacity:0.1;">🚀</div>`}
                                <div style="position:absolute; bottom:15px; left:15px;" class="solution-category">Solution</div>
                            </div>
                            <div class="solution-header">
                                <h3 class="solution-title">${item.title}</h3>
                            </div>
                            <p class="solution-desc">${item.description || 'Expertise dédiée à l\'accélération de vos projets territoriaux.'}</p>
                            
                            <div class="solution-footer">
                                <div class="expert-info" onclick="event.stopPropagation(); window.location.href='profile-detail-expert.html?id=${item.user_id}'" title="Voir le profil de l'expert">
                                    <div class="expert-avatar">
                                        ${expert.avatar_url ? `<img src="${expert.avatar_url}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">` : (expert.full_name?.charAt(0) || 'E')}
                                    </div>
                                    <span style="font-size:0.85rem; font-weight:900; color:#000;">${expert.full_name}</span>
                                </div>
                                <div class="investment-tag">${item.price_prefix || 'À partir de'} ${item.price.toFixed(0)}€</div>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error("Load Solutions Error:", err);
                container.innerHTML = '<p>Erreur lors du chargement des solutions.</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (typeof loadGlobalNavbar === 'function') loadGlobalNavbar();
            loadSolutions();
        });
    </script>

    <footer style="background: #fff; border-top: 3.5px solid #000; padding: 60px 0; margin-top: 80px;">
        <div class="container">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 30px;">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <img src="../assets/images/logo-domtomconnect.png" style="height: 30px; filter: grayscale(1); border: 2px solid #000; border-radius: 5px; padding: 2px;">
                    <p style="font-size: 0.85rem; color: #000; font-weight: 900;">&copy; 2026 Domtom Connect. Propulser l'Excellence.</p>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
