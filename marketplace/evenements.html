<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags -->
    <title>Événements Professionnels & Networking DOM-TOM | Domtom Connect</title>
    <meta name="description" content="Découvrez les ateliers, webinaires et rencontres professionnelles aux Antilles et en Guyane. Boostez votre réseau et vos compétences avec les événements de la communauté.">
    <meta name="keywords" content="événements pro antilles, networking guyane, webinaire entrepreneuriat, rencontres business outre-mer, ateliers pro">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://domtomconnect.com/marketplace/evenements">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://domtomconnect.com/marketplace/evenements">
    <meta property="og:title" content="Événements Professionnels & Networking DOM-TOM | Domtom Connect">
    <meta property="og:description" content="Rejoignez les événements qui font bouger les territoires ultramarins.">
    <meta property="og:image" content="https://domtomconnect.com/assets/images/logo-domtomconnect.png">
    <meta property="og:locale" content="fr_FR">
    <meta property="og:site_name" content="Domtom Connect">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://domtomconnect.com/marketplace/evenements">
    <meta property="twitter:title" content="Événements Professionnels & Networking DOM-TOM | Domtom Connect">
    <meta property="twitter:description" content="Développez votre réseau au sein de la diaspora stratégique.">
    <meta property="twitter:image" content="https://domtomconnect.com/assets/images/logo-domtomconnect.png">

    <link rel="stylesheet" href="../assets/css/style.css?v=10.1">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0B0F19;
            --bg-card: #131B2F;
            --bg-card-hover: #1A243D;
            --primary: #00D586;
            --text-main: #FFFFFF;
            --text-muted: #9CA3AF;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(0, 213, 134, 0.3);
            --gradient-accent: linear-gradient(135deg, #00D586 0%, #009660 100%);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Hero Section */
        .directory-header {
            position: relative;
            padding: 120px 0 60px;
            text-align: center;
            overflow: hidden;
            background: var(--bg-main);
        }

        .hero-bg-glow {
            position: absolute;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 600px;
            background: radial-gradient(circle, rgba(0,213,134,0.1) 0%, rgba(11,15,25,0) 70%);
            z-index: 0;
            pointer-events: none;
        }

        .header-content {
            position: relative;
            z-index: 2;
        }

        .header-content h1 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 20px;
            background: linear-gradient(180deg, #FFFFFF 0%, #A1A1AA 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-content p {
            font-size: 1.2rem;
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto 40px;
        }

        /* Search Bar */
        .search-container {
            max-width: 700px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
            padding: 0 5%;
        }

        .search-bar-premium {
            background: rgba(19, 27, 47, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 10px;
            display: flex;
            gap: 10px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .search-field {
            flex-grow: 1;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 14px 20px;
            color: white;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }

        .search-field:focus {
            border-color: var(--primary);
            background: rgba(255,255,255,0.06);
        }

        .btn-search {
            background: var(--gradient-accent);
            border: none;
            color: #000;
            padding: 14px 28px;
            border-radius: 18px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-search:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 20px rgba(0,213,134,0.2);
        }

        /* Create Event CTA */
        .create-event-cta {
            margin-top: 30px;
            text-align: center;
        }

        .btn-create {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 700;
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: rgba(255,255,255,0.02);
            transition: all 0.3s;
        }

        .btn-create:hover {
            color: white;
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.2);
        }

        /* Events Grid */
        .directory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 32px;
            padding: 60px 5%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .event-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
        }

        .event-card:hover {
            transform: translateY(-10px);
            border-color: var(--border-hover);
            background: var(--bg-card-hover);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.5);
        }

        .event-image-container {
            position: relative;
            width: 100%;
            padding-top: 75%; /* 4:3 aspect ratio */
            background: #1A243D;
        }

        .event-image {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .event-card:hover .event-image {
            transform: scale(1.1);
        }

        .date-badge {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            padding: 8px 16px;
            border-radius: 14px;
            font-weight: 800;
            color: white;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 5;
        }

        .event-body {
            padding: 28px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .event-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: white;
            margin: 0 0 12px 0;
            line-height: 1.2;
            text-transform: uppercase;
            letter-spacing: -0.5px;
        }

        .event-location {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .event-desc {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin: 0 0 28px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .btn-reserver {
            width: 100%;
            background: var(--gradient-accent);
            color: #000;
            border: none;
            border-radius: 16px;
            padding: 16px;
            font-size: 1rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
            margin-top: auto;
        }

        .btn-reserver:hover {
            box-shadow: 0 10px 25px rgba(0,213,134,0.3);
            transform: scale(1.02);
        }

        .event-footer {
            padding: 16px 28px;
            border-top: 1px solid var(--border-color);
            background: rgba(255,255,255,0.02);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .author-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .author-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--primary);
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 900;
            border: 2px solid var(--bg-card);
        }

        .author-img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--bg-card);
        }

        @media (max-width: 600px) {
            .search-bar-premium {
                flex-direction: column;
                border-radius: 32px;
            }
            .btn-search {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="container"></div>
    </nav>

    <header class="directory-header">
        <div class="hero-bg-glow"></div>
        <div class="header-content">
            <div class="container">
                <h1>Événements de la Communauté</h1>
                <p>Découvrez les ateliers, webinaires et rencontres qui font bouger les territoires ultramarins.</p>
            </div>
        </div>

        <div class="search-container">
            <div class="search-bar-premium">
                <input type="text" id="search-input" class="search-field" placeholder="Rechercher un événement, un lieu..." onkeyup="if(event.key === 'Enter') loadEvents()">
                <button class="btn-search" onclick="loadEvents()">RECHERCHER</button>
            </div>
            
            <div class="create-event-cta">
                <a href="../mon-espace#billetterie?action=create" class="btn-create">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Publier un événement
                </a>
            </div>
        </div>
    </header>

    <main>
        <div class="directory-grid" id="events-container"></div>

        <div id="empty-state" style="display: none; text-align: center; padding: 100px 5%;">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.5" style="margin-bottom: 20px; opacity: 0.5;"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>
            <p style="font-size: 1.2rem; color: var(--text-muted);">Aucun événement à venir pour le moment.</p>
        </div>
    </main>

    <footer style="background: #0B0F19; border-top: 1px solid var(--border-color); padding: 80px 0 40px; margin-top: 100px;">
        <div class="container">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 40px;">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <img src="../assets/images/logo-domtomconnect.png" style="height: 35px; filter: brightness(0) invert(1); opacity: 0.5;">
                    <p style="font-size: 0.9rem; color: var(--text-muted);">&copy; 2026 Domtom Connect. L'expertise au service des territoires.</p>
                </div>
                <div style="display: flex; gap: 40px;">
                    <a href="../support.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem; font-weight: 700; transition: 0.3s;">Support & Aide</a>
                    <a href="#" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem; font-weight: 700; transition: 0.3s;">Confidentialité</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/ui-components.js?v=10.1"></script>
    <script>
        async function init() {
            console.log("[Events] Initializing...");
            
            // 1. Robust Supabase Check
            const db = window._supabase || (typeof initSupabase === 'function' ? initSupabase() : null);
            if (!db) {
                console.warn("[Events] Supabase not ready, retrying...");
                return setTimeout(init, 100);
            }

            // 2. Load Navbar
            if (typeof loadGlobalNavbar === 'function') await loadGlobalNavbar();
            
            // 3. Load Data
            await loadEvents();
        }

        async function loadEvents() {
            const container = document.getElementById('events-container');
            const emptyState = document.getElementById('empty-state');
            if (!container) return;

            // Loading state
            container.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding:100px;"><i class="fas fa-circle-notch fa-spin" style="font-size:3rem; color:var(--primary);"></i><p style="margin-top:20px; font-weight:700; color:var(--text-muted);">Récupération des événements...</p></div>';
            
            try {
                const db = window._supabase || initSupabase();
                const search = document.getElementById('search-input').value.toLowerCase().trim();

                const { data: events, error } = await db
                    .from('events')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!events || events.length === 0) {
                    emptyState.style.display = 'block';
                    container.style.display = 'none';
                    return;
                }

                // Fetch profiles for authors
                const userIds = [...new Set(events.map(e => e.user_id))];
                const { data: profilesData } = await db
                    .from('profiles')
                    .select('id, full_name, avatar_url')
                    .in('id', userIds);
                    
                const profilesMap = {};
                if (profilesData) profilesData.forEach(p => profilesMap[p.id] = p);

                let filtered = events.map(e => ({
                    ...e,
                    profiles: profilesMap[e.user_id] || null
                }));

                if (search) {
                    filtered = filtered.filter(e => 
                        (e.title || "").toLowerCase().includes(search) || 
                        (e.location || "").toLowerCase().includes(search)
                    );
                }

                if (!filtered.length) {
                    emptyState.style.display = 'block';
                    container.style.display = 'none';
                    return;
                }
                
                emptyState.style.display = 'none';
                container.style.display = 'grid';
                container.innerHTML = filtered.map(renderEventCard).join('');
                
                if (window.UIComponents && window.UIComponents.applyAuthWall) {
                    window.UIComponents.applyAuthWall(container, 'événements');
                }
            } catch (err) {
                console.error('[Events] Error:', err);
                emptyState.style.display = 'block';
                if (container) container.style.display = 'none';
            }
        }

        function renderEventCard(ev) {
            const authorName = ev.profiles?.full_name || 'Membre du réseau';
            const initials = authorName.slice(0, 2).toUpperCase();
            const avatar = ev.profiles?.avatar_url 
                ? `<img src="${ev.profiles.avatar_url}" class="author-img">`
                : `<div class="author-avatar">${initials}</div>`;

            return `
                <div class="event-card" onclick="window.location.href='evenement-details.html?id=${ev.id}'">
                    <div class="event-image-container">
                        <img src="${ev.image_url}" class="event-image" alt="${ev.title}">
                        <div class="date-badge">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                            ${ev.event_date}
                        </div>
                    </div>

                    <div class="event-body">
                        <h3 class="event-title">${ev.title}</h3>
                        
                        <div class="event-location">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="flex-shrink:0; margin-top:2px; color: var(--primary);"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
                            <span>${ev.location}</span>
                        </div>

                        <p class="event-desc">${ev.description || 'Rejoignez cet événement exclusif organisé par la communauté Domtom Connect.'}</p>
                        
                        <div class="btn-reserver">
                            Réserver mon pass
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a3 3 0 0 1 3-3h14a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V9z"/><path d="M2 9s3 6 4.5 9M22 9s-3 6-4.5 9"/></svg>
                        </div>
                    </div>

                    <div class="event-footer">
                        <div class="author-box">
                            ${avatar}
                            <span>${authorName}</span>
                        </div>
                        <span style="opacity: 0.6;">Organisateur</span>
                    </div>
                </div>
            `;
        }

        init();
    </script>
</body>
</html>
