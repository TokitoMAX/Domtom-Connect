<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner de Billets – Domtom Connect</title>
    <link rel="stylesheet" href="../assets/css/style.css?v=3.5">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #0f172a;
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .scanner-header {
            padding: 24px;
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .scanner-header h1 {
            font-size: 1.4rem;
            font-weight: 800;
            margin: 0;
        }

        #reader {
            width: 100%;
            height: 100%;
            background: black;
        }

        #result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .result-card {
            background: white;
            color: #0f172a;
            width: 85%;
            max-width: 400px;
            padding: 40px;
            border-radius: 32px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform: scale(0.8);
            transition: transform 0.3s;
        }

        #result-overlay.active {
            display: flex;
            background: rgba(0,0,0,0.85);
        }

        #result-overlay.active .result-card {
            transform: scale(1);
        }

        .result-icon {
            font-size: 5rem;
            margin-bottom: 24px;
        }

        .result-status {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .result-details {
            color: #64748b;
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 32px;
        }

        .btn-next {
            background: #0f172a;
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 100px;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
        }

        .scanner-controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 100;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 12px 24px;
            border-radius: 100px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="scanner-header">
        <h1 id="event-title">Scanner les entrées</h1>
        <div id="event-stats" style="font-size: 0.85rem; color: #94a3b8; font-weight: 600; margin-top: 4px;">Référence: --</div>
        <div id="scanner-debug" style="display:none; font-family:monospace; font-size:10px; color:#10b981; margin-top:8px; background:rgba(0,0,0,0.3); padding:4px; border-radius:4px;">Ready...</div>
    </div>

    <div id="reader"></div>

    <div id="result-overlay">
        <div class="result-card">
            <div id="res-icon" class="result-icon">🎟️</div>
            <div id="res-status" class="result-status">Validé</div>
            <div id="res-details" class="result-details">Billet n°1234 - VIP</div>
            <button class="btn-next" onclick="resetScanner()">Continuer le scan</button>
        </div>
    </div>

    <div class="scanner-controls">
        <button class="control-btn" onclick="toggleDebug()">Debug</button>
        <button class="control-btn" onclick="switchCamera()">Caméra</button>
        <button class="control-btn" onclick="window.history.back()">Quitter</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        let html5QrCode;
        let isProcessing = false;
        let currentCamera = "environment";
        let targetEventId = null;

        async function initScanner() {
            const urlParams = new URLSearchParams(window.location.search);
            targetEventId = urlParams.get('event_id');
            
            if (!targetEventId) {
                alert("ID de l'événement manquant.");
                window.history.back();
                return;
            }

            // Load Event Info
            const { data: ev } = await _supabase.from('events').select('title').eq('id', targetEventId).single();
            if (ev) {
                document.getElementById('event-title').innerText = ev.title;
                document.getElementById('event-stats').innerText = "Vérification en temps réel active";
            }

            html5QrCode = new Html5Qrcode("reader");
            startScanning();
        }

        function startScanning() {
            const config = { fps: 10, qrbox: { width: 250, height: 250 } };
            html5QrCode.start({ facingMode: currentCamera }, config, onScanSuccess)
                .catch(err => {
                    console.error("Camera error", err);
                    alert("Erreur de caméra. Assurez-vous d'avoir autorisé l'accès.");
                });
        }

        async function onScanSuccess(decodedText) {
            if (isProcessing) return;
            isProcessing = true;
            
            // Audio feedback
            const beep = new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3');
            beep.play().catch(() => {});

            try {
                // Pre-process decoded text
                let token = decodedText.trim();
                
                // If it's a URL (e.g. from a direct scan), try to extract the token
                if (token.includes('?token=')) {
                    token = token.split('?token=')[1];
                } else if (token.includes('/')) {
                    // Handle potential trailing slashes or full paths
                    const parts = token.split('/');
                    token = parts[parts.length - 1];
                }

                console.log("Recherche du billet avec le token:", token);

                // Search for the ticket
                const { data: ticket, error } = await _supabase
                    .from('tickets')
                    .select('*, profiles(full_name)')
                    .eq('qr_token', token)
                    .single();

                if (error || !ticket) {
                    showResult('error', 'Billet Invalide', `Code non reconnu: ${token.substring(0,10)}...`);
                    return;
                }

                if (ticket.event_id !== targetEventId) {
                    showResult('warning', 'Mauvais Événement', 'Ce billet n\'est pas pour cet événement.');
                    return;
                }

                if (ticket.status === 'utilisé') {
                    showResult('warning', 'Déjà Utilisé', `Billet ${ticket.tier_name} utilisé à ${new Date(ticket.updated_at).toLocaleTimeString()}`);
                    return;
                }

                // Mark as used
                const { error: updateError } = await _supabase
                    .from('tickets')
                    .update({ status: 'utilisé', updated_at: new Date().toISOString() })
                    .eq('id', ticket.id);

                if (updateError) throw updateError;

                showResult('success', 'Entrée Validée', `${ticket.tier_name} - ${ticket.quantity} personne(s)`);

            } catch (err) {
                console.error(err);
                showResult('error', 'Erreur Système', 'Impossible de vérifier le billet. Vérifiez votre connexion.');
            }
        }

        function showResult(type, status, details) {
            const overlay = document.getElementById('result-overlay');
            const icon = document.getElementById('res-icon');
            const statusEl = document.getElementById('res-status');
            const detailsEl = document.getElementById('res-details');

            overlay.className = 'active';
            statusEl.innerText = status;
            detailsEl.innerText = details;

            if (type === 'success') {
                icon.innerText = '✅';
                statusEl.style.color = 'var(--success)';
            } else if (type === 'warning') {
                icon.innerText = '⚠️';
                statusEl.style.color = 'var(--warning)';
            } else {
                icon.innerText = '❌';
                statusEl.style.color = 'var(--error)';
            }
        }

        function resetScanner() {
            document.getElementById('result-overlay').className = '';
            isProcessing = false;
        }

        function switchCamera() {
            currentCamera = currentCamera === "user" ? "environment" : "user";
            html5QrCode.stop().then(() => startScanning());
        }

        function toggleDebug() {
            const deb = document.getElementById('scanner-debug');
            deb.style.display = deb.style.display === 'none' ? 'block' : 'none';
        }

        function debugLog(msg) {
            const deb = document.getElementById('scanner-debug');
            deb.innerText = `[DEBUG] ${msg}`;
            console.log(`[SCANNER DEBUG] ${msg}`);
        }

        window.onload = initScanner;
    </script>
</body>
</html>
