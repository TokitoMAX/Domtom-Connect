<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Chargement du Profil... | Domtom Connect</title>
    <link rel="stylesheet" href="../assets/css/style.css?v=10.1">
    <style>
        body { background: #0f172a; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: 'Inter', sans-serif; margin: 0; }
        .router-box { text-align: center; }
        .spinner { width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.1); border-top-color: #10b981; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-1C5QTWZFER"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-1C5QTWZFER');
</script>
</head>
<body>
    <div class="router-box">
        <div class="spinner"></div>
        <p>Redirection vers le profil professionnel...</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        async function routeProfile() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const id = urlParams.get('id');
                if (!id) { window.location.href = 'directory.html'; return; }

                // Fetch minimal profile data to determine role
                const { data: p, error } = await _supabase.from('profiles').select('role').eq('id', id).single();
                
                if (error || !p) {
                    console.error("Profil introuvable");
                    window.location.href = 'directory.html';
                    return;
                }

                // NEW SEO-FRIENDLY REDIRECTION
                let cleanPath = '/marketplace/expert/';
                if (p.role === 'entreprise') {
                    cleanPath = '/marketplace/company/';
                }
                
                window.location.replace(`${cleanPath}${id}`);

            } catch (err) {
                console.error("Router error:", err);
                window.location.href = '/marketplace/directory';
            }
        }
        document.addEventListener('DOMContentLoaded', routeProfile);
    </script>
</body>
</html>
