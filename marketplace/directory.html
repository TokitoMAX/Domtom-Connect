<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annuaire des Experts – Domtom Connect</title>
    <link rel="stylesheet" href="../assets/css/style.css?v=3.4">
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <a href="../index.html" class="nav-brand">
                <img src="../assets/images/logo-domtomconnect.png" alt="Domtom Connect" class="nav-logo">
                <span class="nav-brand-name">Domtom Connect</span>
            </a>
            <button class="nav-toggle" type="button" aria-label="Menu" aria-expanded="false"
                aria-controls="primary-navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="nav-content" id="primary-navigation">
                <div class="nav-links">
                    <a href="../index.html">Accueil</a>
                    <a href="#">Annuaire</a>
                </div>
                <div class="nav-actions" id="nav-actions">
                    <!-- Rempli dynamiquement par JS selon la session -->
                </div>
            </div>
        </div>
    </nav>

    <header class="directory-header">
        <div class="container">
            <div class="section-header">
                <h1>Annuaire des Experts</h1>
                <p>Trouvez les meilleurs talents de la diaspora et des territoires d'Outre-mer.</p>
            </div>

            <div class="search-bar-v3">
                <div class="search-input-wrapper">
                    <input type="text" id="search-input" placeholder="Rechercher une compétence, un nom...">
                </div>
                <div class="search-select-wrapper">
                    <select id="territory-filter">
                        <option value="">Tous les territoires</option>
                        <option value="Guadeloupe">Guadeloupe</option>
                        <option value="Martinique">Martinique</option>
                        <option value="Guyane">Guyane</option>
                        <option value="Réunion">Réunion</option>
                        <option value="Mayotte">Mayotte</option>
                    </select>
                </div>
                <button class="cta-button primary" style="padding: 12px 24px;">Filtrer</button>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="directory-grid" id="profiles-container" style="display: none;">
            <!-- Profils injectés dynamiquement depuis Supabase -->
        </div>

        <div id="empty-state" style="display: none; text-align: center; padding: 80px 0;">
            <p style="font-size: 1.2rem; color: var(--text-secondary);">Aucun expert n'a encore rejoint l'annuaire.</p>
            <p style="color: var(--text-muted);">
                Revenez bientôt ou
                <a href="../registration/onboarding.html" style="color: var(--emerald-color); font-weight: 600;">
                    créez votre profil Expert
                </a>.
            </p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        async function init() {
            const session = await getSession();

            // Rediriger vers login si pas connecté
            if (!session) {
                window.location.href = '../login.html';
                return;
            }

            // Mettre à jour la navbar avec le vrai nom de l'utilisateur
            const name = session.user.user_metadata.full_name || session.user.email.split('@')[0];
            document.getElementById('nav-actions').innerHTML = `
                <div class="user-menu-wrapper">
                    <span class="user-greeting">Hello, ${name}</span>
                    <button onclick="signOut()" class="cta-button secondary nav-logout-btn">
                        Déconnexion
                    </button>
                </div>
            `;

            // Charger les profils
            await loadProfiles();
        }

        async function loadProfiles() {
            const container = document.getElementById('profiles-container');
            const emptyState = document.getElementById('empty-state');

            try {
                const territory = document.getElementById('territory-filter').value;
                const experts = await getExperts({ territory: territory || undefined });

                if (!experts.length) {
                    emptyState.style.display = 'block';
                    container.style.display = 'none';
                    return;
                }

                emptyState.style.display = 'none';
                container.style.display = 'grid';
                container.innerHTML = experts.map(profile => renderProfileCard(profile)).join('');

            } catch (err) {
                console.error('Erreur chargement profils :', err);
                emptyState.style.display = 'block';
            }
        }

        function renderProfileCard(profile) {
            const name = profile.full_name || 'Anonyme';
            const initials = name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
            const isPro = profile.tier === 'pro'; // Simulate PRO tier for display

            const avatar = profile.avatar_url
                ? `<img src="${profile.avatar_url}" class="avatar" alt="${name}">`
                : `<div class="avatar" style="background: ${isPro ? '#8B5CF6' : '#111827'}; display:flex; align-items:center; justify-content:center; color:white; font-weight:700; font-size:1.2rem;">${initials}</div>`;

            return `
                <div class="profile-card" style="${isPro ? 'border: 2px solid #8B5CF6; box-shadow: 0 10px 30px rgba(139, 92, 246, 0.1);' : ''}">
                    ${isPro ? '<div class="pro-ribbon" style="position: absolute; top: 12px; right: 12px; background: #8B5CF6; color: white; padding: 4px 8px; border-radius: 6px; font-size: 0.65rem; font-weight: 700; text-transform: uppercase;">PRO Authority</div>' : ''}
                    <div class="profile-header">
                        ${avatar}
                        <div class="profile-info">
                            <h3 style="display: flex; align-items: center; gap: 6px;">
                                ${name}
                                ${profile.verified ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="#10b981"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>' : ''}
                            </h3>
                            <div class="profile-role">${profile.skills || 'Expert Domtom Connect'}</div>
                        </div>
                    </div>
                    <div class="profile-stats">
                        <div class="stat-item">
                            <span class="stat-value">${profile.tjm ? profile.tjm + '€' : '500€'}</span>
                            <span class="stat-label">TJM</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value">${profile.territory || 'Antilles'}</span>
                            <span class="stat-label">Zone</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value">${isPro ? 'Top 1%' : 'Actif'}</span>
                            <span class="stat-label">Statut</span>
                        </div>
                    </div>
                    ${profile.bio ? `<p class="profile-bio" style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 12px; line-height: 1.5;">${profile.bio}</p>` : `<p class="profile-bio" style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 12px; line-height: 1.5;">Expert passionné par le développement économique des territoires d'Outre-mer.</p>`}
                    
                    <div style="margin-top: auto; padding-top: 16px;">
                        <button class="cta-button secondary" style="width: 100%; font-size: 0.8rem; padding: 8px;">Voir le Portfolio</button>
                    </div>
                </div>
            `;
        }
    </script>
    <script src="../assets/js/script.js?v=2.2"></script>
</body>

</html>
