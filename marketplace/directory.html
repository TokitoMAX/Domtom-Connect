<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annuaire des Talents & Experts - Domtom Connect</title>
    <link rel="stylesheet" href="/assets/css/style.css?v=2.1">
    <link rel="stylesheet" href="/assets/css/directory.css?v=1.1">
    <link rel="icon" type="image/png" href="/assets/images/logo-domtomconnect.png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <nav class="nav-links" id="nav-links-container"></nav>
        </div>
    </header>

    <header class="directory-hero">
        <div class="container">
            <h1 class="hero-title">Trouvez l'expertise pour vos projets territoriaux</h1>
            <p class="hero-subtitle">Le réseau d'élite des talents d'Outre-mer et de l'international.</p>
            
            <div class="search-filter-bar">
                <div class="search-group">
                    <input type="text" id="search-name" placeholder="Rechercher par nom ou expertise (ex: Marketing, Tech...)">
                </div>
                <div class="filter-group">
                    <select id="filter-territory">
                        <option value="">Tous les Territoires</option>
                        <optgroup label="Antilles-Guyane">
                            <option value="Guadeloupe">Guadeloupe</option>
                            <option value="Martinique">Martinique</option>
                            <option value="Guyane">Guyane</option>
                            <option value="Saint-Martin">Saint-Martin</option>
                        </optgroup>
                        <optgroup label="Océan Indien">
                            <option value="Réunion">La Réunion</option>
                            <option value="Mayotte">Mayotte</option>
                        </optgroup>
                    </select>
                </div>
                <button class="cta-button primary" onclick="loadProfiles()">Filtrer</button>
            </div>
        </div>
    </header>

    <main class="container" style="padding-top: 32px;">
        <div class="directory-grid" id="profiles-container">
             <div style="grid-column: 1/-1; text-align: center; padding: 60px;">
                <div class="splash-loader" style="margin: 0 auto; border-top-color: #10b981;"></div>
                <p style="margin-top:20px; color:#64748b;">Initialisation du réseau...</p>
             </div>
        </div>
    </main>

    <footer style="background: #fff; border-top: 1px solid #e2e8f0; padding: 60px 0; margin-top: 80px;">
        <div class="container">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 30px;">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <img src="/assets/images/logo-domtomconnect.png" style="height: 30px; filter: grayscale(1); opacity: 0.6;">
                    <p style="font-size: 0.85rem; color: #94a3b8;">&copy; 2026 Domtom Connect. Tous droits réservés.</p>
                </div>
                <a href="/support" style="color:#64748b; font-weight:700; text-decoration:none;">Support & Aide</a>
            </div>
        </div>
    </footer>

    <!-- CORE PLATFORM SCRIPTS (Standardized Order) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/assets/js/territory_config.js?v=9.5"></script>
    <script src="/assets/js/auth.js?v=9.5"></script>
    <script src="/assets/js/ui-components.js?v=9.5"></script>
    <script src="/assets/js/app.js?v=9.5"></script>
    <script src="/assets/js/script.js?v=9.5"></script>
    
    <!-- Local Logic -->
    <script>
        async function loadProfiles() {
            const db = window._supabase || (typeof window.initSupabase === 'function' ? window.initSupabase() : null);
            if (!db) {
                setTimeout(loadProfiles, 500);
                return;
            }

            const container = document.getElementById('profiles-container');
            const search = document.getElementById('search-name').value.toLowerCase();
            const territory = document.getElementById('filter-territory').value;

            try {
                let query = db.from('profiles').select('*').eq('role', 'expert').eq('is_published', true);
                if (territory) query = query.eq('territory', territory);
                
                const { data, error } = await query;
                if (error) throw error;

                if (!data || data.length === 0) {
                    container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 80px;"><h3>Aucun expert trouvé.</h3></div>';
                    return;
                }

                container.innerHTML = data.map(p => `
                    <div class="profile-card" onclick="window.location.href='/marketplace/expert/${p.id}'" style="cursor:pointer;">
                        <div class="profile-avatar">${p.full_name ? p.full_name.charAt(0) : 'E'}</div>
                        <h3 class="profile-name">${p.full_name}</h3>
                        <p class="profile-role">${p.expertise || 'Expert Territorial'}</p>
                        <div class="profile-territory">${p.territory}</div>
                        <div class="profile-stats">
                            <span>${p.tjm || '---'} €/j</span>
                        </div>
                    </div>
                `).join('');

            } catch (err) {
                console.error("Load Profiles Error:", err);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            let checkApp = setInterval(() => {
                if (window._supabase) {
                    clearInterval(checkApp);
                    loadProfiles();
                }
            }, 500);
        });
    </script>
</body>
</html>
