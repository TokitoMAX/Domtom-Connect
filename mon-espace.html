    <style>
        /* Force display for legacy containers when needed */
        .view-section { transition: opacity 0.3s ease; }

        /* PREMIUM MOBILE MENU */
        .mobile-menu-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.98);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            z-index: 10001;
            display: none;
            flex-direction: column;
            padding: 60px 32px;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            color: white;
        }
        .mobile-menu-overlay.active {
            display: flex;
            opacity: 1;
        }

        .mobile-menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .mobile-logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: #00D586;
        }

        .close-menu {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 14px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .mobile-menu-links {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            overflow-y: auto;
        }

        .mobile-menu-links a {
            font-size: 0.9rem;
            font-weight: 700;
            color: white;
            text-decoration: none;
            padding: 16px 8px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            text-align: center;
            transition: all 0.2s;
        }

        .mobile-menu-links a:active {
            background: #00D586;
            color: #0f172a;
            transform: scale(0.98);
        }

        /* Nav Toggle Animation */
        .nav-toggle span {
            display: block;
            width: 24px;
            height: 2.5px;
            background: #0f172a;
            margin: 5px 0;
            transition: 0.3s;
            border-radius: 4px;
        }
        .nav-toggle.active span:nth-child(1) { transform: translateY(7.5px) rotate(45deg); }
        .nav-toggle.active span:nth-child(2) { opacity: 0; }
        .nav-toggle.active span:nth-child(3) { transform: translateY(-7.5px) rotate(-45deg); }
    </style>
</head>

    <script>
        // Inline UI Helpers (Restored for Dashboard context)
        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu-overlay');
            const btn = document.getElementById('mobile-menu-toggle');
            if (menu) {
                menu.classList.toggle('active');
                if (btn) btn.classList.toggle('active');
            }
        }

        function syncNavActiveState() {
            const hash = window.location.hash || '#overview';
            
            // 1. Mobile Bottom Bar Links
            document.querySelectorAll('.mobile-nav-link').forEach(link => {
                const href = link.getAttribute('href');
                if (href && href.startsWith('#')) {
                    link.classList.toggle('active', href === hash);
                }
            });

            // 2. Desktop Sidebar Links
            document.querySelectorAll('.sidebar-link').forEach(link => {
                const href = link.getAttribute('href');
                if (href) {
                    const isHashMatch = href.includes(hash);
                    const isOverviewMatch = hash === '#overview' && (href.endsWith('mon-espace.html') || href.endsWith('mon-espace') || !href.includes('#'));
                    link.classList.toggle('active', isHashMatch || isOverviewMatch);
                }
            });
        }

        /**
         * Robust Link Adjustment
         * Ensures hardcoded relative links work even after router changes the path
         */
        function fixNavigationLinks() {
            if (!window.UIComponents) return;
            
            // Detect Project Root from script tag to avoid being fooled by SPA virtual paths
            const appScript = document.querySelector('script[src*="app.js"]');
            const siteRoot = appScript ? appScript.src.split('assets/js/app.js')[0] : (window.location.origin + '/');
            
            document.querySelectorAll('.nav-market-link, .mobile-nav-link, .mobile-menu-links a, .top-nav-logo, .sidebar-brand, .nav-brand').forEach(link => {
                if (!link.dataset.originalHref) {
                    link.dataset.originalHref = link.getAttribute('href');
                }
                
                const href = link.dataset.originalHref;
                if (href && !href.startsWith('#') && !href.startsWith('javascript:') && !href.startsWith('http')) {
                    // Always resolve relative to the fixed Site Root
                    const absoluteUrl = new URL(href, siteRoot).href;
                    link.href = absoluteUrl;
                    console.log(`[NavFix] Project Root: ${siteRoot} | Resolved ${href} -> ${absoluteUrl}`);
                }
            });
        }

        window.addEventListener('hashchange', () => {
            syncNavActiveState();
            fixNavigationLinks();
        });
        document.addEventListener('DOMContentLoaded', () => {
            syncNavActiveState();
            fixNavigationLinks();
            
            // Global Interceptor to force clean SPA navigation or external redirects
            document.addEventListener('click', (e) => {
                const link = e.target.closest('.nav-market-link, .top-nav-logo, .sidebar-link, .mobile-nav-link, .mobile-menu-links a, .sidebar-brand, .nav-brand');
                if (link) {
                    const href = link.getAttribute('href');
                    if (!href || href.startsWith('javascript:') || href.includes('mailto:')) return;

                    // If it's an internal dashboard link, use the Router
                    if (href.includes('mon-espace') || href.startsWith('#') || !href.includes('.html')) {
                        console.log("[NavFix] SPA Navigation for:", href);
                        if (window.Router) {
                            e.preventDefault();
                            window.Router.navigate(href);
                        }
                    } else {
                        // External or other module navigation
                        console.log("[NavFix] Forcing external navigation to:", link.href);
                        e.preventDefault();
                        window.location.href = link.href;
                    }
                }
            });
        });
    </script>

            <h3 style="font-size: 1.5rem; font-weight: 900; color: #0f172a; margin-bottom: 24px; letter-spacing: -0.02em;">Créer une Demande de Paiement</h3>

                    <label class="saas-form-label" style="display: block; font-size: 0.75rem; font-weight: 800; color: #64748b; text-transform: uppercase; margin-bottom: 8px;">Description du service ou devis</label>

                <div class="saas-form-group" style="margin-bottom: 24px;">
                    <label class="saas-form-label" style="display: block; font-size: 0.75rem; font-weight: 800; color: #64748b; text-transform: uppercase; margin-bottom: 8px;">Montant (€ EUR)</label>
                    <div style="position: relative;">
                        <input type="number" id="pay-req-amount" class="saas-input" placeholder="0.00" min="5" step="0.01" required style="width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid #e2e8f0; font-size: 0.95rem; padding-right: 40px;">
                        <span style="position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font-weight: 700; color: #64748b;">€</span>
                    </div>
                </div>
                <div class="saas-form-group" style="margin-bottom: 24px;">
                    <label class="saas-form-label" style="display: block; font-size: 0.75rem; font-weight: 800; color: #64748b; text-transform: uppercase; margin-bottom: 8px;">Acompte requis (%)</label>
                    <select id="pay-req-acompte" class="saas-input" style="width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid #e2e8f0; font-size: 0.95rem; background: white; font-weight: 700;">
                        <option value="100">100% (Paiement Total)</option>
                        <option value="50">50% d'acompte</option>
                        <option value="30" selected>30% d'acompte</option>
                        <option value="10">10% d'acompte</option>
                    </select>
                </div>
                <button type="submit" style="width: 100%; padding: 14px; background: #0f172a; color: white; border: none; border-radius: 12px; font-weight: 900; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15); transition: background 0.2s;">
