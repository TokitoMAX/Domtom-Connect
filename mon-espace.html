    <style>
        /* Force display for legacy containers when needed */
        .view-section { transition: opacity 0.3s ease; }

        /* Mobile Bottom Sheet Menu */
        .mobile-menu-sheet {
            position: fixed;
            bottom: -100%;
            left: 0;
            right: 0;
            background: #ffffff;
            z-index: 10001;
            border-top-left-radius: 32px;
            border-top-right-radius: 32px;
            padding: 24px;
            padding-bottom: max(24px, env(safe-area-inset-bottom, 40px));
            transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            pointer-events: none;
        }

        .mobile-menu-sheet.active {
            transform: translateY(-100%);
            pointer-events: auto;
        }

        .sheet-handle {
            width: 40px;
            height: 5px;
            background: #e2e8f0;
            border-radius: 10px;
            margin: 0 auto 24px auto;
        }

        .mobile-menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .mobile-logo {
            font-size: 1.5rem;
            font-weight: 900;
            color: #0f172a;
            letter-spacing: -0.02em;
        }

        .close-menu {
            background: #f1f5f9;
            border: none;
            color: #64748b;
            width: 36px;
            height: 36px;
            border-radius: 12px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .close-menu:active {
            background: #e2e8f0;
        }

        .mobile-menu-links {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-height: 60vh;
            overflow-y: auto;
        }

        .mobile-menu-links a {
            font-size: 0.85rem;
            font-weight: 700;
            color: #334155;
            text-decoration: none;
            padding: 16px 8px;
            background: #f8fafc;
            border: 1px solid #f1f5f9;
            border-radius: 16px;
            text-align: center;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        
        .mobile-menu-links a i {
            font-size: 1.25rem;
            color: #10b981;
            transition: color 0.2s;
        }

        .mobile-menu-links a:active {
            background: #10b981;
            color: white;
            transform: scale(0.98);
        }
        
        .mobile-menu-links a:active i {
            color: white;
        }

        /* Nav Toggle Animation */
        .nav-toggle span {
            display: block;
            width: 24px;
            height: 2.5px;
            background: #0f172a;
            margin: 5px 0;
            transition: 0.3s;
            border-radius: 4px;
        }
        .nav-toggle.active span:nth-child(1) { transform: translateY(7.5px) rotate(45deg); }
        .nav-toggle.active span:nth-child(2) { opacity: 0; }
        .nav-toggle.active span:nth-child(3) { transform: translateY(-7.5px) rotate(-45deg); }
    </style>

    <script>
        // Inline UI Helpers (Restored for Dashboard context)
        function toggleMobileMenu() {
            const sheet = document.getElementById('mobile-menu-sheet');
            const backdrop = document.getElementById('mobile-menu-backdrop');
            const btn = document.getElementById('mobile-menu-toggle');
            
            if (sheet && backdrop) {
                const isActive = sheet.classList.contains('active');
                if (isActive) {
                    sheet.classList.remove('active');
                    backdrop.style.opacity = '0';
                    setTimeout(() => backdrop.style.display = 'none', 300);
                } else {
                    backdrop.style.display = 'block';
                    // Force reflow
                    void backdrop.offsetWidth;
                    backdrop.style.opacity = '1';
                    sheet.classList.add('active');
                }
                if (btn) btn.classList.toggle('active');
            }
        }

        function syncNavActiveState() {
            const hash = window.location.hash || '#overview';
            
            // 1. Mobile Bottom Bar Links
            document.querySelectorAll('.mobile-nav-link').forEach(link => {
                const href = link.getAttribute('href');
                if (href && href.startsWith('#')) {
                    link.classList.toggle('active', href === hash);
                }
            });

            // 2. Desktop Sidebar Links
            document.querySelectorAll('.sidebar-link').forEach(link => {
                const href = link.getAttribute('href');
                if (href) {
                    const isHashMatch = href.includes(hash);
                    const isOverviewMatch = hash === '#overview' && (href.endsWith('mon-espace.html') || href.includes('#overview'));
                    link.classList.toggle('active', isHashMatch || isOverviewMatch);
                }
            });
        }

        /**
         * Robust Link Adjustment
         * Ensures hardcoded relative links work even after router changes the path
         */
        function fixNavigationLinks() {
            if (!window.UIComponents) return;
            
            // Detect Project Root from script tag to avoid being fooled by SPA virtual paths
            const appScript = document.querySelector('script[src*="app.js"]');
            let siteRoot = appScript ? appScript.src.split('assets/js/app.js')[0] : (window.location.origin + '/');
            
            // Critical Fix: Strip SPA rewrite paths from siteRoot to prevent infinite appending loop
            siteRoot = siteRoot.replace(/\/(mon-espace|marketplace|dashboard|territoires|blog|services)\/.*$/, '/');
            
            document.querySelectorAll('.nav-market-link, .mobile-nav-link, .mobile-menu-links a, .top-nav-logo, .sidebar-brand, .nav-brand').forEach(link => {
                if (!link.dataset.originalHref) {
                    link.dataset.originalHref = link.getAttribute('href');
                }
                
                const href = link.dataset.originalHref;
                if (href && !href.startsWith('#') && !href.startsWith('javascript:') && !href.startsWith('http')) {
                    // Always resolve relative to the fixed Site Root
                    const absoluteUrl = new URL(href, siteRoot).href;
                    link.href = absoluteUrl;
                    console.log(`[NavFix] Project Root: ${siteRoot} | Resolved ${href} -> ${absoluteUrl}`);
                }
            });
        }

        window.addEventListener('hashchange', () => {
            syncNavActiveState();
            fixNavigationLinks();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
        document.addEventListener('DOMContentLoaded', () => {
            syncNavActiveState();
            fixNavigationLinks();
            
            // Global Interceptor to force clean SPA navigation or external redirects
            document.addEventListener('click', (e) => {
                const link = e.target.closest('.nav-market-link, .top-nav-logo, .sidebar-link, .mobile-nav-link, .mobile-menu-links a, .sidebar-brand, .nav-brand');
                if (link) {
                    const href = link.getAttribute('href');
                    if (!href || href.startsWith('javascript:') || href.includes('mailto:')) return;

                    // If it's an internal dashboard link, use the Router
                    if (href.includes('mon-espace') || href.startsWith('#') || !href.includes('.html')) {
                        console.log("[NavFix] SPA Navigation for:", href);
                        if (window.Router) {
                            e.preventDefault();
                            
                            // Instant UI Update
                            document.querySelectorAll('.nav-market-link, .top-nav-logo, .sidebar-link, .mobile-nav-link, .mobile-menu-links a, .sidebar-brand, .nav-brand').forEach(l => l.classList.remove('active'));
                            link.classList.add('active');
                            
                            window.Router.navigate(href);
                            window.scrollTo({ top: 0, behavior: 'smooth' });
                        }
                    } else {
                        // External or other module navigation - Let browser handle it naturally
                        console.log("[NavFix] Allowing external navigation to:", link.href);
                    }
                }
            });
        });
    </script>
