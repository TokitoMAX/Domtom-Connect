<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Espace - Domtom Connect</title>
    <link rel="stylesheet" href="/assets/css/dashboard.css?v=2.0">
    <link rel="icon" type="image/png" href="/assets/images/logo-domtomconnect.png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body class="dashboard-body">
    <div class="dashboard-container">
        <!-- Sidebar dynamically rendered by UIComponents -->
        <aside class="sidebar"></aside>

        <main class="main-content">
            <!-- Top Nav dynamically rendered by UIComponents -->
            <header class="top-nav">
                <div class="nav-left">
                    <div id="nav-links-container" class="nav-links"></div>
                </div>
            </header>

            <div class="content-wrapper">
                <!-- VIEW SECTIONS (SPA) -->
                
                <!-- 1. Overview (Unified Feed) -->
                <div id="overview-view" class="view-section">
                    <div id="ecosystem-grid-container">
                        <!-- Module content injected here -->
                        <div style="padding: 100px 0; text-align: center;">
                            <div class="splash-loader" style="margin: 0 auto; border-top-color: #10b981;"></div>
                            <p style="color:#64748b; margin-top: 24px; font-weight: 600;">Chargement de votre cockpit...</p>
                        </div>
                    </div>
                </div>

                <!-- 2. Specific Views -->
                <div id="missions-view" class="view-section" style="display:none;"></div>
                <div id="billetterie-view" class="view-section" style="display:none;">
                    <div class="dash-pilotage-header" style="margin-bottom:32px;">
                        <div>
                            <h2 style="font-size:2.2rem; font-weight:900;">MA BILLETTERIE</h2>
                            <p style="color:#64748b;">Gérez vos accès et invitations aux événements.</p>
                        </div>
                        <button onclick="window.Router.navigate('/marketplace/evenements')" class="cta-button primary" style="background:#10b981;">+ Créer un Événement</button>
                    </div>
                    <div id="my-tickets-list" class="dashboard-grid"></div>
                </div>
                
                <!-- Success Engine View Skeleton -->
                <div id="success-engine-view-fixed" class="view-section" style="display:none;">
                    <div id="success-engine-header"></div>
                    <div id="success-engine-step"></div>
                </div>

                <div id="business-view" class="view-section" style="display:none;"></div>
                <div id="collaboration-view" class="view-section" style="display:none;"></div>
                <div id="profile-view" class="view-section" style="display:none;"></div>
            </div>
        </main>
    </div>

    <!-- Mobile Bottom Navigation (DYNAMIC) -->
    <nav class="mobile-nav"></nav>

    <!-- CORE PLATFORM SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/assets/js/territory_config.js?v=9.5"></script>
    <script src="/assets/js/auth.js?v=9.5"></script>
    
    <!-- Ecosystem Modules -->
    <script src="/assets/js/ecosystems/standard.module.js?v=9.5"></script>
    <script src="/assets/js/ecosystems/collaboration.module.js?v=9.5"></script>
    <script src="/assets/js/ecosystems/owners.module.js?v=9.5"></script>
    <script src="/assets/js/ecosystems/experts.module.js?v=9.5"></script>
    <script src="/assets/js/ecosystems/companies.module.js?v=9.5"></script>
    <script src="/assets/js/modules/ticketing.module.js?v=9.5"></script>
    <script src="/assets/js/modules/business.module.js?v=9.5"></script>
    <script src="/assets/js/dashboard-success-engine.js?v=9.5"></script>

    <!-- Platform Orchestrator (Loaded Last) -->
    <script src="/assets/js/ui-components.js?v=9.5"></script>
    <script src="/assets/js/router.js?v=9.5"></script>
    <script src="/assets/js/app.js?v=9.5"></script>

    <!-- MODALS -->
    <div id="details-modal-overlay" class="modal-overlay"></div>
</body>
</html>
