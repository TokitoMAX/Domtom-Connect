    <script>
        // --- 1. Dashboard Navigation Sync ---
        function syncNavActiveState() {
            const path = window.location.pathname;
            const hash = window.location.hash || '#overview';
            const cleanPath = path.replace('/mon-espace/', '').replace('/dashboard/', '');
            
            // Mobile Bottom Nav
            document.querySelectorAll('.mobile-nav-link').forEach(link => {
                const href = link.getAttribute('href');
                if (href.includes(cleanPath) || (path === '/mon-espace' && href.includes('overview')) || href === hash) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });

            // Top Nav Market Links
            document.querySelectorAll('.nav-market-link').forEach(link => {
                const href = link.getAttribute('href');
                if (window.location.pathname.includes(href)) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });
        }

        // --- 2. Mobile Menu Toggle ---
        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu-overlay');
            const btn = document.getElementById('mobile-menu-toggle');
            if (menu) {
                menu.classList.toggle('active');
                if (btn) btn.classList.toggle('active');
            }
        }

        // --- 3. Event Listeners ---
        window.addEventListener('hashchange', syncNavActiveState);
        window.addEventListener('load', () => {
            syncNavActiveState();
            
            // Close mobile menu on hash change (navigation)
            window.addEventListener('hashchange', () => {
                const menu = document.getElementById('mobile-menu-overlay');
                if (menu) menu.classList.remove('active');
                const btn = document.getElementById('mobile-menu-toggle');
                if (btn) btn.classList.remove('active');
            });
        });
    </script>
