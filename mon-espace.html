    <style>
        /* Force display for legacy containers when needed */
        .view-section { transition: opacity 0.3s ease; }

        /* PREMIUM MOBILE MENU */
        .mobile-menu-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.98);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            z-index: 10001;
            display: none;
            flex-direction: column;
            padding: 60px 32px;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            color: white;
        }
        .mobile-menu-overlay.active {
            display: flex;
            opacity: 1;
        }

        .mobile-menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .mobile-logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: #00D586;
        }

        .close-menu {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 14px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .mobile-menu-links {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            overflow-y: auto;
        }

        .mobile-menu-links a {
            font-size: 0.9rem;
            font-weight: 700;
            color: white;
            text-decoration: none;
            padding: 16px 8px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            text-align: center;
            transition: all 0.2s;
        }

        .mobile-menu-links a:active {
            background: #00D586;
            color: #0f172a;
            transform: scale(0.98);
        }

        /* Nav Toggle Animation */
        .nav-toggle span {
            display: block;
            width: 24px;
            height: 2.5px;
            background: #0f172a;
            margin: 5px 0;
            transition: 0.3s;
            border-radius: 4px;
        }
        .nav-toggle.active span:nth-child(1) { transform: translateY(7.5px) rotate(45deg); }
        .nav-toggle.active span:nth-child(2) { opacity: 0; }
        .nav-toggle.active span:nth-child(3) { transform: translateY(-7.5px) rotate(-45deg); }
    </style>
</head>

    <script>
        // Inline UI Helpers (Restored for Dashboard context)
        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu-overlay');
            const btn = document.getElementById('mobile-menu-toggle');
            if (menu) {
                menu.classList.toggle('active');
                if (btn) btn.classList.toggle('active');
            }
        }

        function syncNavActiveState() {
            const hash = window.location.hash || '#overview';
            document.querySelectorAll('.mobile-nav-link').forEach(link => {
                const href = link.getAttribute('href');
                if (href && href.startsWith('#')) {
                    link.classList.toggle('active', href === hash);
                }
            });
        }

        /**
         * Robust Link Adjustment
         * Ensures hardcoded relative links work even after router changes the path
         */
        function fixNavigationLinks() {
            if (!window.UIComponents) return;
            const prefix = UIComponents.getPathPrefix();
            
            document.querySelectorAll('.nav-market-link, .mobile-nav-link, .mobile-menu-links a, .top-nav-logo').forEach(link => {
                // Store original href to allow multiple adjustments without doubling prefixes
                if (!link.dataset.originalHref) {
                    link.dataset.originalHref = link.getAttribute('href');
                }
                
                const href = link.dataset.originalHref;
                if (href && !href.startsWith('#') && !href.startsWith('javascript:') && !href.startsWith('http')) {
                    link.href = UIComponents.adjustPath(href, prefix);
                }
            });
        }

        window.addEventListener('hashchange', () => {
            syncNavActiveState();
            fixNavigationLinks();
        });
        document.addEventListener('DOMContentLoaded', () => {
            syncNavActiveState();
            fixNavigationLinks();
        });
    </script>
