<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/dashboard.css?v=11.1">
    <link rel="icon" type="image/png" href="./assets/images/logo-domtomconnect.png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Force display for legacy containers when needed */
        .view-section { transition: opacity 0.3s ease; }

        /* PREMIUM MOBILE MENU */
        .mobile-menu-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.98);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            z-index: 10001;
            display: none;
            flex-direction: column;
            padding: 60px 32px;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            color: white;
        }
        .mobile-menu-overlay.active {
            display: flex;
            opacity: 1;
        }

        .mobile-menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .mobile-logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: #00D586;
        }

        .close-menu {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 14px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .mobile-menu-links {
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .mobile-menu-links a {
            font-size: 1.4rem;
            font-weight: 800;
            color: white;
            text-decoration: none;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: all 0.2s;
        }

        .mobile-menu-links a:active {
            color: #00D586;
            transform: translateX(5px);
        }

        /* Nav Toggle Animation */
        .nav-toggle span {
            display: block;
            width: 24px;
            height: 2.5px;
            background: #0f172a;
            margin: 5px 0;
            transition: 0.3s;
            border-radius: 4px;
        }
        .nav-toggle.active span:nth-child(1) { transform: translateY(7.5px) rotate(45deg); }
        .nav-toggle.active span:nth-child(2) { opacity: 0; }
        .nav-toggle.active span:nth-child(3) { transform: translateY(-7.5px) rotate(-45deg); }
    </style>
</head>

<body class="dashboard-body">
    <div class="dashboard-layout">
        <!-- Sidebar - Dynamic Aceternity Style -->
        <aside class="sidebar"></aside>

        <main class="main-content">
            <nav class="navbar">
                <div class="container"></div>
            </nav>

            <div class="content-wrapper">
                <!-- 1. Overview (Unified Dashboard) -->
                <div id="overview-view" class="view-section">
                    <div id="ecosystem-grid-container">
                        <!-- Loading State -->
                        <div style="padding: 100px 20px; text-align: center;">
                            <div class="splash-loader" style="margin: 0 auto;"></div>
                            <p style="margin-top: 20px; color: #64748b; font-weight: 600;">Chargement de votre espace...</p>
                        </div>
                    </div>
                </div>

                <!-- 2. SUCCESS ENGINE (Pilotage de Projet) -->
                <div id="success-engine-view-fixed" class="view-section" style="display:none;"></div>

                <!-- 3. Specialized Ecosystem Views -->
                <div id="missions-view" class="view-section" style="display:none;"></div>
                <div id="billetterie-view" class="view-section" style="display:none;">
                    <div id="my-tickets-list" class="dashboard-grid"></div>
                </div>
                <div id="business-view" class="view-section" style="display:none;"></div>
                <div id="collaboration-view" class="view-section" style="display:none;"></div>
                <div id="profile-view" class="view-section" style="display:none;"></div>
            </div>
        </main>
    </div>



    <!-- CORE SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./assets/js/territory_config.js?v=11.1"></script>
    <script src="./assets/js/auth.js?v=11.1"></script>
    
    <!-- Modules -->
    <script src="./assets/js/ecosystems/standard.module.js?v=11.1"></script>
    <script src="./assets/js/ecosystems/collaboration.module.js?v=11.1"></script>
    <script src="./assets/js/ecosystems/owners.module.js?v=11.1"></script>
    <script src="./assets/js/ecosystems/experts.module.js?v=11.1"></script>
    <script src="./assets/js/ecosystems/companies.module.js?v=11.1"></script>
    <script src="./assets/js/ecosystems/spectators.module.js?v=11.1"></script>
    <script src="./assets/js/modules/ticketing.module.js?v=11.1"></script>
    <script src="./assets/js/modules/business.module.js?v=11.1"></script>
    <script src="./assets/js/modules/showcase.module.js?v=11.1"></script>
    <script src="./assets/js/dashboard-success-engine.js?v=11.1"></script>

    <!-- Orchestration -->
    <script src="./assets/js/ui-components.js?v=11.1"></script>
    <script src="./assets/js/router.js?v=11.1"></script>
    <script src="./assets/js/modules/payment.module.js?v=11.1"></script>
    <script src="./assets/js/app.js?v=11.1"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // App.init() handles everything via its boot sequence
        });
    </script>
</body>
</html>
