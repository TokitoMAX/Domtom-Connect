<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Espace - Domtom Connect</title>
    <link rel="stylesheet" href="assets/css/dashboard.css?v=9.6">
    <link rel="icon" type="image/png" href="assets/images/logo-domtomconnect.png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Force display for legacy containers when needed */
        .view-section { transition: opacity 0.3s ease; }
    </style>
</head>

<body class="dashboard-body">
    <div class="dashboard-layout">
        <!-- Sidebar - Dynamic Aceternity Style -->
        <aside class="sidebar"></aside>

        <main class="main-content">
            <header class="top-nav">
                <div id="nav-links-container"></div>
            </header>

            <div class="content-wrapper">
                <!-- 1. Overview (Unified Dashboard) -->
                <div id="overview-view" class="view-section">
                    <div id="ecosystem-grid-container"></div>
                </div>

                <!-- 2. SUCCESS ENGINE (Pilotage de Projet - Restored Detailed Structure) -->
                <div id="success-engine-view-fixed" class="view-section" style="display:none;">
                    <div id="success-engine-header"></div>
                    
                    <!-- Separate List View Container -->
                    <div id="project-list-view"></div>
                    
                    <!-- Step/Wizard Container -->
                    <div id="success-engine-step"></div>

                    <!-- Internal Cockpit Container (The detailed project view) -->
                    <div id="project-cockpit-view" style="display: none;">
                        <div id="cockpit-content-internal"></div>
                    </div>
                </div>

                <!-- 3. Specialized Ecosystem Views -->
                <div id="missions-view" class="view-section" style="display:none;"></div>
                <div id="billetterie-view" class="view-section" style="display:none;">
                    <div id="my-tickets-list" class="dashboard-grid"></div>
                </div>
                <div id="business-view" class="view-section" style="display:none;"></div>
                <div id="collaboration-view" class="view-section" style="display:none;"></div>
                <div id="profile-view" class="view-section" style="display:none;"></div>
            </div>
        </main>
    </div>

    <!-- Mobile Navigation -->
    <nav class="mobile-nav"></nav>

    <!-- PLATFORM ENGINE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/territory_config.js?v=9.6"></script>
    <script src="assets/js/auth.js?v=9.6"></script>
    
    <!-- Ecosystem Modules -->
    <script src="assets/js/ecosystems/standard.module.js?v=9.6"></script>
    <script src="assets/js/ecosystems/collaboration.module.js?v=9.6"></script>
    <script src="assets/js/ecosystems/owners.module.js?v=9.6"></script>
    <script src="assets/js/ecosystems/experts.module.js?v=9.6"></script>
    <script src="assets/js/ecosystems/companies.module.js?v=9.6"></script>
    <script src="assets/js/modules/ticketing.module.js?v=9.6"></script>
    <script src="assets/js/modules/business.module.js?v=9.6"></script>
    <script src="assets/js/dashboard-success-engine.js?v=9.6"></script>

    <!-- Platform Orchestrator -->
    <script src="assets/js/ui-components.js?v=9.6"></script>
    <script src="assets/js/router.js?v=9.6"></script>
    <script src="assets/js/app.js?v=9.6"></script>

    <!-- Modals Layer -->
    <div id="details-modal-overlay" class="modal-overlay"></div>
</body>
</html>
