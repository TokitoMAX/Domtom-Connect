<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porteurs de Projets - Trouvez vos Prestataires - Domtom Connect</title>
    <meta name="description" content="Trouvez les meilleurs prestataires pour votre projet dans les territoires ultramarins. Accompagnement personnalisé et cadre de travail clair.">
    <link rel="stylesheet" href="../../assets/css/style.css?v=3.0">
    <link rel="stylesheet" href="../../assets/css/landing.css?v=1.0">
    <link rel="stylesheet" href="../../assets/css/quiz-landing.css?v=1.0">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="nav-brand" id="logo-home" title="Retour à l'accueil" onclick="window.location.href='/'; return false;" style="cursor: pointer; position: relative; z-index: 9999;">
                <img src="../../assets/images/logo-domtomconnect.png" alt="Domtom Connect" class="nav-logo" onclick="window.location.href='/'; return false;" style="cursor: pointer;">
                <span class="nav-brand-name" onclick="window.location.href='/'; return false;" style="cursor: pointer;">Domtom Connect</span>
            </a>
        </div>
    </nav>

    <section class="landing-hero quiz-hero">
        <div class="container">
            <div class="landing-content">
                <h1>Trouvez les Meilleurs Prestataires pour Votre Projet</h1>
                
                <form class="landing-form quiz-form" id="landing-form" onsubmit="handleQuizFormSubmit(event)">
                    <div class="quiz-container"></div>
                </form>
            </div>
        </div>
    </section>

    <script src="../../assets/js/landing-quiz.js?v=1.0"></script>
    <script src="../../assets/js/form-security.js?v=1.0"></script>
    <script src="../../assets/js/landing.js?v=1.0"></script>
    <script src="../../assets/js/lead-tracking.js?v=1.0"></script>
    <script>
        const porteursProjetsQuestions = [
            { id: 'prenom', question: 'Quel est ton prénom ?', type: 'text', placeholder: 'Ton prénom', required: true, fieldName: 'prenom' },
            { id: 'nom', question: 'Quel est ton nom ?', type: 'text', placeholder: 'Ton nom', required: true, fieldName: 'nom' },
            { id: 'email', question: 'Quelle est ton adresse email ?', type: 'email', placeholder: 'ton@email.com', required: true, fieldName: 'email' },
            { id: 'telephone', question: 'Quel est ton numéro de téléphone ?', type: 'tel', placeholder: '06 12 34 56 78', required: true, fieldName: 'telephone' },
            { id: 'ile', question: 'Dans quel pays/territoire es-tu basé actuellement ?', type: 'select', required: true, fieldName: 'ile', placeholder: 'Sélectionne ton territoire', options: [
                { value: 'martinique', label: 'Martinique' },
                { value: 'guadeloupe', label: 'Guadeloupe' },
                { value: 'reunion', label: 'La Réunion' },
                { value: 'guyane', label: 'Guyane' },
                { value: 'mayotte', label: 'Mayotte' },
                { value: 'saint-martin', label: 'Saint-Martin' },
                { value: 'saint-barthelemy', label: 'Saint-Barthélemy' },
                { value: 'saint-pierre-et-miquelon', label: 'Saint-Pierre-et-Miquelon' },
                { value: 'wallis-et-futuna', label: 'Wallis-et-Futuna' },
                { value: 'polynesie', label: 'Polynésie française' },
                { value: 'nouvelle-caledonie', label: 'Nouvelle-Calédonie' },
                { value: 'diaspora', label: 'Diaspora' },
                { value: 'autre', label: 'Autre' }
            ]},
            { id: 'lien_territoires', question: 'Quel est ton lien avec les territoires insulaires (DOM-TOM / îles / diaspora) ?', type: 'radio', required: true, fieldName: 'lien_territoires', options: [
                { value: 'vis-territoire', label: 'Je vis dans un territoire insulaire' },
                { value: 'diaspora', label: 'Je fais partie de la diaspora' },
                { value: 'projet-cible', label: 'Mon projet cible un territoire insulaire' },
                { value: 'autre', label: 'Autre (à préciser)' }
            ]},
            { id: 'lien_territoires_autre', question: 'Précise ton lien avec les territoires insulaires', type: 'text', placeholder: 'Ton lien', required: false, fieldName: 'lien_territoires_autre', conditional: { field: 'lien_territoires', value: 'autre' }},
            { id: 'nom_projet', question: 'Quel est le nom de ton projet ou entreprise ?', type: 'text', placeholder: 'Nom du projet/entreprise', required: true, fieldName: 'nom_projet' },
            { id: 'description_projet', question: 'Décris ton projet en 3-5 phrases', type: 'textarea', placeholder: 'Décris ton projet...', required: true, fieldName: 'description_projet', rows: 4 },
            { id: 'stade_projet', question: 'À quel stade est ton projet ?', type: 'radio', required: true, fieldName: 'stade_projet', options: [
                { value: 'idee-clarifiee', label: 'Idée clarifiée mais pas encore lancée' },
                { value: 'lancement', label: 'Projet en cours de lancement' },
                { value: 'lance', label: 'Activité déjà lancée (clients / utilisateurs)' },
                { value: 'developpement', label: 'Projet en phase de développement / structuration' }
            ]},
            { id: 'objectif_principal', question: 'Quel est ton objectif principal ?', type: 'radio', required: true, fieldName: 'objectif_principal', options: [
                { value: 'structurer', label: 'Structurer mon projet' },
                { value: 'prestataires', label: 'Trouver des prestataires fiables' },
                { value: 'visibilite', label: 'Gagner en visibilité' },
                { value: 'reseau', label: 'Me connecter à un réseau insulaire / diaspora' },
                { value: 'autre', label: 'Autre' }
            ]},
            { id: 'objectif_principal_autre', question: 'Précise ton objectif', type: 'text', placeholder: 'Ton objectif', required: false, fieldName: 'objectif_principal_autre', conditional: { field: 'objectif_principal', value: 'autre' }},
            { id: 'horizon', question: 'Quel est ton horizon temporel ?', type: 'radio', required: true, fieldName: 'horizon', options: [
                { value: 'court', label: 'Court terme (0-6 mois)' },
                { value: 'moyen', label: 'Moyen terme (6-24 mois)' },
                { value: 'long', label: 'Long terme (2 ans et +)' }
            ]},
            { id: 'budget', question: 'Quel budget es-tu prêt à investir dans l\'accompagnement Domtom Connect pour les prochains mois ?', type: 'radio', required: true, fieldName: 'budget', options: [
                { value: 'moins-300', label: 'Moins de 300 €' },
                { value: '300-1000', label: '300-1 000 €' },
                { value: '1000-3000', label: '1 000-3 000 €' },
                { value: 'plus-3000', label: 'Plus de 3 000 €' },
                { value: 'non-defini', label: 'Pas encore défini' }
            ], clarification: '💡 <strong>Important :</strong> L\'accompagnement Domtom Connect (recherche, mise en relation, suivi) est un service séparé. Les prestataires sont payés <strong>directement par toi</strong>, sans commission intermédiaire.' },
            { id: 'engagement', question: 'Es-tu prêt à t\'engager dans ce processus ?', type: 'radio', required: true, fieldName: 'engagement', options: [
                { value: 'oui', label: 'Oui, je suis prêt à m\'engager' },
                { value: 'pas-sure', label: 'Pas encore sûr' },
                { value: 'non', label: 'Non, je veux juste des informations' }
            ]},
            { id: 'commentaires', question: 'As-tu des commentaires ou questions supplémentaires ?', type: 'textarea', placeholder: 'Tes commentaires (optionnel)', required: false, fieldName: 'commentaires', rows: 3 }
        ];

        let quiz;
        document.addEventListener('DOMContentLoaded', () => {
            quiz = new LandingQuiz(porteursProjetsQuestions, 'landing-form', 'porteur-projet');
        });

        function handleQuizFormSubmit(event) {
            event.preventDefault();
            if (!quiz) return;
            const data = quiz.collectAllAnswers();
            const form = document.getElementById('landing-form');
            const formData = new FormData(form);
            Object.keys(data).forEach(key => {
                if (data[key] !== null && data[key] !== undefined && data[key] !== '') {
                    formData.set(key, data[key]);
                }
            });
            const submitData = {};
            formData.forEach((value, key) => {
                if (key !== 'website') submitData[key] = value;
            });
            const fakeEvent = { preventDefault: () => {}, target: form };
            Object.keys(submitData).forEach(key => {
                const input = form.querySelector(`[name="${key}"]`);
                if (input) {
                    if (input.type === 'checkbox' || input.type === 'radio') {
                        input.checked = submitData[key] === input.value;
                    } else {
                        input.value = submitData[key];
                    }
                }
            });
            if (typeof handleLandingFormSubmit === 'function') {
                handleLandingFormSubmit(fakeEvent);
            }
        }
    </script>
</body>
</html>
