                { value: 'trouver-prestataires', label: 'Trouver des prestataires' },
                { value: 'structurer', label: 'Structurer mon projet' },
                { value: 'reseau', label: 'Me connecter à un réseau' },
                { value: 'autre', label: 'Autre' }
            ]},
            { 
                id: 'budget', 
                question: 'Quel budget es-tu prêt à investir dans l\'accompagnement Domtom Connect ?', 
                type: 'radio', 
                required: true, 
                fieldName: 'budget', 
                options: [
                    { value: 'moins-300', label: 'Moins de 300 €' },
                    { value: '300-1000', label: '300-1 000 €' },
                    { value: '1000-3000', label: '1 000-3 000 €' },
                    { value: 'plus-3000', label: 'Plus de 3 000 €' },
                    { value: 'non-defini', label: 'Pas encore défini' }
                ], 
                clarification: '<strong>Important :</strong> L\'accompagnement Domtom Connect (recherche, mise en relation, suivi) est un service séparé. Les prestataires sont payés <strong>directement par toi</strong>, sans commission intermédiaire.' 
            },
            { id: 'certification', question: 'Je certifie sur l\'honneur que toutes les informations fournies sont exactes', type: 'checkbox', required: true, fieldName: 'certification', description: 'Je comprends que la vérification de ces informations permet de garantir la qualité du réseau pour tous.' }
        ];

        // Sélectionner les questions selon l'origine
        const porteursProjetsQuestions = fromQuiz ? porteursProjetsQuestionsBase : porteursProjetsQuestionsWithBudget;
        
        let quiz;
        
        // Fonction pour obtenir les infos du pack selon le budget
        function getPackInfo(budget) {
            if (budget === 'moins-300') {
                return {
                    name: 'Pack Essai Local',
                    price: '99€',
                    description: 'Tu as des doutes ? Teste pour moins de 100€'
                };
            } else if (budget === '300-1000') {
                return {
                    name: 'Pack Accompagnement Pro',
                    price: '500€',
                    description: 'On fait tout pour toi'
                };
            } else if (budget === '1000-3000' || budget === 'plus-3000') {
                return {
                    name: 'Pack Solution Tout-en-Un',
                    price: '1 900€',
                    description: 'Ton projet de A à Z'
                };
            }
            return null;
        }
        
        // Fonction pour afficher le pack adapté après la sélection du budget
        function showPackAfterBudget(budget) {
            const packInfo = getPackInfo(budget);
            if (!packInfo) return;
            
            const container = document.getElementById('quiz-questions-container');
            if (!container) return;
            
            // Récupérer la question actuelle
            const currentQuestion = container.querySelector('.quiz-question');
            if (!currentQuestion) return;
            
            // Ajouter l'affichage du pack après la question budget
            const packHTML = `
                <div class="pack-preview" style="margin-top: 2rem; padding: 2rem; background: linear-gradient(135deg, #00BFA6 0%, #00A896 100%); border-radius: 20px; color: white; text-align: center;">
                    <h3 style="font-size: 1.2rem; font-weight: 600; margin-bottom: 1rem; color: white;">Pack adapté à ton budget</h3>
                    <div style="font-size: 2.5rem; font-weight: 900; margin-bottom: 0.5rem; color: white;">${packInfo.name}</div>
                    <div style="font-size: 1.8rem; font-weight: 700; margin-bottom: 1rem; color: white;">${packInfo.price}</div>
                    <p style="font-size: 1rem; color: rgba(255, 255, 255, 0.9);">${packInfo.description}</p>
                </div>
            `;
            
            // Insérer le pack après la question budget
            currentQuestion.insertAdjacentHTML('afterend', packHTML);
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            // Passer les questions simplifiées pour les utilisateurs sans données pré-remplies
            quiz = new LandingQuiz(porteursProjetsQuestions, 'landing-form', 'porteur-projet', porteursProjetsQuestionsSimplified);
            
            // Si budget vient du quiz, pré-remplir la question budget
            if (fromQuiz && quizBudget) {
                setTimeout(() => {
                    const budgetInput = document.querySelector(`input[name="question_budget"][value="${quizBudget}"]`);
                    if (budgetInput) {
                        budgetInput.checked = true;
                        showPackAfterBudget(quizBudget);
                    }
                }, 500);
            }
            
            // Intercepter la sélection du budget pour afficher le pack
            // Utiliser un MutationObserver pour détecter quand la question budget est affichée
            const observer = new MutationObserver(() => {
                const budgetInputs = document.querySelectorAll('input[name="question_budget"]');
                const currentQuestion = document.querySelector('.quiz-question[data-question-id="budget"]');
                
                if (budgetInputs.length > 0 && currentQuestion) {
                    budgetInputs.forEach(input => {
                        if (!input.dataset.packHandlerAttached) {
                            input.dataset.packHandlerAttached = 'true';
                            
                            input.addEventListener('change', function() {
                                if (this.checked) {
                                    const budget = this.value;
                                    
                                    // Attendre un peu pour que le DOM soit stable
                                    setTimeout(() => {
                                        // Vérifier si le pack n'est pas déjà affiché
                                        const existingPack = document.querySelector('.pack-preview');
                                        if (existingPack) {
                                            existingPack.remove();
                                        }
                                        showPackAfterBudget(budget);
                                    }, 200);
                                }
                            });
                        }
                    });
                }
            });
            
            // Observer les changements dans le container du quiz
            const quizContainer = document.getElementById('quiz-questions-container');
            if (quizContainer) {
                observer.observe(quizContainer, { childList: true, subtree: true });
            }
        });

        async function handleQuizFormSubmit(event) {
            event.preventDefault();

            const data = quiz.collectAllAnswers();
            data.profil = 'porteur-projet';
            
            // Validation silencieuse (sans alertes) - juste pour collecter les infos
            const validator = new FormValidator();
            const validation = await validator.validateForm(data);
            
            // Ajouter les résultats de validation aux données (pour l'email) mais ne pas bloquer
            if (validation.credibilityScore) {
                data.credibility_score = validation.credibilityScore.score;
                data.credibility_level = validation.credibilityScore.level;
            }
            if (validation.inconsistencies.length > 0) {
                data.inconsistencies = JSON.stringify(validation.inconsistencies);
            }
            
            // Préparer les données pour l'envoi
            const prenom = data.prenom || data.question_prenom || '';
            const nom = data.nom || data.question_nom || '';

            const telephone = data.telephone || data.question_telephone || '';
            const ile = data.ile || data.question_ile || '';

            const description_projet = data.description_projet || data.question_description_projet || '';
            const besoin = data.besoin || data.question_besoin || '';
            const budget = data.budget || data.question_budget || '';
            
            // Déterminer le pack selon le budget
            let packInfo = null;
            if (budget === 'moins-300') {
                packInfo = { name: 'Pack Essai Local', price: '99 €', description: 'Pour tester avec un budget limité' };
            } else if (budget === '300-1000') {
                packInfo = { name: 'Pack Accompagnement Pro', price: 'À partir de 300 €', description: 'Accompagnement personnalisé' };
