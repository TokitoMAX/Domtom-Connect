</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <a href="/" class="nav-brand" id="logo-home" title="Retour à l'accueil" onclick="window.location.href='/'; return false;" style="cursor: pointer; position: relative; z-index: 9999;">
                <img src="../../assets/images/logo-domtomconnect.png" alt="Domtom Connect" class="nav-logo" onclick="window.location.href='/'; return false;" style="cursor: pointer;">
                <span class="nav-brand-name" onclick="window.location.href='/'; return false;" style="cursor: pointer;">Domtom Connect</span>
            </a>
        </div>
    </nav>

    <section class="landing-hero quiz-hero">
        <div class="container">
            <div class="landing-content">
                <h1>Devenez Prestataire Domtom Connect</h1>
                
                <form class="landing-form quiz-form" id="landing-form" onsubmit="handleQuizFormSubmit(event)">
                    <div class="quiz-container"></div>
                </form>
            </div>
        </div>
    </section>

    <script src="../../assets/js/landing-quiz.js?v=1.0"></script>
    <script src="../../assets/js/form-validation.js?v=1.0"></script>
    <script src="../../assets/js/form-security.js?v=1.0"></script>
    <script src="../../assets/js/landing.js?v=1.0"></script>
    <script src="../../assets/js/lead-tracking.js?v=1.0"></script>
    <script>
        // Questions simplifiées pour les prestataires (sans données pré-remplies)
        const prestatairesQuestionsSimplified = [
            { id: 'prenom', question: 'Quel est votre prénom ?', type: 'text', placeholder: 'Votre prénom', required: true, fieldName: 'prenom' },
            { id: 'nom', question: 'Quel est votre nom ?', type: 'text', placeholder: 'Votre nom', required: true, fieldName: 'nom' },
            { id: 'email', question: 'Quelle est votre adresse email ?', type: 'email', placeholder: 'votre@email.com', required: true, fieldName: 'email' },
            { id: 'telephone', question: 'Quel est votre numéro de téléphone ?', type: 'tel', placeholder: '06 12 34 56 78', required: true, fieldName: 'telephone' },
            { id: 'ile', question: 'Dans quel territoire êtes-vous basé ?', type: 'select', required: true, fieldName: 'ile', placeholder: 'Sélectionnez votre territoire', options: [
                { value: 'martinique', label: 'Martinique' },
                { value: 'guadeloupe', label: 'Guadeloupe' },
                { value: 'reunion', label: 'La Réunion' },
                { value: 'guyane', label: 'Guyane' },
                { value: 'mayotte', label: 'Mayotte' },
                { value: 'polynesie', label: 'Polynésie française' },
                { value: 'nouvelle-caledonie', label: 'Nouvelle-Calédonie' },
                { value: 'diaspora', label: 'Diaspora' },
                { value: 'autre', label: 'Autre' }
            ]},
            { id: 'services', question: 'Quels services proposez-vous ?', type: 'radio', required: true, fieldName: 'services', options: [
                { value: 'developpement', label: 'Développement web/mobile' },
                { value: 'design', label: 'Design graphique / UI/UX' },
                { value: 'marketing', label: 'Marketing digital / Communication' },
                { value: 'comptabilite', label: 'Comptabilité / Fiscalité' },
                { value: 'juridique', label: 'Juridique / Conseil' },
                { value: 'coaching', label: 'Coaching / Formation' },
                { value: 'autre', label: 'Autre service' }
            ]},
            { id: 'certification', question: 'Je certifie sur l\'honneur que toutes les informations fournies sont exactes', type: 'checkbox', required: true, fieldName: 'certification', description: 'Je comprends que la vérification de ces informations permet de garantir la qualité du réseau pour tous.' }
        ];
        
        // Questions simplifiées pour les prestataires
        const prestatairesQuestions = [
            { id: 'prenom', question: 'Quel est votre prénom ?', type: 'text', placeholder: 'Votre prénom', required: true, fieldName: 'prenom' },
            { id: 'nom', question: 'Quel est votre nom ?', type: 'text', placeholder: 'Votre nom', required: true, fieldName: 'nom' },
            { id: 'email', question: 'Quelle est votre adresse email ?', type: 'email', placeholder: 'votre@email.com', required: true, fieldName: 'email' },
            { id: 'telephone', question: 'Quel est votre numéro de téléphone ?', type: 'tel', placeholder: '06 12 34 56 78', required: true, fieldName: 'telephone' },
            { id: 'ile', question: 'Dans quel territoire êtes-vous basé ?', type: 'select', required: true, fieldName: 'ile', placeholder: 'Sélectionnez votre territoire', options: [
                { value: 'martinique', label: 'Martinique' },
                { value: 'guadeloupe', label: 'Guadeloupe' },
                { value: 'reunion', label: 'La Réunion' },
                { value: 'guyane', label: 'Guyane' },
                { value: 'mayotte', label: 'Mayotte' },
                { value: 'polynesie', label: 'Polynésie française' },
                { value: 'nouvelle-caledonie', label: 'Nouvelle-Calédonie' },
                { value: 'diaspora', label: 'Diaspora' },
                { value: 'autre', label: 'Autre' }
            ]},
            { id: 'services', question: 'Quels services proposez-vous ?', type: 'radio', required: true, fieldName: 'services', options: [
                { value: 'developpement', label: 'Développement web/mobile' },
                { value: 'design', label: 'Design graphique / UI/UX' },
                { value: 'marketing', label: 'Marketing digital / Communication' },
                { value: 'comptabilite', label: 'Comptabilité / Fiscalité' },
                { value: 'juridique', label: 'Juridique / Conseil' },
                { value: 'coaching', label: 'Coaching / Formation' },
                { value: 'autre', label: 'Autre service' }
            ]},
            { id: 'certification', question: 'Je certifie sur l\'honneur que toutes les informations fournies sont exactes', type: 'checkbox', required: true, fieldName: 'certification', description: 'Je comprends que la vérification de ces informations permet de garantir la qualité du réseau pour tous.' }
        ];

        // Initialiser le quiz
        let quiz;
        document.addEventListener('DOMContentLoaded', () => {
            quiz = new LandingQuiz(prestatairesQuestions, 'landing-form', 'prestataire', prestatairesQuestionsSimplified);
        });

        // Gérer la soumission du formulaire
        async function handleQuizFormSubmit(event) {
            event.preventDefault();
            if (!quiz) return;
            
            const data = quiz.collectAllAnswers();
            data.profil = 'prestataire';
            
            // Validation silencieuse (sans alertes) - juste pour collecter les infos
            const validator = new FormValidator();
            const validation = await validator.validateForm(data);
            
            // Ajouter les résultats de validation aux données (pour l'email) mais ne pas bloquer
            if (validation.credibilityScore) {
                data.credibility_score = validation.credibilityScore.score;
                data.credibility_level = validation.credibilityScore.level;
            }
            if (validation.inconsistencies.length > 0) {
                data.inconsistencies = JSON.stringify(validation.inconsistencies);
            }
            
            // Préparer les données pour l'envoi
            const prenom = data.prenom || data.question_prenom || '';
            const nom = data.nom || data.question_nom || '';
            const email = data.email || data.question_email || '';
            const telephone = data.telephone || data.question_telephone || '';
            const ile = data.ile || data.question_ile || '';
            const services = data.services || data.question_services || '';
            
            // Préparer le message pour l'email
            let messageBody = `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
💼 PRESTATAIRE - NOUVELLE CANDIDATURE
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
Source: Landing Page prestataires
Date: ${new Date().toLocaleString('fr-FR')}

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
👤 BLOC 1 - PROFIL & ORIGINE
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
Prénom: ${prenom}
Nom: ${nom}
Email: ${email}
Téléphone: ${telephone || 'Non renseigné'}
Territoire: ${ile || 'Non renseigné'}

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
💼 BLOC 2 - SERVICES
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
Services proposés: ${services || 'Non renseigné'}

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
✅ VALIDATION
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
Certification acceptée: OUI

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
📞 PROCHAINES ÉTAPES
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
1. Contacter ${prenom} ${nom} pour un appel de qualification
2. Vérifier les compétences et l'expérience
3. Après validation, intégrer au réseau
4. Présenter les opportunités disponibles

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━`;
            
            // Préparer FormData pour Formspree
            const formDataToSend = new FormData();
            formDataToSend.append('_to', 'domtomconnect@gmail.com');
            formDataToSend.append('_subject', `💼 PRESTATAIRE - ${prenom} ${nom} - ${services || 'Nouveau Prestataire'}`);
            formDataToSend.append('_replyto', email);
            formDataToSend.append('message', messageBody);
            
            // Données structurées
            formDataToSend.append('Prénom', prenom);
            formDataToSend.append('Nom', nom);
            formDataToSend.append('Email', email);
            formDataToSend.append('Téléphone', telephone || '');
            formDataToSend.append('Territoire', ile || '');
            formDataToSend.append('Services proposés', services || '');
            formDataToSend.append('Profil', 'prestataire');
            if (validation.credibilityScore) {
                formDataToSend.append('Score crédibilité', validation.credibilityScore.score);
                formDataToSend.append('Niveau crédibilité', validation.credibilityScore.level);
            }
            
            // Gérer le bouton
            const submitBtn = event.target.querySelector('button[type="submit"]') || 
                            document.querySelector('#quiz-btn-next[type="submit"]');
            const originalBtnText = submitBtn ? (submitBtn.textContent || submitBtn.innerHTML) : '';
            
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = 'Envoi en cours...';
            }
            
            // Envoyer à Formspree
            const formspreeUrl = 'https://formspree.io/f/myzbqepy';
            
            fetch(formspreeUrl, {
                method: 'POST',
                body: formDataToSend,
                headers: {
                    'Accept': 'application/json'
                }
            })
            .then(response => {
                console.log('📧 Réponse Formspree:', response.status, response.statusText);
                
                if (response.ok) {
                    console.log('✅ Email envoyé avec succès');
                    
                    // Afficher le message de succès
                    const quizContainer = document.querySelector('.quiz-container');
                    const quizQuestionsContainer = document.getElementById('quiz-questions-container');
                    const quizNavigation = document.getElementById('quiz-navigation');
                    
                    const successHTML = `
                        <div style="text-align: center; padding: 3rem 2rem; max-width: 600px; margin: 0 auto; animation: fadeInSlide 0.5s ease;">
                            <div style="font-size: 4rem; margin-bottom: 1.5rem; animation: bounceIn 0.6s ease;">✅</div>
                            <h3 style="color: var(--primary-color); margin-bottom: 1.5rem; font-size: 1.75rem; font-weight: 700;">✓ Candidature envoyée avec succès !</h3>
                            <div style="color: var(--text-secondary); margin-bottom: 2rem; line-height: 1.8; font-size: 1.05rem; white-space: pre-line; text-align: left; background: linear-gradient(135deg, rgba(0, 191, 166, 0.08), rgba(0, 168, 150, 0.05)); padding: 1.5rem; border-radius: 12px; border-left: 4px solid var(--primary-color);">
                                Merci ${prenom ? prenom + ' !' : ' !'} 🎉

Votre candidature a bien été reçue et enregistrée. 

📧 Vous allez recevoir un email de confirmation avec le récapitulatif de votre candidature dans quelques instants.

📞 Nous vous recontacterons dans les 24-48 heures pour :
• Discuter de votre profil et de vos compétences
• Vous présenter notre réseau et les opportunités
• Planifier votre intégration dans notre écosystème

En attendant, n'hésitez pas à consulter notre site pour en savoir plus sur Domtom Connect.
                            </div>
                            <a href="/" class="cta-button primary" style="text-decoration: none; display: inline-block; padding: 1rem 2rem; background: var(--gradient-primary); color: white; border-radius: 8px; font-weight: 600; transition: transform 0.2s; box-shadow: 0 4px 12px rgba(0, 191, 166, 0.3);">Retour à l'accueil</a>
                        </div>
                        <style>
                            @keyframes fadeInSlide {
                                from {
                                    opacity: 0;
                                    transform: translateY(20px);
                                }
                                to {
                                    opacity: 1;
                                    transform: translateY(0);
                                }
                            }
                            @keyframes bounceIn {
                                0% {
                                    transform: scale(0);
                                }
                                50% {
                                    transform: scale(1.2);
                                }
                                100% {
                                    transform: scale(1);
                                }
                            }
                        </style>
                    `;
                    
                    if (quizContainer) {
                        quizContainer.innerHTML = successHTML;
                    } else if (quizQuestionsContainer) {
                        quizQuestionsContainer.innerHTML = successHTML;
                        if (quizNavigation) {
                            quizNavigation.style.display = 'none';
                        }
                    }
                } else {
                    return response.json().then(errData => {
                        console.error('❌ Erreur lors de l\'envoi:', errData);
                        throw new Error(errData.error || 'Erreur lors de l\'envoi');
                    });
                }
            })
            .catch(error => {
                console.error('❌ Erreur:', error);
                alert('Une erreur est survenue lors de l\'envoi de votre candidature. Veuillez réessayer ou nous contacter directement à domtomconnect@gmail.com.');
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalBtnText;
                }
            });
        }
    </script>
</body>
</html>
