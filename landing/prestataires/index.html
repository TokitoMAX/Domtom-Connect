<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devenez Prestataire Domtom Connect - Rejoignez notre réseau</title>
    <meta name="description" content="Rejoignez le réseau de prestataires Domtom Connect et travaillez avec des porteurs de projets des territoires ultramarins. Opportunités de collaboration qualifiées.">
    <link rel="stylesheet" href="../../assets/css/style.css?v=3.0">
    <link rel="stylesheet" href="../../assets/css/landing.css?v=1.0">
    <link rel="stylesheet" href="../../assets/css/quiz-landing.css?v=1.0">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <a href="/" class="nav-brand" id="logo-home" title="Retour à l'accueil" onclick="window.location.href='/'; return false;" style="cursor: pointer; position: relative; z-index: 9999;">
                <img src="../../assets/images/logo-domtomconnect.png" alt="Domtom Connect" class="nav-logo" onclick="window.location.href='/'; return false;" style="cursor: pointer;">
                <span class="nav-brand-name" onclick="window.location.href='/'; return false;" style="cursor: pointer;">Domtom Connect</span>
            </a>
        </div>
    </nav>

    <section class="landing-hero quiz-hero">
        <div class="container">
            <div class="landing-content">
                <h1>Devenez Prestataire Domtom Connect</h1>
                
                <form class="landing-form quiz-form" id="landing-form" onsubmit="handleQuizFormSubmit(event)">
                    <div class="quiz-container"></div>
                </form>
            </div>
        </div>
    </section>

    <script src="../../assets/js/landing-quiz.js?v=1.0"></script>
    <script src="../../assets/js/form-security.js?v=1.0"></script>
    <script src="../../assets/js/landing.js?v=1.0"></script>
    <script src="../../assets/js/lead-tracking.js?v=1.0"></script>
    <script>
        // Questions pour les prestataires
        const prestatairesQuestions = [
            {
                id: 'prenom',
                question: 'Quel est votre prénom ?',
                type: 'text',
                placeholder: 'Votre prénom',
                required: true,
                fieldName: 'prenom'
            },
            {
                id: 'nom',
                question: 'Quel est votre nom ?',
                type: 'text',
                placeholder: 'Votre nom',
                required: true,
                fieldName: 'nom'
            },
            {
                id: 'email',
                question: 'Quelle est votre adresse email ?',
                type: 'email',
                placeholder: 'votre@email.com',
                required: true,
                fieldName: 'email'
            },
            {
                id: 'telephone',
                question: 'Quel est votre numéro de téléphone ?',
                type: 'tel',
                placeholder: '06 12 34 56 78',
                required: true,
                fieldName: 'telephone'
            },
            {
                id: 'services',
                question: 'Quels services proposez-vous ?',
                type: 'radio',
                required: true,
                fieldName: 'services',
                options: [
                    { value: 'developpement', label: 'Développement web/mobile' },
                    { value: 'design', label: 'Design graphique / UI/UX' },
                    { value: 'marketing', label: 'Marketing digital / Communication' },
                    { value: 'comptabilite', label: 'Comptabilité / Fiscalité' },
                    { value: 'juridique', label: 'Juridique / Conseil' },
                    { value: 'coaching', label: 'Coaching / Formation' },
                    { value: 'autre', label: 'Autre service' }
                ]
            },
            {
                id: 'services_autre',
                question: 'Précisez votre service',
                type: 'text',
                placeholder: 'Décrivez votre service',
                required: false,
                fieldName: 'services_autre',
                conditional: { field: 'services', value: 'autre' }
            },
            {
                id: 'statut_juridique',
                question: 'Quel est votre statut juridique ?',
                type: 'radio',
                required: true,
                fieldName: 'statut_juridique',
                options: [
                    { value: 'auto-entrepreneur', label: 'Auto-entrepreneur / Micro-entrepreneur' },
                    { value: 'eurl', label: 'EURL' },
                    { value: 'sarl', label: 'SARL' },
                    { value: 'sas', label: 'SAS' },
                    { value: 'sasu', label: 'SASU' },
                    { value: 'autre', label: 'Autre statut' }
                ]
            },
            {
                id: 'statut_juridique_autre',
                question: 'Précisez votre statut juridique',
                type: 'text',
                placeholder: 'Votre statut',
                required: false,
                fieldName: 'statut_juridique_autre',
                conditional: { field: 'statut_juridique', value: 'autre' }
            },
            {
                id: 'siret',
                question: 'Quel est votre numéro SIRET / SIREN ?',
                type: 'text',
                placeholder: '12345678901234',
                required: true,
                fieldName: 'siret',
                pattern: '[0-9]{9,14}',
                maxlength: 14,
                description: 'Le SIRET doit contenir 9 à 14 chiffres'
            },
            {
                id: 'experience',
                question: 'Quelle est votre expérience (en années) ?',
                type: 'radio',
                required: true,
                fieldName: 'experience',
                options: [
                    { value: 'moins-1', label: 'Moins de 1 an' },
                    { value: '1-3', label: '1 à 3 ans' },
                    { value: '3-5', label: '3 à 5 ans' },
                    { value: '5-10', label: '5 à 10 ans' },
                    { value: 'plus-10', label: 'Plus de 10 ans' }
                ]
            },
            {
                id: 'competences',
                question: 'Quelles sont vos compétences spécifiques et outils maîtrisés ?',
                type: 'textarea',
                placeholder: 'Ex: React, Figma, WordPress, Photoshop, Excel avancé...',
                required: true,
                fieldName: 'competences',
                rows: 3,
                description: 'Listez vos compétences techniques et outils que vous maîtrisez'
            },
            {
                id: 'portfolio',
                question: 'Quel est le lien vers votre portfolio ou site web ? (PREUVE REQUISE)',
                type: 'url',
                placeholder: 'https://votre-portfolio.com',
                required: true,
                fieldName: 'portfolio',
                pattern: 'https?://.+',
                description: '⚠️ PREUVE OBLIGATOIRE : Portfolio ou site web démontrant vos compétences techniques'
            },
            {
                id: 'realisations_liens',
                question: 'Liens vers 2-3 réalisations concrètes démontrant vos compétences (PREUVE REQUISE)',
                type: 'textarea',
                placeholder: 'https://exemple1.com\nhttps://exemple2.com\nhttps://exemple3.com',
                required: true,
                fieldName: 'realisations_liens',
                rows: 3,
                description: '⚠️ PREUVE OBLIGATOIRE : Liens vers des projets réels que vous avez réalisés. Ces liens seront vérifiés.'
            },
            {
                id: 'realisations',
                question: 'Décrivez ces réalisations (contexte, technologies utilisées, résultats)',
                type: 'textarea',
                placeholder: 'Pour chaque réalisation : contexte, technologies utilisées, résultats obtenus, votre rôle...',
                required: true,
                fieldName: 'realisations',
                rows: 4,
                description: 'Détaillez chaque réalisation pour prouver votre expertise technique'
            },
            {
                id: 'linkedin',
                question: 'Quel est le lien vers votre profil LinkedIn ?',
                type: 'url',
                placeholder: 'https://linkedin.com/in/votre-profil (optionnel)',
                required: false,
                fieldName: 'linkedin',
                pattern: 'https?://.+',
                description: '💡 Si vous n\'avez pas de LinkedIn, vous pouvez laisser vide'
            },
            {
                id: 'references',
                question: '2-3 références clients avec coordonnées complètes (PREUVE REQUISE)',
                type: 'textarea',
                placeholder: 'Nom, Entreprise, Email, Téléphone\nExemple : Jean Dupont, TechCorp, jean@techcorp.com, 06 12 34 56 78',
                required: true,
                fieldName: 'references',
                rows: 3,
                description: '⚠️ PREUVE OBLIGATOIRE : Références vérifiables avec coordonnées complètes. Nous ne les contacterons qu\'avec votre accord.'
            },
            {
                id: 'tarifs',
                question: 'Quelle est votre fourchette de tarifs ?',
                type: 'radio',
                required: true,
                fieldName: 'tarifs',
                options: [
                    { value: 'moins-300', label: 'Moins de 300€/jour' },
                    { value: '300-500', label: '300€ - 500€/jour' },
                    { value: '500-800', label: '500€ - 800€/jour' },
                    { value: '800-1200', label: '800€ - 1200€/jour' },
                    { value: 'plus-1200', label: 'Plus de 1200€/jour' },
                    { value: 'au-projet', label: 'Tarification au projet (variable)' }
                ]
            },
            {
                id: 'disponibilite',
                question: 'Quelle est votre disponibilité ?',
                type: 'radio',
                required: true,
                fieldName: 'disponibilite',
                options: [
                    { value: 'plein-temps', label: 'Plein temps' },
                    { value: 'mi-temps', label: 'Mi-temps' },
                    { value: 'ponctuel', label: 'Ponctuel / Projets' },
                    { value: 'limitee', label: 'Disponibilité limitée' }
                ]
            },
            {
                id: 'projets_12_mois',
                question: 'Combien de projets similaires avez-vous réalisés dans les 12 derniers mois ?',
                type: 'radio',
                required: true,
                fieldName: 'projets_12_mois',
                options: [
                    { value: '0', label: 'Aucun (je débute)' },
                    { value: '1-3', label: '1 à 3 projets' },
                    { value: '4-10', label: '4 à 10 projets' },
                    { value: 'plus-10', label: 'Plus de 10 projets' }
                ]
            },
            {
                id: 'taux_satisfaction',
                question: 'Quel est votre taux de satisfaction client moyen ?',
                type: 'radio',
                required: true,
                fieldName: 'taux_satisfaction',
                options: [
                    { value: 'moins-70', label: 'Moins de 70%' },
                    { value: '70-85', label: '70% - 85%' },
                    { value: '85-95', label: '85% - 95%' },
                    { value: 'plus-95', label: 'Plus de 95%' },
                    { value: 'pas-encore', label: 'Je n\'ai pas encore assez de retours pour estimer' }
                ]
            },
            {
                id: 'certification',
                question: 'Je certifie sur l\'honneur que toutes les informations fournies sont exactes et vérifiables',
                type: 'checkbox',
                required: true,
                fieldName: 'certification',
                description: 'Je comprends que la vérification de ces informations permet de garantir la qualité du réseau pour tous.'
            }
        ];

        // Initialiser le quiz
        let quiz;
        document.addEventListener('DOMContentLoaded', () => {
            quiz = new LandingQuiz(prestatairesQuestions, 'landing-form', 'prestataire');
        });

        // Gérer la soumission du formulaire
        function handleQuizFormSubmit(event) {
            event.preventDefault();
            
            if (!quiz) return;
            
            const data = quiz.collectAllAnswers();
            
            // Créer un FormData avec toutes les réponses
            const form = document.getElementById('landing-form');
            const formData = new FormData(form);
            
            // Ajouter toutes les réponses du quiz au FormData
            Object.keys(data).forEach(key => {
                if (data[key] !== null && data[key] !== undefined && data[key] !== '') {
                    formData.set(key, data[key]);
                }
            });
            
            // Créer un objet data pour handleLandingFormSubmit
            const submitData = {};
            formData.forEach((value, key) => {
                if (key !== 'website') {
                    submitData[key] = value;
                }
            });
            
            // Créer un événement simulé avec les données
            const fakeEvent = {
                preventDefault: () => {},
                target: form
            };
            
            // Remplacer temporairement les valeurs du formulaire
            const originalValues = {};
            Object.keys(submitData).forEach(key => {
                const input = form.querySelector(`[name="${key}"]`);
                if (input) {
                    originalValues[key] = input.value;
                    if (input.type === 'checkbox' || input.type === 'radio') {
                        input.checked = submitData[key] === input.value;
                    } else {
                        input.value = submitData[key];
                    }
                }
            });
            
            // Appeler handleLandingFormSubmit
            if (typeof handleLandingFormSubmit === 'function') {
                handleLandingFormSubmit(fakeEvent);
            }
        }
    </script>
</body>
</html>
