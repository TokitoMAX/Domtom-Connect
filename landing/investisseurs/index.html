    <script>
        // Questions simplifiées pour les investisseurs (sans données pré-remplies)
        const investisseursQuestionsSimplified = [
            { id: 'prenom', question: 'Quel est votre prénom ?', type: 'text', placeholder: 'Votre prénom', required: true, fieldName: 'prenom' },

            {
                id: 'montant_investissement', question: 'Quel est le montant d\'investissement potentiel ?', type: 'radio', required: true, fieldName: 'montant_investissement', options: [

                    { value: '50k-200k', label: '50 000 - 200 000 €' },
                    { value: '200k-plus', label: 'Plus de 200 000 €' }
                ]
            },
            { id: 'certification', question: 'Je certifie sur l\'honneur que toutes les informations fournies sont exactes', type: 'checkbox', required: true, fieldName: 'certification', description: 'Je comprends que la vérification de ces informations permet de garantir la qualité du réseau pour tous.' }
        ];

        const investisseursQuestions = [
            { id: 'prenom', question: 'Quel est votre prénom ?', type: 'text', placeholder: 'Votre prénom', required: true, fieldName: 'prenom' },
            { id: 'nom', question: 'Quel est votre nom ?', type: 'text', placeholder: 'Votre nom', required: true, fieldName: 'nom' },
            { id: 'email', question: 'Quelle est votre adresse email ?', type: 'email', placeholder: 'votre@email.com', required: true, fieldName: 'email' },
            { id: 'telephone', question: 'Quel est votre numéro de téléphone ?', type: 'tel', placeholder: '06 12 34 56 78', required: true, fieldName: 'telephone' },
            {
                id: 'ile', question: 'Dans quel territoire êtes-vous basé ?', type: 'select', required: true, fieldName: 'ile', placeholder: 'Sélectionnez votre territoire', options: [
                    { value: 'martinique', label: 'Martinique' },
                    { value: 'guadeloupe', label: 'Guadeloupe' },
                    { value: 'reunion', label: 'La Réunion' },
                    { value: 'guyane', label: 'Guyane' },
                    { value: 'diaspora', label: 'Diaspora' },
                    { value: 'autre', label: 'Autre' }
                ]
            },
            {
                id: 'montant_investissement', question: 'Quel est le montant d\'investissement potentiel ?', type: 'radio', required: true, fieldName: 'montant_investissement', options: [
                    { value: 'moins-50k', label: 'Moins de 50 000 €' },
                    { value: '50k-200k', label: '50 000 - 200 000 €' },
                    { value: '200k-plus', label: 'Plus de 200 000 €' }
                ]
            },
            { id: 'certification', question: 'Je certifie sur l\'honneur que toutes les informations fournies sont exactes', type: 'checkbox', required: true, fieldName: 'certification', description: 'Je comprends que la vérification de ces informations permet de garantir la qualité du réseau pour tous.' }
        ];

        let quiz;

        document.addEventListener('DOMContentLoaded', function () {
            quiz = new LandingQuiz(investisseursQuestions, 'landing-form', 'investisseur', investisseursQuestionsSimplified);
        });

        async function handleQuizFormSubmit(event) {
            event.preventDefault();
            if (!quiz) return;

            const data = quiz.collectAllAnswers();
            data.profil = 'investisseur';

            // Filet de sécurité : récupérer depuis quiz.answers si data est incomplet
            [['prenom', 'question_prenom'], ['nom', 'question_nom'], ['email', 'question_email'], ['telephone', 'question_telephone'], ['ile', 'question_ile']].forEach(([field, key]) => {
                if ((!data[field] || !String(data[field]).trim()) && quiz.answers[key]) {
                    data[field] = String(quiz.answers[key]).trim();
                }
            });

            // Bloquer l'envoi si champs obligatoires manquants
            const prenomVal = (data.prenom || data.question_prenom || '').trim();
            const nomVal = (data.nom || data.question_nom || '').trim();
            const emailVal = (data.email || data.question_email || '').trim();
            const telVal = (data.telephone || data.question_telephone || '').trim();
            const ileVal = (data.ile || data.question_ile || '').trim();
            const emailInvalide = !emailVal || !emailVal.includes('@');
            if (emailInvalide || !prenomVal || !nomVal || !telVal || !ileVal) {
                const champs = [];
                if (!prenomVal) champs.push('Prénom');
                if (!nomVal) champs.push('Nom');
                if (emailInvalide) champs.push('Email');
                if (!telVal) champs.push('Téléphone');
                if (!ileVal) champs.push('Territoire');
                if (champs.length) {
                    alert('Pour envoyer votre inscription, merci de remplir tous les champs obligatoires : ' + champs.join(', ') + '.');
                    return;
                }
            }

            // Validation silencieuse (sans alertes) - juste pour collecter les infos
            const validator = new FormValidator();
            const validation = await validator.validateForm(data);

            // Ajouter les résultats de validation aux données (pour l'email) mais ne pas bloquer
            if (validation.credibilityScore) {
                data.credibility_score = validation.credibilityScore.score;
                data.credibility_level = validation.credibilityScore.level;
            }
            if (validation.inconsistencies.length > 0) {
                data.inconsistencies = JSON.stringify(validation.inconsistencies);
            }

            // Préparer les données pour l'envoi
            const prenom = data.prenom || data.question_prenom || '';
            const nom = data.nom || data.question_nom || '';
            const email = data.email || data.question_email || '';
            const telephone = data.telephone || data.question_telephone || '';
            const ile = data.ile || data.question_ile || '';
            const montant_investissement = data.montant_investissement || data.question_montant_investissement || '';

            // Déterminer la cotisation selon le montant (désactivé)
            let cotisationInfo = null;
            if (montant_investissement === 'moins-50k') {
                cotisationInfo = { montant: 'Sur Devis', description: 'Moins de 50 000€ d\'investissement' };
            } else if (montant_investissement === '50k-200k') {
                cotisationInfo = { montant: 'Sur Devis', description: '50 000€ à 200 000€ d\'investissement' };
            } else if (montant_investissement === '200k-plus') {
                cotisationInfo = { montant: 'Sur Devis', description: 'Plus de 200 000€ d\'investissement' };
            }

            // Préparer le message pour l'email
            let messageBody = `INVESTISSEUR - NOUVELLE INSCRIPTION
Source: Landing Page investisseurs
Date: ${new Date().toLocaleString('fr-FR')}

BLOC 1 - PROFIL & ORIGINE
Prénom: ${prenom}
Nom: ${nom}
Email: ${email}
Téléphone: ${telephone || 'Non renseigné'}
Territoire: ${ile || 'Non renseigné'}

BLOC 2 - INVESTISSEMENT
Montant d'investissement potentiel: ${montant_investissement || 'Non renseigné'}
${cotisationInfo ? `Cotisation suggérée: ${cotisationInfo.montant} (ou ${cotisationInfo.annuel})` : ''}
${cotisationInfo ? `Description: ${cotisationInfo.description}` : ''}

VALIDATION
Certification acceptée: OUI

PROCHAINES ÉTAPES
1. Contacter ${prenom} ${nom} pour un appel découverte
2. Discuter des opportunités d'investissement
3. Présenter des projets qualifiés
4. Définir ensemble la cotisation mensuelle

DONNÉES COMPLÈTES
${Object.keys(data).filter(key => {
                // Exclure les champs déjà affichés et les champs techniques
                const excludedKeys = ['profil', 'credibility_score', 'credibility_level', 'inconsistencies', 'website'];
                const displayedKeys = ['prenom', 'nom', 'email', 'telephone', 'ile', 'montant_investissement'];
                return !excludedKeys.includes(key) && !displayedKeys.includes(key) && !key.startsWith('question_');
            }).map(key => {
                const value = data[key];
                if (value && value !== '' && value !== null && value !== undefined) {
                    const label = key.charAt(0).toUpperCase() + key.slice(1).replace(/_/g, ' ');
                    return `${label}: ${value}`;
                }
                return null;
            }).filter(line => line !== null).join('\n') || 'Aucune donnée supplémentaire'}`;

            const formDataToSend = new FormData();
            formDataToSend.append('_to', 'domtomconnect@gmail.com');
            formDataToSend.append('_subject', `INVESTISSEUR - ${prenom} ${nom}${cotisationInfo ? ' - ' + cotisationInfo.montant : ''}`);
            formDataToSend.append('_replyto', email);
            formDataToSend.append('message', messageBody);

            // Données structurées
            formDataToSend.append('Prénom', prenom);
            formDataToSend.append('Nom', nom);
            formDataToSend.append('Email', email);
            formDataToSend.append('Téléphone', telephone || '');
            formDataToSend.append('Territoire', ile || '');
            formDataToSend.append('Montant investissement', montant_investissement || '');
            formDataToSend.append('Profil', 'investisseur');

            // Ajouter TOUTES les autres données collectées
            Object.keys(data).forEach(key => {
                const excludedKeys = ['profil', 'credibility_score', 'credibility_level', 'inconsistencies', 'website'];
                const alreadyAdded = ['prenom', 'nom', 'email', 'telephone', 'ile', 'montant_investissement'];
                if (!excludedKeys.includes(key) && !alreadyAdded.includes(key) && !key.startsWith('question_')) {
                    const value = data[key];
                    if (value && value !== '' && value !== null && value !== undefined) {
                        const label = key.charAt(0).toUpperCase() + key.slice(1).replace(/_/g, ' ');
                        formDataToSend.append(label, String(value));
                    }
                }
            });

            if (cotisationInfo) {
                formDataToSend.append('Cotisation suggérée', `${cotisationInfo.montant} (ou ${cotisationInfo.annuel})`);
            }
            if (validation.credibilityScore) {
                formDataToSend.append('Score crédibilité', validation.credibilityScore.score);
                formDataToSend.append('Niveau crédibilité', validation.credibilityScore.level);
            }

            // Gérer le bouton
            const submitBtn = event.target.querySelector('button[type="submit"]') ||
                document.querySelector('#quiz-btn-next[type="submit"]');
            const originalBtnText = submitBtn ? (submitBtn.textContent || submitBtn.innerHTML) : '';

            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = 'Envoi en cours...';
            }

            // Envoyer à Formspree
            const formspreeUrl = 'https://formspree.io/f/myzbqepy';

            fetch(formspreeUrl, {
                method: 'POST',
                body: formDataToSend,
                headers: {
                    'Accept': 'application/json'
                }
            })
                .then(response => {
                    console.log('📧 Réponse Formspree:', response.status, response.statusText);

                    if (response.ok) {
                        console.log('✅ Email envoyé avec succès');

                        // Afficher le message de succès
                        const quizContainer = document.querySelector('.quiz-container');
                        const quizQuestionsContainer = document.getElementById('quiz-questions-container');
                        const quizNavigation = document.getElementById('quiz-navigation');

                        const successHTML = `
                        <div style="text-align: center; padding: 3rem 2rem; max-width: 600px; margin: 0 auto; animation: fadeInSlide 0.5s ease;">
                            <div style="font-size: 4rem; margin-bottom: 1.5rem; animation: bounceIn 0.6s ease;">✅</div>
                            <h3 style="color: var(--primary-color); margin-bottom: 1.5rem; font-size: 1.75rem; font-weight: 700;">✓ Inscription envoyée avec succès !</h3>
                            <div style="color: var(--text-secondary); margin-bottom: 2rem; line-height: 1.8; font-size: 1.05rem; white-space: pre-line; text-align: left; background: linear-gradient(135deg, rgba(0, 191, 166, 0.08), rgba(0, 168, 150, 0.05)); padding: 1.5rem; border-radius: 12px; border-left: 4px solid var(--primary-color);">
                                Merci ${prenom ? prenom + ' !' : ' !'} 🎉

Votre demande a bien été reçue et enregistrée.

📧 Vous allez recevoir un email de confirmation avec le récapitulatif de votre demande dans quelques instants.

📞 Réservez votre appel découverte maintenant :

                            <div style="margin: 2rem 0;">
                                <!-- Widget Calendly - Remplacez 'votre-lien-calendly' par votre lien Calendly réel -->
                                <div class="calendly-inline-widget" 
                                     data-url="https://calendly.com/domtomconnect/30min" 
                                     style="min-width:320px;height:700px;border-radius: 12px; overflow: hidden;">
                                </div>
                            </div>

Ou nous vous recontactons sous 24-48h si vous préférez qu'on vous contacte directement.

En attendant, n'hésitez pas à consulter notre site pour en savoir plus sur Domtom Connect.
                            </div>
                            ${cotisationInfo ? `
                                <div style="background: linear-gradient(135deg, #00BFA6 0%, #00A896 100%); border-radius: 20px; padding: 2rem; color: white; margin: 2rem 0;">
                                    <h3 style="font-size: 1.3rem; font-weight: 700; margin-bottom: 0.5rem; color: white;">Cotisation suggérée</h3>
                                    <div style="font-size: 2.5rem; font-weight: 900; margin-bottom: 1rem; color: white;">${cotisationInfo.montant}</div>
                                    <div style="font-size: 1.2rem; margin-bottom: 0.5rem; color: rgba(255, 255, 255, 0.9);">ou ${cotisationInfo.annuel}</div>
                                    <p style="font-size: 1rem; color: rgba(255, 255, 255, 0.9);">${cotisationInfo.description}</p>
                                </div>
                            ` : ''}
                            <a href="../../index.html" class="cta-button primary" style="text-decoration: none; display: inline-block; padding: 1rem 2rem; background: var(--gradient-primary); color: white; border-radius: 8px; font-weight: 600; transition: transform 0.2s; box-shadow: 0 4px 12px rgba(0, 191, 166, 0.3);">Retour à l'accueil</a>
                        </div>
                        <style>
                            @keyframes fadeInSlide {
                                from {
                                    opacity: 0;
                                    transform: translateY(20px);
                                }
                                to {
                                    opacity: 1;
                                    transform: translateY(0);
                                }
                            }
                            @keyframes bounceIn {
                                0% {
                                    transform: scale(0);
                                }
                                50% {
                                    transform: scale(1.2);
                                }
                                100% {
                                    transform: scale(1);
                                }
                            }
                        </style>
                    `;

                        if (quizContainer) {
                            quizContainer.innerHTML = successHTML;
                        } else if (quizQuestionsContainer) {
                            quizQuestionsContainer.innerHTML = successHTML;
                            if (quizNavigation) {
                                quizNavigation.style.display = 'none';
                            }
                        }

                        // Initialiser le widget Calendly après l'injection du HTML
                        setTimeout(() => {
                            const calendlyWidget = document.querySelector('.calendly-inline-widget');
                            if (calendlyWidget) {
                                // Si Calendly est déjà chargé, initialiser directement
                                if (window.Calendly && window.Calendly.initInlineWidget) {
                                    try {
                                        window.Calendly.initInlineWidget({
                                            url: 'https://calendly.com/domtomconnect/30min',
                                            parentElement: calendlyWidget,
                                            prefill: {
                                                email: email || '',
                                                name: `${prenom} ${nom}`.trim() || ''
                                            }
                                        });
                                    } catch (e) {
                                        console.error('Erreur initialisation Calendly:', e);
                                    }
                                } else {
                                    // Si Calendly n'est pas encore chargé, attendre qu'il le soit
                                    const checkCalendly = setInterval(() => {
                                        if (window.Calendly && window.Calendly.initInlineWidget) {
                                            clearInterval(checkCalendly);
                                            try {
                                                window.Calendly.initInlineWidget({
                                                    url: 'https://calendly.com/domtomconnect/30min',
                                                    parentElement: calendlyWidget,
                                                    prefill: {
                                                        email: email || '',
                                                        name: `${prenom} ${nom}`.trim() || ''
                                                    }
                                                });
                                            } catch (e) {
                                                console.error('Erreur initialisation Calendly:', e);
                                            }
                                        }
                                    }, 100);

                                    // Arrêter après 10 secondes si Calendly ne se charge pas
                                    setTimeout(() => clearInterval(checkCalendly), 10000);
                                }
                            }
                        }, 1000);
                    } else {
                        return response.json().then(errData => {
                            console.error('Erreur lors de l\'envoi:', errData);
                            throw new Error(errData.error || 'Erreur lors de l\'envoi');
                        });
                    }
                })
                .catch(error => {
                    console.error('Erreur:', error);
                    alert('Une erreur est survenue lors de l\'envoi de votre demande. Veuillez réessayer ou nous contacter directement à domtomconnect@gmail.com.');
                    if (submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = originalBtnText;
                    }
                });
        }
    </script>
