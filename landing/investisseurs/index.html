<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investisseurs - Domtom Connect</title>
    <meta name="description" content="Connectez-vous avec les meilleurs projets des territoires ultramarins. Opportunités d'investissement qualifiées et accompagnement personnalisé.">
    <link rel="stylesheet" href="../../assets/css/style.css?v=3.0">
    <link rel="stylesheet" href="../../assets/css/landing.css?v=1.0">
    <link rel="stylesheet" href="../../assets/css/quiz-landing.css?v=1.0">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="nav-brand" id="logo-home" title="Retour à l'accueil" onclick="window.location.href='/'; return false;" style="cursor: pointer; position: relative; z-index: 9999;">
                <img src="../../assets/images/logo-domtomconnect.png" alt="Domtom Connect" class="nav-logo" onclick="window.location.href='/'; return false;" style="cursor: pointer;">
                <span class="nav-brand-name" onclick="window.location.href='/'; return false;" style="cursor: pointer;">Domtom Connect</span>
            </a>
        </div>
    </nav>

    <section class="landing-hero quiz-hero">
        <div class="container">
            <div class="landing-content">
                <h1>Investisseurs : Rejoignez l'Écosystème Entrepreneurial Ultramarin</h1>
                
                <form class="landing-form quiz-form" id="landing-form" onsubmit="handleQuizFormSubmit(event)">
                    <div class="quiz-container"></div>
                </form>
            </div>
        </div>
    </section>

    <script src="../../assets/js/landing-quiz.js?v=1.0"></script>
    <script src="../../assets/js/form-validation.js?v=1.0"></script>
    <script src="../../assets/js/form-security.js?v=1.0"></script>
    <script src="../../assets/js/landing.js?v=1.0"></script>
    <script src="../../assets/js/lead-tracking.js?v=1.0"></script>
    <script>
        // Questions simplifiées pour les investisseurs (sans données pré-remplies)
        const investisseursQuestionsSimplified = [
            { id: 'prenom', question: 'Quel est votre prénom ?', type: 'text', placeholder: 'Votre prénom', required: true, fieldName: 'prenom' },
            { id: 'nom', question: 'Quel est votre nom ?', type: 'text', placeholder: 'Votre nom', required: true, fieldName: 'nom' },
            { id: 'email', question: 'Quelle est votre adresse email ?', type: 'email', placeholder: 'votre@email.com', required: true, fieldName: 'email' },
            { id: 'telephone', question: 'Quel est votre numéro de téléphone ?', type: 'tel', placeholder: '06 12 34 56 78', required: true, fieldName: 'telephone' },
            { id: 'ile', question: 'Dans quel territoire êtes-vous basé ?', type: 'select', required: true, fieldName: 'ile', placeholder: 'Sélectionnez votre territoire', options: [
                { value: 'martinique', label: 'Martinique' },
                { value: 'guadeloupe', label: 'Guadeloupe' },
                { value: 'reunion', label: 'La Réunion' },
                { value: 'guyane', label: 'Guyane' },
                { value: 'diaspora', label: 'Diaspora' },
                { value: 'autre', label: 'Autre' }
            ]},
            { id: 'type_investissement', question: 'Quel type d\'investissement vous intéresse ?', type: 'radio', required: true, fieldName: 'type_investissement', options: [
                { value: 'capital-risque', label: 'Capital-risque' },
                { value: 'pret', label: 'Prêt' },
                { value: 'subvention', label: 'Subvention' },
                { value: 'mecenat', label: 'Mécénat' },
                { value: 'autre', label: 'Autre' }
            ]},
            { id: 'montant_investissement', question: 'Quel est le montant d\'investissement potentiel ?', type: 'radio', required: true, fieldName: 'montant_investissement', options: [
                { value: 'moins-10k', label: 'Moins de 10 000 €' },
                { value: '10k-50k', label: '10 000 - 50 000 €' },
                { value: '50k-200k', label: '50 000 - 200 000 €' },
                { value: '200k-plus', label: 'Plus de 200 000 €' }
            ]},
            { id: 'certification', question: 'Je certifie sur l\'honneur que toutes les informations fournies sont exactes', type: 'checkbox', required: true, fieldName: 'certification', description: 'Je comprends que la vérification de ces informations permet de garantir la qualité du réseau pour tous.' }
        ];
        
        const investisseursQuestions = [
            { id: 'prenom', question: 'Quel est votre prénom ?', type: 'text', placeholder: 'Votre prénom', required: true, fieldName: 'prenom' },
            { id: 'nom', question: 'Quel est votre nom ?', type: 'text', placeholder: 'Votre nom', required: true, fieldName: 'nom' },
            { id: 'email', question: 'Quelle est votre adresse email ?', type: 'email', placeholder: 'votre@email.com', required: true, fieldName: 'email' },
            { id: 'telephone', question: 'Quel est votre numéro de téléphone ?', type: 'tel', placeholder: '06 12 34 56 78', required: true, fieldName: 'telephone' },
            { id: 'ile', question: 'Dans quel territoire êtes-vous basé ?', type: 'select', required: true, fieldName: 'ile', placeholder: 'Sélectionnez votre territoire', options: [
                { value: 'martinique', label: 'Martinique' },
                { value: 'guadeloupe', label: 'Guadeloupe' },
                { value: 'reunion', label: 'La Réunion' },
                { value: 'guyane', label: 'Guyane' },
                { value: 'diaspora', label: 'Diaspora' },
                { value: 'autre', label: 'Autre' }
            ]},
            { id: 'type_investissement', question: 'Quel type d\'investissement vous intéresse ?', type: 'radio', required: true, fieldName: 'type_investissement', options: [
                { value: 'capital-risque', label: 'Capital-risque' },
                { value: 'pret', label: 'Prêt' },
                { value: 'subvention', label: 'Subvention' },
                { value: 'mecenat', label: 'Mécénat' },
                { value: 'autre', label: 'Autre' }
            ]},
            { id: 'montant_investissement', question: 'Quel est le montant d\'investissement potentiel ?', type: 'radio', required: true, fieldName: 'montant_investissement', options: [
                { value: 'moins-10k', label: 'Moins de 10 000 €' },
                { value: '10k-50k', label: '10 000 - 50 000 €' },
                { value: '50k-200k', label: '50 000 - 200 000 €' },
                { value: '200k-plus', label: 'Plus de 200 000 €' }
            ]},
            { id: 'secteurs_interet', question: 'Quels sont vos secteurs d\'intérêt ?', type: 'radio', required: true, fieldName: 'secteurs_interet', options: [
                { value: 'tech', label: 'Technologie / Digital' },
                { value: 'commerce', label: 'Commerce / E-commerce' },
                { value: 'services', label: 'Services' },
                { value: 'agriculture', label: 'Agriculture / Agroalimentaire' },
                { value: 'tourisme', label: 'Tourisme' },
                { value: 'autre', label: 'Autre' }
            ]},
            { id: 'experience_investissement', question: 'Quelle est votre expérience en investissement ?', type: 'radio', required: true, fieldName: 'experience_investissement', options: [
                { value: 'debutant', label: 'Débutant (je découvre l\'investissement)' },
                { value: 'quelques-investissements', label: 'Quelques investissements' },
                { value: 'expert', label: 'Expert (investisseur régulier)' }
            ]},
            { id: 'motivation', question: 'Qu\'est-ce qui vous pousse à investir dans les territoires ultramarins ?', type: 'radio', required: true, fieldName: 'motivation', options: [
                { value: 'retour-territoire', label: 'Retour aux sources / Lien avec mon territoire d\'origine' },
                { value: 'opportunite-croissance', label: 'Opportunités de croissance dans des marchés émergents' },
                { value: 'impact-social', label: 'Impact social et développement local' },
                { value: 'diversification', label: 'Diversification de mon portefeuille d\'investissement' },
                { value: 'autre', label: 'Autre (à préciser)' }
            ]},
            { id: 'motivation_autre', question: 'Précisez votre motivation', type: 'text', placeholder: 'Votre motivation', required: false, fieldName: 'motivation_autre', conditional: { field: 'motivation', value: 'autre' }},
            { id: 'attentes', question: 'Quelles sont vos attentes principales avec Domtom Connect ?', type: 'radio', required: true, fieldName: 'attentes', options: [
                { value: 'decouvrir-projets', label: 'Découvrir des projets à financer' },
                { value: 'reseau-investisseurs', label: 'Rejoindre un réseau d\'investisseurs' },
                { value: 'mentorat', label: 'Proposer du mentorat aux porteurs de projets' },
                { value: 'comprendre-ecosysteme', label: 'Comprendre l\'écosystème entrepreneurial ultramarin' },
                { value: 'autre', label: 'Autre (à préciser)' }
            ]},
            { id: 'attentes_autre', question: 'Précisez vos attentes', type: 'text', placeholder: 'Vos attentes', required: false, fieldName: 'attentes_autre', conditional: { field: 'attentes', value: 'autre' }},
            { id: 'criteres', question: 'Quels sont les critères les plus importants pour vous lors de l\'évaluation d\'un projet ?', type: 'radio', required: true, fieldName: 'criteres', options: [
                { value: 'equipe-porteur', label: 'L\'équipe et le porteur de projet' },
                { value: 'potentiel-marche', label: 'Le potentiel du marché' },
                { value: 'viabilite-financiere', label: 'La viabilité financière' },
                { value: 'impact-territoire', label: 'L\'impact sur le territoire' },
                { value: 'autre', label: 'Autre (à préciser)' }
            ]},
            { id: 'criteres_autre', question: 'Précisez vos critères', type: 'text', placeholder: 'Vos critères', required: false, fieldName: 'criteres_autre', conditional: { field: 'criteres', value: 'autre' }},
            { id: 'certification', question: 'Je certifie sur l\'honneur que toutes les informations fournies sont exactes et vérifiables', type: 'checkbox', required: true, fieldName: 'certification', description: 'Je comprends que la vérification de ces informations permet de garantir la qualité du réseau pour tous.' }
        ];

        let quiz;
        document.addEventListener('DOMContentLoaded', () => {
            quiz = new LandingQuiz(investisseursQuestions, 'landing-form', 'investisseur', investisseursQuestionsSimplified);
        });

        async function handleQuizFormSubmit(event) {
            event.preventDefault();
            if (!quiz) return;
            
            const data = quiz.collectAllAnswers();
            data.profil = 'investisseur';
            
            // Afficher un message de chargement
            const submitBtn = event.target.querySelector('button[type="submit"]') || 
                            document.querySelector('#quiz-btn-next[type="submit"]');
            const originalBtnText = submitBtn ? submitBtn.innerHTML : '';
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span style="display: inline-block; animation: spin 1s linear infinite;">⏳</span> Vérification en cours...';
            }
            
            // Valider le formulaire
            const validator = new FormValidator();
            const validation = await validator.validateForm(data);
            
            // Afficher les résultats de validation
            let canSubmit = true;
            
            if (!validation.valid) {
                canSubmit = false;
                const validationMessage = '❌ Erreurs détectées :\n' + 
                    validation.errors.map(e => `• ${e.message}`).join('\n');
                alert(validationMessage);
            } else {
                // Afficher les avertissements
                if (validation.warnings.length > 0) {
                    const warnings = validation.warnings.map(w => `• ${w.message}`).join('\n');
                    const continueAnyway = confirm('⚠️ Avertissements détectés :\n\n' + warnings + 
                        '\n\nSouhaitez-vous continuer malgré ces avertissements ?');
                    if (!continueAnyway) {
                        canSubmit = false;
                    }
                }
                
                // Afficher les incohérences
                if (validation.inconsistencies.length > 0) {
                    const inconsistencies = validation.inconsistencies.map(i => `• ${i.message}`).join('\n');
                    const continueAnyway = confirm('⚠️ Incohérences détectées :\n\n' + inconsistencies + 
                        '\n\nCes incohérences seront vérifiées lors de l\'appel de qualification.\n\nSouhaitez-vous continuer ?');
                    if (!continueAnyway) {
                        canSubmit = false;
                    }
                }
                
                // Afficher le score de crédibilité
                if (validation.credibilityScore) {
                    const score = validation.credibilityScore.score;
                    const level = validation.credibilityScore.level;
                    
                    if (level === 'low') {
                        const continueAnyway = confirm(`⚠️ Score de crédibilité faible : ${score}%\n\n` +
                            `Votre score est en dessous du seuil recommandé (60%).\n` +
                            `Cela peut être dû à :\n` +
                            `• Informations incomplètes\n` +
                            `• Incohérences dans vos réponses\n\n` +
                            `Souhaitez-vous continuer ? Un appel de qualification approfondi sera nécessaire.`);
                        if (!continueAnyway) {
                            canSubmit = false;
                        }
                    } else if (level === 'medium') {
                        alert(`ℹ️ Score de crédibilité : ${score}%\n\n` +
                            `Votre score est acceptable mais une vérification approfondie sera effectuée lors de l'appel.`);
                    }
                }
            }
            
            // Restaurer le bouton
            if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalBtnText;
            }
            
            if (!canSubmit) {
                return;
            }
            
            const form = document.getElementById('landing-form');
            const formData = new FormData(form);
            Object.keys(data).forEach(key => {
                if (data[key] !== null && data[key] !== undefined && data[key] !== '') {
                    formData.set(key, data[key]);
                }
            });
            
            // Ajouter les résultats de validation
            if (validation.credibilityScore) {
                formData.set('credibility_score', validation.credibilityScore.score);
                formData.set('credibility_level', validation.credibilityScore.level);
            }
            if (validation.inconsistencies.length > 0) {
                formData.set('inconsistencies', JSON.stringify(validation.inconsistencies));
            }
            
            const submitData = {};
            formData.forEach((value, key) => {
                if (key !== 'website') submitData[key] = value;
            });
            const fakeEvent = { preventDefault: () => {}, target: form };
            Object.keys(submitData).forEach(key => {
                const input = form.querySelector(`[name="${key}"]`);
                if (input) {
                    if (input.type === 'checkbox' || input.type === 'radio') {
                        input.checked = submitData[key] === input.value;
                    } else {
                        input.value = submitData[key];
                    }
                }
            });
            if (typeof handleLandingFormSubmit === 'function') {
                handleLandingFormSubmit(fakeEvent);
            }
        }
    </script>
</body>
</html>
