    <script>
        // Questions simplifiées pour les investisseurs (sans données pré-remplies)
        const investisseursQuestionsSimplified = [
            { id: 'prenom', question: 'Quel est votre prénom ?', type: 'text', placeholder: 'Votre prénom', required: true, fieldName: 'prenom' },
            { id: 'nom', question: 'Quel est votre nom ?', type: 'text', placeholder: 'Votre nom', required: true, fieldName: 'nom' },
            { id: 'email', question: 'Quelle est votre adresse email ?', type: 'email', placeholder: 'votre@email.com', required: true, fieldName: 'email' },
            { id: 'telephone', question: 'Quel est votre numéro de téléphone ?', type: 'tel', placeholder: '06 12 34 56 78', required: true, fieldName: 'telephone' },
            { id: 'ile', question: 'Dans quel territoire êtes-vous basé ?', type: 'select', required: true, fieldName: 'ile', placeholder: 'Sélectionnez votre territoire', options: [
                { value: 'martinique', label: 'Martinique' },
                { value: 'guadeloupe', label: 'Guadeloupe' },
                { value: 'reunion', label: 'La Réunion' },
                { value: 'guyane', label: 'Guyane' },
                { value: 'diaspora', label: 'Diaspora' },
                { value: 'autre', label: 'Autre' }
            ]},
            { id: 'montant_investissement', question: 'Quel est le montant d\'investissement potentiel ?', type: 'radio', required: true, fieldName: 'montant_investissement', options: [
                { value: 'moins-50k', label: 'Moins de 50 000 € (Cotisation : 29€/mois ou 300€/an)' },
                { value: '50k-200k', label: '50 000 - 200 000 € (Cotisation : 49€/mois ou 500€/an)' },
                { value: '200k-plus', label: 'Plus de 200 000 € (Cotisation : 99€/mois ou 1 000€/an)' }
            ]},
            { id: 'certification', question: 'Je certifie sur l\'honneur que toutes les informations fournies sont exactes', type: 'checkbox', required: true, fieldName: 'certification', description: 'Je comprends que la vérification de ces informations permet de garantir la qualité du réseau pour tous.' }
        ];
        
        // Questions simplifiées pour les investisseurs
        const investisseursQuestions = [
            { id: 'prenom', question: 'Quel est votre prénom ?', type: 'text', placeholder: 'Votre prénom', required: true, fieldName: 'prenom' },
            { id: 'nom', question: 'Quel est votre nom ?', type: 'text', placeholder: 'Votre nom', required: true, fieldName: 'nom' },
            { id: 'email', question: 'Quelle est votre adresse email ?', type: 'email', placeholder: 'votre@email.com', required: true, fieldName: 'email' },
            { id: 'telephone', question: 'Quel est votre numéro de téléphone ?', type: 'tel', placeholder: '06 12 34 56 78', required: true, fieldName: 'telephone' },
            { id: 'ile', question: 'Dans quel territoire êtes-vous basé ?', type: 'select', required: true, fieldName: 'ile', placeholder: 'Sélectionnez votre territoire', options: [
                { value: 'martinique', label: 'Martinique' },
                { value: 'guadeloupe', label: 'Guadeloupe' },
                { value: 'reunion', label: 'La Réunion' },
                { value: 'guyane', label: 'Guyane' },
                { value: 'diaspora', label: 'Diaspora' },
                { value: 'autre', label: 'Autre' }
            ]},
            { id: 'montant_investissement', question: 'Quel est le montant d\'investissement potentiel ?', type: 'radio', required: true, fieldName: 'montant_investissement', options: [
                { value: 'moins-50k', label: 'Moins de 50 000 € (Cotisation : 29€/mois ou 300€/an)' },
                { value: '50k-200k', label: '50 000 - 200 000 € (Cotisation : 49€/mois ou 500€/an)' },
                { value: '200k-plus', label: 'Plus de 200 000 € (Cotisation : 99€/mois ou 1 000€/an)' }
            ]},
            { id: 'certification', question: 'Je certifie sur l\'honneur que toutes les informations fournies sont exactes', type: 'checkbox', required: true, fieldName: 'certification', description: 'Je comprends que la vérification de ces informations permet de garantir la qualité du réseau pour tous.' }
        ];

        // Initialiser le quiz
        let quiz;
        document.addEventListener('DOMContentLoaded', () => {
            quiz = new LandingQuiz(investisseursQuestions, 'landing-form', 'investisseur', investisseursQuestionsSimplified);
        });

        // Gérer la soumission du formulaire
        async function handleQuizFormSubmit(event) {
            event.preventDefault();
            
            if (!quiz) return;
            
            // NETTOYER les données en cache avant de collecter (pour éviter les conflits)
            // Réinitialiser les réponses pour forcer la collecte depuis les inputs actuels
            quiz.answers = {};
            
            // S'assurer qu'on récupère les données fraîches depuis les inputs
            quiz.questions.forEach(question => {
                const input = document.getElementById(`question_${question.id}`) || 
                             document.querySelector(`input[name="question_${question.id}"]`) ||
                             document.querySelector(`select[name="question_${question.id}"]`) ||
                             document.querySelector(`textarea[name="question_${question.id}"]`);
                if (input) {
                    // Forcer la sauvegarde de la valeur actuelle
                    if (question.type === 'radio') {
                        const checked = document.querySelector(`input[name="question_${question.id}"]:checked`);
                        if (checked) {
                            quiz.answers[`question_${question.id}`] = checked.value;
                        }
                    } else if (question.type === 'checkbox') {
                        quiz.answers[`question_${question.id}`] = input.checked ? (input.value || 'OUI') : null;
                    } else {
                        quiz.answers[`question_${question.id}`] = input.value || null;
                    }
                }
            });
            
            const data = quiz.collectAllAnswers();
            data.profil = 'investisseur';
            
            // FORCER la récupération des champs de base depuis les inputs du DOM
            // S'assurer que prénom, nom, email, telephone sont bien présents
            const baseFields = [
                { key: 'prenom', selectors: ['question_prenom', 'input[name="question_prenom"]', 'input[name="prenom"]'] },
                { key: 'nom', selectors: ['question_nom', 'input[name="question_nom"]', 'input[name="nom"]'] },
                { key: 'email', selectors: ['question_email', 'input[name="question_email"]', 'input[name="email"]', 'input[type="email"]'] },
                { key: 'telephone', selectors: ['question_telephone', 'input[name="question_telephone"]', 'input[name="telephone"]', 'input[type="tel"]'] }
            ];
            
            baseFields.forEach(field => {
                if (!data[field.key] || data[field.key].trim() === '') {
                    for (const selector of field.selectors) {
                        const input = document.getElementById(selector) || 
                                     document.querySelector(selector);
                        if (input && input.value && input.value.trim() !== '') {
                            data[field.key] = input.value.trim();
                            console.log(`✅ ${field.key} récupéré depuis le DOM:`, data[field.key]);
                            break;
                        }
                    }
                }
            });
            
            // Vérification finale et logs
            console.log('📝 Données collectées après nettoyage:', {
                prenom: data.prenom,
                nom: data.nom,
                email: data.email,
                telephone: data.telephone,
                profil: data.profil
            });
            
            console.log('📝 Données collectées avant validation:', {
                prenom: data.prenom,
                nom: data.nom,
                email: data.email
            });
            
            // Afficher un message de chargement
            const submitBtn = event.target.querySelector('button[type="submit"]') || 
                            document.querySelector('#quiz-btn-next[type="submit"]');
            const originalBtnText = submitBtn ? submitBtn.innerHTML : '';
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span style="display: inline-block; animation: spin 1s linear infinite;">⏳</span> Envoi en cours...';
            }
            
            // PAS DE VALIDATION - ENVOYER DIRECTEMENT CE QUE L'UTILISATEUR A ÉCRIT
            
            // Vérifier l'email mais ne PAS bloquer l'envoi
            if (!data.email || data.email.trim() === '') {
                console.warn('⚠️ Email manquant dans handleQuizFormSubmit, recherche dans tous les champs...');
                
                // Chercher dans tous les inputs du formulaire
                const allInputs = document.querySelectorAll('input, textarea, select');
                for (const input of allInputs) {
                    const value = input.value || '';
                    if (value.includes('@') && value.includes('.')) {
                        data.email = value.trim();
                        console.log('✅ Email trouvé dans un input:', data.email);
                        break;
                    }
                }
                
                // Si toujours pas d'email, utiliser une valeur par défaut
                if (!data.email || data.email.trim() === '') {
                    console.warn('⚠️ Utilisation d\'une valeur par défaut pour permettre l\'envoi');
                    data.email = data.prenom && data.nom 
                        ? `${data.prenom.toLowerCase()}.${data.nom.toLowerCase()}@domtomconnect-temp.com`
                        : 'contact@domtomconnect-temp.com';
                }
            }
            
            console.log('✅ Email utilisé pour l\'envoi:', data.email);
            
            // Créer un FormData avec toutes les réponses
            const form = document.getElementById('landing-form');
            const formData = new FormData(form);
            
            // Ajouter toutes les réponses du quiz au FormData
            // IMPORTANT: S'assurer que l'email est bien ajouté avec la clé "email"
            Object.keys(data).forEach(key => {
                if (data[key] !== null && data[key] !== undefined && data[key] !== '') {
                    formData.set(key, data[key]);
                }
            });
            
            // Vérification finale : s'assurer que l'email est bien dans le FormData
            if (!formData.get('email') && !formData.get('question_email')) {
                // Forcer l'ajout de l'email
                formData.set('email', data.email);
                console.log('✅ Email ajouté manuellement au FormData:', data.email);
            }
            
            // Créer un objet data pour handleLandingFormSubmit
            const submitData = {};
            formData.forEach((value, key) => {
                if (key !== 'website') {
                    submitData[key] = value;
                }
            });
            
            // S'assurer que l'email est dans submitData (ne PAS bloquer si manquant)
            if (!submitData.email) {
                // Essayer de récupérer depuis data directement
                if (data.email) {
                    submitData.email = data.email;
                    console.log('✅ Email ajouté à submitData depuis data:', data.email);
                } else {
                    // Utiliser une valeur par défaut pour permettre l'envoi
                    submitData.email = data.prenom && data.nom 
                        ? `${data.prenom.toLowerCase()}.${data.nom.toLowerCase()}@domtomconnect-temp.com`
                        : 'contact@domtomconnect-temp.com';
                    console.warn('⚠️ Email manquant, utilisation d\'une valeur par défaut:', submitData.email);
                }
            }
            
            console.log('✅ Données finales avant envoi à handleLandingFormSubmit:', {
                email: submitData.email,
                prenom: submitData.prenom,
                nom: submitData.nom
            });
            
            // FORCER l'ajout de tous les champs de base au formulaire AVANT l'appel à handleLandingFormSubmit
            // Récupérer les valeurs DIRECTEMENT depuis les inputs du quiz
            const getValueFromQuiz = (fieldName) => {
                // Essayer plusieurs sélecteurs possibles
                const selectors = [
                    `#question_${fieldName}`,
                    `input[name="question_${fieldName}"]`,
                    `select[name="question_${fieldName}"]`,
                    `input[name="${fieldName}"]`,
                    `select[name="${fieldName}"]`
                ];
                
                for (const selector of selectors) {
                    const input = document.querySelector(selector);
                    if (input) {
                        if (input.type === 'radio') {
                            const checked = document.querySelector(`input[name="${input.name}"]:checked`);
                            if (checked) return checked.value;
                        } else if (input.type === 'checkbox') {
                            return input.checked ? (input.value || 'OUI') : '';
                        } else {
                            return input.value || '';
                        }
                    }
                }
                return '';
            };
            
            // Récupérer les valeurs directement depuis les inputs
            const prenomValue = getValueFromQuiz('prenom') || submitData.prenom || data.prenom || '';
            const nomValue = getValueFromQuiz('nom') || submitData.nom || data.nom || '';
            const emailValue = getValueFromQuiz('email') || submitData.email || data.email || '';
            const telephoneValue = getValueFromQuiz('telephone') || submitData.telephone || data.telephone || '';
            const ileValue = getValueFromQuiz('ile') || submitData.ile || data.ile || '';
            
            console.log('✅ Valeurs récupérées depuis les inputs:', {
                prenom: prenomValue,
                nom: nomValue,
                email: emailValue,
                telephone: telephoneValue,
                ile: ileValue
            });
            
            // Créer des inputs cachés pour garantir que toutes les données sont dans le FormData
            const requiredFields = [
                { name: 'prenom', value: prenomValue },
                { name: 'nom', value: nomValue },
                { name: 'email', value: emailValue },
                { name: 'telephone', value: telephoneValue },
                { name: 'ile', value: ileValue },
                { name: 'profil', value: 'investisseur' }
            ];
            
            requiredFields.forEach(field => {
                // Supprimer tous les inputs existants avec ce nom
                const existingInputs = form.querySelectorAll(`[name="${field.name}"], [name="question_${field.name}"]`);
                existingInputs.forEach(input => input.remove());
                
                // Créer un nouvel input caché avec la valeur
                const hiddenInput = document.createElement('input');
                hiddenInput.type = 'hidden';
                hiddenInput.name = field.name;
                hiddenInput.value = field.value;
                form.appendChild(hiddenInput);
                console.log(`✅ Champ ${field.name} ajouté au formulaire:`, field.value);
            });
            
            // Ajouter aussi tous les autres champs du quiz (simplifié)
            const allQuizFields = [
                'montant_mensuel', 'pourquoi_investir', 'certification'
            ];
            
            allQuizFields.forEach(fieldName => {
                const value = getValueFromQuiz(fieldName) || submitData[fieldName] || data[fieldName] || '';
                
                // Supprimer l'input existant s'il existe
                const existingInput = form.querySelector(`[name="${fieldName}"], [name="question_${fieldName}"]`);
                if (existingInput && existingInput.type === 'hidden') {
                    existingInput.remove();
                }
                
                // Créer un input caché pour garantir que la valeur est dans le FormData
                if (value) {
                    const hiddenInput = document.createElement('input');
                    hiddenInput.type = 'hidden';
                    hiddenInput.name = fieldName;
                    hiddenInput.value = value;
                    form.appendChild(hiddenInput);
                    console.log(`✅ Champ quiz ${fieldName} ajouté:`, value);
                }
            });
            
            // Ajouter aussi tous les autres champs de submitData qui ne sont pas déjà traités
            Object.keys(submitData).forEach(key => {
                if (!requiredFields.some(f => f.name === key) && !allQuizFields.includes(key)) {
                    // Supprimer l'input existant s'il existe
                    const existingInput = form.querySelector(`[name="${key}"]`);
                    if (existingInput && existingInput.type === 'hidden') {
                        existingInput.remove();
                    }
                    
                    // Créer un input caché pour garantir que la valeur est dans le FormData
                    if (submitData[key]) {
                        const hiddenInput = document.createElement('input');
                        hiddenInput.type = 'hidden';
                        hiddenInput.name = key;
                        hiddenInput.value = submitData[key];
                        form.appendChild(hiddenInput);
                    }
                }
            });
            
            // Vérification finale : s'assurer que les champs de base sont bien dans le formulaire
            const finalFormData = new FormData(form);
            console.log('✅ Vérification finale FormData:', {
                prenom: finalFormData.get('prenom'),
                nom: finalFormData.get('nom'),
                email: finalFormData.get('email'),
                telephone: finalFormData.get('telephone'),
                profil: finalFormData.get('profil')
            });
            
            // Créer un événement simulé avec les données
            const fakeEvent = {
                preventDefault: () => {},
                target: form,
                currentTarget: form
            };
            
            // Appeler handleLandingFormSubmit
            console.log('🔍 Vérification de handleLandingFormSubmit:', typeof handleLandingFormSubmit);
            console.log('🔍 Formulaire:', form);
            console.log('🔍 Données à envoyer:', submitData);
            
            // Attendre un peu pour s'assurer que tout est prêt
            setTimeout(() => {
                if (typeof handleLandingFormSubmit === 'function') {
                    console.log('✅ Appel de handleLandingFormSubmit...');
                    try {
                        // Appeler directement avec l'événement
                        handleLandingFormSubmit(fakeEvent);
                        console.log('✅ handleLandingFormSubmit appelé avec succès');
                    } catch (error) {
                        console.error('❌ Erreur lors de l\'appel de handleLandingFormSubmit:', error);
                        console.error('❌ Stack trace:', error.stack);
                        alert('Erreur lors de l\'envoi: ' + error.message);
                        if (submitBtn) {
                            submitBtn.disabled = false;
                            submitBtn.innerHTML = originalBtnText;
                        }
                    }
                } else {
                    console.error('❌ handleLandingFormSubmit n\'est pas une fonction ! Type:', typeof handleLandingFormSubmit);
                    console.error('❌ window.handleLandingFormSubmit:', window.handleLandingFormSubmit);
                    // Essayer d'appeler depuis window
                    if (window.handleLandingFormSubmit && typeof window.handleLandingFormSubmit === 'function') {
                        console.log('✅ handleLandingFormSubmit trouvé dans window, appel...');
                        try {
                            window.handleLandingFormSubmit(fakeEvent);
                        } catch (error) {
                            console.error('❌ Erreur:', error);
                            alert('Erreur lors de l\'envoi: ' + error.message);
                            if (submitBtn) {
                                submitBtn.disabled = false;
                                submitBtn.innerHTML = originalBtnText;
                            }
                        }
                    } else {
                        alert('Erreur: Le formulaire ne peut pas être envoyé. Veuillez recharger la page.');
                        if (submitBtn) {
                            submitBtn.disabled = false;
                            submitBtn.innerHTML = originalBtnText;
                        }
                    }
                }
            }, 100);
        }
    </script>
