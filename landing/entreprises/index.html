            { id: 'besoin', question: 'Quel est votre besoin principal ?', type: 'radio', required: true, fieldName: 'besoin', options: [

        ];
        
        const entreprisesQuestions = [
            { id: 'prenom', question: 'Quel est votre prénom ?', type: 'text', placeholder: 'Votre prénom', required: true, fieldName: 'prenom' },
            { id: 'nom', question: 'Quel est votre nom ?', type: 'text', placeholder: 'Votre nom', required: true, fieldName: 'nom' },
            { id: 'email', question: 'Quelle est votre adresse email professionnelle ?', type: 'email', placeholder: 'votre@entreprise.com', required: true, fieldName: 'email' },
            { id: 'telephone', question: 'Quel est votre numéro de téléphone ?', type: 'tel', placeholder: '06 12 34 56 78', required: true, fieldName: 'telephone' },
            { id: 'entreprise', question: 'Quel est le nom de votre entreprise ?', type: 'text', placeholder: 'Nom de l\'entreprise', required: true, fieldName: 'entreprise' },
            { id: 'site_web', question: 'Quel est le site web de votre entreprise ? (PREUVE REQUISE)', type: 'url', placeholder: 'https://votre-entreprise.com', required: true, fieldName: 'site_web', pattern: 'https?://.+', description: '⚠️ Preuve obligatoire : Site web de l\'entreprise pour vérifier l\'existence et l\'activité' },
            { id: 'siret', question: 'Quel est le numéro SIRET de votre entreprise ? (PREUVE REQUISE)', type: 'text', placeholder: '12345678901234', required: true, fieldName: 'siret', pattern: '[0-9]{14}', maxlength: 14, description: '⚠️ Preuve obligatoire : Le SIRET doit contenir 14 chiffres. Il sera vérifié.' },
            { id: 'linkedin', question: 'Quel est le lien vers votre profil LinkedIn ?', type: 'url', placeholder: 'https://linkedin.com/in/votre-profil (optionnel)', required: false, fieldName: 'linkedin', pattern: 'https?://.+', description: '💡 Si vous n\'avez pas de LinkedIn, vous pouvez laisser vide' },
            { id: 'secteur_activite', question: 'Dans quel secteur d\'activité évolue votre entreprise ?', type: 'radio', required: true, fieldName: 'secteur_activite', options: [
                { value: 'tech', label: 'Technologie / Digital' },
                { value: 'commerce', label: 'Commerce / E-commerce' },
                { value: 'tourisme', label: 'Tourisme / Hôtellerie' },
                { value: 'agroalimentaire', label: 'Agroalimentaire' },
                { value: 'services', label: 'Services aux entreprises' },
                { value: 'culture', label: 'Culture / Événementiel' },
                { value: 'sante', label: 'Santé / Bien-être' },
                { value: 'education', label: 'Éducation / Formation' },
                { value: 'autre', label: 'Autre secteur' }
            ]},
            { id: 'secteur_activite_autre', question: 'Précisez votre secteur d\'activité', type: 'text', placeholder: 'Votre secteur', required: false, fieldName: 'secteur_activite_autre', conditional: { field: 'secteur_activite', value: 'autre' }},
            { id: 'taille_entreprise', question: 'Quelle est la taille de votre entreprise ?', type: 'radio', required: true, fieldName: 'taille_entreprise', options: [
                { value: 'micro', label: 'Micro-entreprise (0-1 salarié)' },
                { value: 'tpe', label: 'TPE (2-9 salariés)' },
                { value: 'pme', label: 'PME (10-49 salariés)' },
                { value: 'et', label: 'ETI (50-249 salariés)' },
                { value: 'ge', label: 'Grande entreprise (250+ salariés)' }
            ]},
            { id: 'besoin', question: 'Quel est votre besoin principal ?', type: 'radio', required: true, fieldName: 'besoin', options: [
                { value: 'trouver-prestataires', label: 'Trouver des prestataires' },
                { value: 'developper-projet', label: 'Développer un projet' },
                { value: 'trouver-partenaires', label: 'Trouver des partenaires' },
                { value: 'autre', label: 'Autre besoin' }
            ]},
            { id: 'besoin_autre', question: 'Précisez votre besoin', type: 'text', placeholder: 'Votre besoin', required: false, fieldName: 'besoin_autre', conditional: { field: 'besoin', value: 'autre' }},
            { id: 'type_prestations', question: 'Quel type de prestations recherchez-vous ?', type: 'radio', required: true, fieldName: 'type_prestations', options: [
                { value: 'developpement', label: 'Développement web/mobile' },
                { value: 'design', label: 'Design / Identité visuelle' },
                { value: 'marketing', label: 'Marketing / Communication' },
                { value: 'comptabilite', label: 'Comptabilité / Fiscalité' },
                { value: 'juridique', label: 'Juridique / Conseil' },
                { value: 'formation', label: 'Formation / Coaching' },
                { value: 'multiple', label: 'Plusieurs types de prestations' },
                { value: 'autre', label: 'Autre' }
            ]},
            { id: 'type_prestations_autre', question: 'Précisez le type de prestations', type: 'text', placeholder: 'Type de prestations', required: false, fieldName: 'type_prestations_autre', conditional: { field: 'type_prestations', value: 'autre' }},
            { id: 'nombre_prestataires', question: 'Combien de prestataires recherchez-vous ?', type: 'radio', required: true, fieldName: 'nombre_prestataires', options: [
                { value: '1', label: '1 prestataire' },
                { value: '2-3', label: '2 à 3 prestataires' },
                { value: '4-5', label: '4 à 5 prestataires' },
                { value: 'plus-5', label: 'Plus de 5 prestataires' },
                { value: 'non-defini', label: 'À définir selon les besoins' }
            ]},
            { id: 'budget', question: 'Quel est votre budget estimé pour les prestations ?', type: 'radio', required: true, fieldName: 'budget', options: [
                { value: 'moins-2000', label: 'Moins de 2 000€' },
                { value: '2000-5000', label: '2 000€ - 5 000€' },
                { value: '5000-10000', label: '5 000€ - 10 000€' },
                { value: '10000-25000', label: '10 000€ - 25 000€' },
                { value: 'plus-25000', label: 'Plus de 25 000€' },
                { value: 'a-definir', label: 'À définir selon les besoins' }
            ]},
            { id: 'urgence', question: 'Quelle est l\'urgence de votre besoin ?', type: 'radio', required: true, fieldName: 'urgence', options: [
                { value: 'immediat', label: 'Immédiat (dans les 2 semaines)' },
                { value: 'court-terme', label: 'Court terme (1-3 mois)' },
                { value: 'moyen-terme', label: 'Moyen terme (3-6 mois)' },
                { value: 'long-terme', label: 'Long terme (6+ mois)' },
                { value: 'exploration', label: 'En phase d\'exploration' }
            ]},
            { id: 'ile', question: 'Dans quel territoire êtes-vous basé ?', type: 'select', required: true, fieldName: 'ile', placeholder: 'Sélectionnez votre territoire', options: [
                { value: 'martinique', label: 'Martinique' },
                { value: 'guadeloupe', label: 'Guadeloupe' },
                { value: 'reunion', label: 'La Réunion' },
                { value: 'guyane', label: 'Guyane' },
                { value: 'diaspora', label: 'Diaspora' },
                { value: 'autre', label: 'Autre' }
            ]},
            { id: 'description_besoin', question: 'Décrivez votre projet ou besoin spécifique (optionnel mais recommandé)', type: 'textarea', placeholder: 'Décrivez brièvement votre projet ou besoin...', required: false, fieldName: 'description_besoin', rows: 4 },
            { id: 'anciennete_entreprise', question: 'Depuis combien de temps votre entreprise existe-t-elle ?', type: 'radio', required: true, fieldName: 'anciennete_entreprise', options: [
                { value: 'moins-1', label: 'Moins de 1 an (je viens de créer)' },
                { value: '1-3', label: '1 à 3 ans' },
                { value: '3-5', label: '3 à 5 ans' },
                { value: '5-10', label: '5 à 10 ans' },
                { value: 'plus-10', label: 'Plus de 10 ans' }
            ]},
            { id: 'prestataires_precedents', question: 'Combien de prestataires externes avez-vous déjà travaillé avec ?', type: 'radio', required: true, fieldName: 'prestataires_precedents', options: [
                { value: '0', label: 'Aucun (première fois)' },
                { value: '1-3', label: '1 à 3 prestataires' },
                { value: '4-10', label: '4 à 10 prestataires' },
                { value: 'plus-10', label: 'Plus de 10 prestataires' }
            ]},
            { id: 'certification', question: 'Je certifie sur l\'honneur que toutes les informations fournies sont exactes et vérifiables', type: 'checkbox', required: true, fieldName: 'certification', description: 'Je comprends que la vérification de ces informations permet de garantir la qualité du réseau pour tous.' }
        ];

        let quiz;
        document.addEventListener('DOMContentLoaded', () => {
            quiz = new LandingQuiz(entreprisesQuestions, 'landing-form', 'entreprise', entreprisesQuestionsSimplified);
        });

        async function handleQuizFormSubmit(event) {
            event.preventDefault();
            if (!quiz) return;
            
            const data = quiz.collectAllAnswers();
            data.profil = 'entreprise';
            
            // Afficher un message de chargement
            const submitBtn = event.target.querySelector('button[type="submit"]') || 
                            document.querySelector('#quiz-btn-next[type="submit"]');
            const originalBtnText = submitBtn ? submitBtn.innerHTML : '';
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span style="display: inline-block; animation: spin 1s linear infinite;">⏳</span> Vérification en cours...';
            }
            
            // Valider le formulaire
            const validator = new FormValidator();
            const validation = await validator.validateForm(data);
            
            // Afficher les résultats de validation
            let canSubmit = true;
            
            if (!validation.valid) {
                canSubmit = false;
                const validationMessage = '❌ Erreurs détectées :\n' + 
                    validation.errors.map(e => `• ${e.message}`).join('\n');
                alert(validationMessage);
            } else {
                // Afficher les avertissements
                if (validation.warnings.length > 0) {
                    const warnings = validation.warnings.map(w => `• ${w.message}`).join('\n');
                    const continueAnyway = confirm('⚠️ Avertissements détectés :\n\n' + warnings + 
                        '\n\nSouhaitez-vous continuer malgré ces avertissements ?');
                    if (!continueAnyway) {
                        canSubmit = false;
                    }
                }
                
                // Afficher les incohérences
                if (validation.inconsistencies.length > 0) {
                    const inconsistencies = validation.inconsistencies.map(i => `• ${i.message}`).join('\n');
                    const continueAnyway = confirm('⚠️ Incohérences détectées :\n\n' + inconsistencies + 
                        '\n\nCes incohérences seront vérifiées lors de l\'appel de qualification.\n\nSouhaitez-vous continuer ?');
                    if (!continueAnyway) {
                        canSubmit = false;
                    }
                }
                
                // Afficher le score de crédibilité
                if (validation.credibilityScore) {
                    const score = validation.credibilityScore.score;
                    const level = validation.credibilityScore.level;
                    
                    if (level === 'low') {
                        const continueAnyway = confirm(`⚠️ Score de crédibilité faible : ${score}%\n\n` +
                            `Votre score est en dessous du seuil recommandé (60%).\n` +
                            `Cela peut être dû à :\n` +
                            `• Preuves insuffisantes\n` +
                            `• Incohérences dans vos réponses\n` +
                            `• Informations incomplètes\n\n` +
                            `Souhaitez-vous continuer ? Un appel de qualification approfondi sera nécessaire.`);
                        if (!continueAnyway) {
                            canSubmit = false;
                        }
                    } else if (level === 'medium') {
                        alert(`ℹ️ Score de crédibilité : ${score}%\n\n` +
                            `Votre score est acceptable mais une vérification approfondie sera effectuée lors de l'appel.`);
                    }
                }
            }
            
            // Restaurer le bouton
            if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalBtnText;
            }
            
            if (!canSubmit) {
                return;
            }
            
            const form = document.getElementById('landing-form');
            const formData = new FormData(form);
            Object.keys(data).forEach(key => {
                if (data[key] !== null && data[key] !== undefined && data[key] !== '') {
                    formData.set(key, data[key]);
                }
            });
            
            // Ajouter les résultats de validation
            if (validation.credibilityScore) {
                formData.set('credibility_score', validation.credibilityScore.score);
                formData.set('credibility_level', validation.credibilityScore.level);
            }
            if (validation.inconsistencies.length > 0) {
                formData.set('inconsistencies', JSON.stringify(validation.inconsistencies));
            }
            
            const submitData = {};
            formData.forEach((value, key) => {
                if (key !== 'website') submitData[key] = value;
            });
            const fakeEvent = { preventDefault: () => {}, target: form };
            Object.keys(submitData).forEach(key => {
                const input = form.querySelector(`[name="${key}"]`);
                if (input) {
                    if (input.type === 'checkbox' || input.type === 'radio') {
                        input.checked = submitData[key] === input.value;
                    } else {
                        input.value = submitData[key];
                    }
                }
            });
            if (typeof handleLandingFormSubmit === 'function') {
                handleLandingFormSubmit(fakeEvent);
            }
        }
    </script>
