    <script>
        // Questions simplifiées pour les entreprises (sans données pré-remplies)
        const entreprisesQuestionsSimplified = [
            { id: 'prenom', question: 'Quel est votre prénom ?', type: 'text', placeholder: 'Votre prénom', required: true, fieldName: 'prenom' },
            { id: 'nom', question: 'Quel est votre nom ?', type: 'text', placeholder: 'Votre nom', required: true, fieldName: 'nom' },
            { id: 'email', question: 'Quelle est votre adresse email professionnelle ?', type: 'email', placeholder: 'votre@entreprise.com', required: true, fieldName: 'email' },
            { id: 'telephone', question: 'Quel est votre numéro de téléphone ?', type: 'tel', placeholder: '06 12 34 56 78', required: true, fieldName: 'telephone' },
            { id: 'entreprise', question: 'Quel est le nom de votre entreprise ?', type: 'text', placeholder: 'Nom de l\'entreprise', required: true, fieldName: 'entreprise' },
            { id: 'ile', question: 'Dans quel territoire est basée votre entreprise ?', type: 'select', required: true, fieldName: 'ile', placeholder: 'Sélectionnez votre territoire', options: [
                { value: 'martinique', label: 'Martinique' },
                { value: 'guadeloupe', label: 'Guadeloupe' },
                { value: 'reunion', label: 'La Réunion' },
                { value: 'guyane', label: 'Guyane' },
                { value: 'mayotte', label: 'Mayotte' },
                { value: 'polynesie', label: 'Polynésie française' },
                { value: 'nouvelle-caledonie', label: 'Nouvelle-Calédonie' },
                { value: 'diaspora', label: 'Diaspora' },
                { value: 'autre', label: 'Autre' }
            ]},
            { id: 'besoin', question: 'Quel est votre besoin principal ?', type: 'radio', required: true, fieldName: 'besoin', options: [
                { value: 'trouver-prestataires', label: 'Trouver des prestataires' },
                { value: 'developper-projet', label: 'Développer un projet' },
                { value: 'trouver-partenaires', label: 'Trouver des partenaires' },
                { value: 'autre', label: 'Autre besoin' }
            ]},
            { 
                id: 'budget_accompagnement', 
                question: 'Quel budget êtes-vous prêt à investir dans l\'accompagnement Domtom Connect ?', 
                type: 'radio', 
                required: true, 
                fieldName: 'budget_accompagnement', 
                options: [
                    { value: 'moins-300', label: 'Moins de 300 €' },
                    { value: '300-1000', label: '300-1 000 €' },
                    { value: '1000-3000', label: '1 000-3 000 €' },
                    { value: 'plus-3000', label: 'Plus de 3 000 €' },
                    { value: 'non-defini', label: 'Pas encore défini' }
                ], 
                clarification: '<strong>Important :</strong> L\'accompagnement Domtom Connect (recherche, mise en relation, suivi) est un service séparé. Les prestataires sont payés <strong>directement par vous</strong>, sans commission intermédiaire.' 
            },
            { id: 'certification', question: 'Je certifie sur l\'honneur que toutes les informations fournies sont exactes', type: 'checkbox', required: true, fieldName: 'certification', description: 'Je comprends que la vérification de ces informations permet de garantir la qualité du réseau pour tous.' }
        ];
        
        const entreprisesQuestions = [
            { id: 'prenom', question: 'Quel est votre prénom ?', type: 'text', placeholder: 'Votre prénom', required: true, fieldName: 'prenom' },
            { id: 'nom', question: 'Quel est votre nom ?', type: 'text', placeholder: 'Votre nom', required: true, fieldName: 'nom' },
            { id: 'email', question: 'Quelle est votre adresse email professionnelle ?', type: 'email', placeholder: 'votre@entreprise.com', required: true, fieldName: 'email' },
            { id: 'telephone', question: 'Quel est votre numéro de téléphone ?', type: 'tel', placeholder: '06 12 34 56 78', required: true, fieldName: 'telephone' },
            { id: 'entreprise', question: 'Quel est le nom de votre entreprise ?', type: 'text', placeholder: 'Nom de l\'entreprise', required: true, fieldName: 'entreprise' },
            { id: 'ile', question: 'Dans quel territoire est basée votre entreprise ?', type: 'select', required: true, fieldName: 'ile', placeholder: 'Sélectionnez votre territoire', options: [
                { value: 'martinique', label: 'Martinique' },
                { value: 'guadeloupe', label: 'Guadeloupe' },
                { value: 'reunion', label: 'La Réunion' },
                { value: 'guyane', label: 'Guyane' },
                { value: 'mayotte', label: 'Mayotte' },
                { value: 'polynesie', label: 'Polynésie française' },
                { value: 'nouvelle-caledonie', label: 'Nouvelle-Calédonie' },
                { value: 'diaspora', label: 'Diaspora' },
                { value: 'autre', label: 'Autre' }
            ]},
            { id: 'besoin', question: 'Quel est votre besoin principal ?', type: 'radio', required: true, fieldName: 'besoin', options: [
                { value: 'trouver-prestataires', label: 'Trouver des prestataires' },
                { value: 'developper-projet', label: 'Développer un projet' },
                { value: 'trouver-partenaires', label: 'Trouver des partenaires' },
                { value: 'autre', label: 'Autre besoin' }
            ]},
            { 
                id: 'budget_accompagnement', 
                question: 'Quel budget êtes-vous prêt à investir dans l\'accompagnement Domtom Connect ?', 
                type: 'radio', 
                required: true, 
                fieldName: 'budget_accompagnement', 
                options: [
                    { value: 'moins-300', label: 'Moins de 300 €' },
                    { value: '300-1000', label: '300-1 000 €' },
                    { value: '1000-3000', label: '1 000-3 000 €' },
                    { value: 'plus-3000', label: 'Plus de 3 000 €' },
                    { value: 'non-defini', label: 'Pas encore défini' }
                ], 
                clarification: '<strong>Important :</strong> L\'accompagnement Domtom Connect (recherche, mise en relation, suivi) est un service séparé. Les prestataires sont payés <strong>directement par vous</strong>, sans commission intermédiaire.' 
            },
            { id: 'certification', question: 'Je certifie sur l\'honneur que toutes les informations fournies sont exactes', type: 'checkbox', required: true, fieldName: 'certification', description: 'Je comprends que la vérification de ces informations permet de garantir la qualité du réseau pour tous.' }
        ];

        let quiz;
        document.addEventListener('DOMContentLoaded', () => {
            quiz = new LandingQuiz(entreprisesQuestions, 'landing-form', 'entreprise', entreprisesQuestionsSimplified);
        });

        async function handleQuizFormSubmit(event) {
            event.preventDefault();
            if (!quiz) return;
            
            const data = quiz.collectAllAnswers();
            data.profil = 'entreprise';
            
            // Validation silencieuse (sans alertes) - juste pour collecter les infos
            const validator = new FormValidator();
            const validation = await validator.validateForm(data);
            
            // Ajouter les résultats de validation aux données (pour l'email) mais ne pas bloquer
            if (validation.credibilityScore) {
                data.credibility_score = validation.credibilityScore.score;
                data.credibility_level = validation.credibilityScore.level;
            }
            if (validation.inconsistencies.length > 0) {
                data.inconsistencies = JSON.stringify(validation.inconsistencies);
            }
            
            // Préparer les données pour l'envoi
            const prenom = data.prenom || data.question_prenom || '';
            const nom = data.nom || data.question_nom || '';
            const email = data.email || data.question_email || '';
            const telephone = data.telephone || data.question_telephone || '';
            const entreprise = data.entreprise || data.question_entreprise || '';
            const ile = data.ile || data.question_ile || '';
            const besoin = data.besoin || data.question_besoin || '';
            const budget_accompagnement = data.budget_accompagnement || data.question_budget_accompagnement || '';
            
            // Déterminer le pack selon le budget
            let packInfo = null;
            if (budget_accompagnement === '300-1000') {
                packInfo = { name: 'Pack Express', price: '800 €', description: 'Recherche de prestataires qualifiés' };
            } else if (budget_accompagnement === '1000-3000') {
                packInfo = { name: 'Pack Coordination', price: '1 500 €', description: 'Coordination complète de vos prestataires' };
            } else if (budget_accompagnement === 'plus-3000') {
                packInfo = { name: 'Pack Partenaire', price: '2 500 €', description: 'Partenariat stratégique complet' };
            }
            
            // Préparer le message pour l'email
            let messageBody = `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
🏢 ENTREPRISE - NOUVELLE INSCRIPTION
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
Source: Landing Page entreprises
Date: ${new Date().toLocaleString('fr-FR')}

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
👤 BLOC 1 - PROFIL & ORIGINE
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
Prénom: ${prenom}
Nom: ${nom}
Email: ${email}
Téléphone: ${telephone || 'Non renseigné'}
Entreprise: ${entreprise || 'Non renseigné'}
Territoire: ${ile || 'Non renseigné'}

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
🎯 BLOC 2 - BESOIN
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
Besoin principal: ${besoin || 'Non renseigné'}

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
💰 BLOC 3 - BUDGET & PACK
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
Budget: ${budget_accompagnement || 'Non renseigné'}
${packInfo ? `Pack sélectionné: ${packInfo.name} (${packInfo.price})` : 'Pack: Non défini'}

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
✅ VALIDATION
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
Certification acceptée: OUI

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
📞 PROCHAINES ÉTAPES
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
1. Contacter ${prenom} ${nom}${entreprise ? ' (' + entreprise + ')' : ''} pour un appel découverte gratuit
2. Après l'appel, décider (oui/non) selon alignement avec mission
3. Si oui, envoyer récap + lien paiement
4. Planifier première session de travail

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━`;
            
            // Préparer FormData pour Formspree
            const formDataToSend = new FormData();
            formDataToSend.append('_to', 'domtomconnect@gmail.com');
            formDataToSend.append('_subject', `🏢 ENTREPRISE${packInfo ? ' - ' + packInfo.name : ''} - ${entreprise || 'Nouvelle Entreprise'} - ${prenom} ${nom}`);
            formDataToSend.append('_replyto', email);
            formDataToSend.append('message', messageBody);
            
            // Données structurées
            formDataToSend.append('Prénom', prenom);
            formDataToSend.append('Nom', nom);
            formDataToSend.append('Email', email);
            formDataToSend.append('Téléphone', telephone || '');
            formDataToSend.append('Entreprise', entreprise || '');
            formDataToSend.append('Territoire', ile || '');
            formDataToSend.append('Besoin', besoin || '');
            formDataToSend.append('Budget Accompagnement', budget_accompagnement || '');
            formDataToSend.append('Profil', 'entreprise');
            if (packInfo) {
                formDataToSend.append('Pack sélectionné', `${packInfo.name} (${packInfo.price})`);
            }
            if (validation.credibilityScore) {
                formDataToSend.append('Score crédibilité', validation.credibilityScore.score);
                formDataToSend.append('Niveau crédibilité', validation.credibilityScore.level);
            }
            
            // Gérer le bouton
            const submitBtn = event.target.querySelector('button[type="submit"]') || 
                            document.querySelector('#quiz-btn-next[type="submit"]');
            const originalBtnText = submitBtn ? (submitBtn.textContent || submitBtn.innerHTML) : '';
            
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = 'Envoi en cours...';
            }
            
            // Envoyer à Formspree
            const formspreeUrl = 'https://formspree.io/f/myzbqepy';
            
            fetch(formspreeUrl, {
                method: 'POST',
                body: formDataToSend,
                headers: {
                    'Accept': 'application/json'
                }
            })
            .then(response => {
                console.log('📧 Réponse Formspree:', response.status, response.statusText);
                
                if (response.ok) {
                    console.log('✅ Email envoyé avec succès');
                    
                    // Afficher le message de succès
                    const quizContainer = document.querySelector('.quiz-container');
                    const quizQuestionsContainer = document.getElementById('quiz-questions-container');
                    const quizNavigation = document.getElementById('quiz-navigation');
                    
                    const successHTML = `
                        <div style="text-align: center; padding: 3rem 2rem; max-width: 600px; margin: 0 auto; animation: fadeInSlide 0.5s ease;">
                            <div style="font-size: 4rem; margin-bottom: 1.5rem; animation: bounceIn 0.6s ease;">✅</div>
                            <h3 style="color: var(--primary-color); margin-bottom: 1.5rem; font-size: 1.75rem; font-weight: 700;">✓ Demande envoyée avec succès !</h3>
                            <div style="color: var(--text-secondary); margin-bottom: 2rem; line-height: 1.8; font-size: 1.05rem; white-space: pre-line; text-align: left; background: linear-gradient(135deg, rgba(0, 191, 166, 0.08), rgba(0, 168, 150, 0.05)); padding: 1.5rem; border-radius: 12px; border-left: 4px solid var(--primary-color);">
                                Merci ${prenom ? prenom + ' !' : ' !'} 🎉

Votre demande a bien été reçue et enregistrée.

📧 Vous allez recevoir un email de confirmation avec le récapitulatif de votre demande dans quelques instants.

📞 Nous vous recontacterons dans les 24-48 heures pour :
• Discuter de vos besoins en prestataires
• Vous présenter notre réseau de prestataires vérifiés
• Vous proposer des solutions adaptées à vos besoins

En attendant, n'hésitez pas à consulter notre site pour en savoir plus sur Domtom Connect.
                            </div>
                            ${packInfo ? `
                                <div style="background: linear-gradient(135deg, #00BFA6 0%, #00A896 100%); border-radius: 20px; padding: 2rem; color: white; margin: 2rem 0;">
                                    <h3 style="font-size: 1.3rem; font-weight: 700; margin-bottom: 0.5rem; color: white;">${packInfo.name}</h3>
                                    <div style="font-size: 2.5rem; font-weight: 900; margin-bottom: 1rem; color: white;">${packInfo.price}</div>
                                    <p style="font-size: 1rem; color: rgba(255, 255, 255, 0.9);">${packInfo.description}</p>
                                </div>
                            ` : ''}
                            <a href="/" class="cta-button primary" style="text-decoration: none; display: inline-block; padding: 1rem 2rem; background: var(--gradient-primary); color: white; border-radius: 8px; font-weight: 600; transition: transform 0.2s; box-shadow: 0 4px 12px rgba(0, 191, 166, 0.3);">Retour à l'accueil</a>
                        </div>
                        <style>
                            @keyframes fadeInSlide {
                                from {
                                    opacity: 0;
                                    transform: translateY(20px);
                                }
                                to {
                                    opacity: 1;
                                    transform: translateY(0);
                                }
                            }
                            @keyframes bounceIn {
                                0% {
                                    transform: scale(0);
                                }
                                50% {
                                    transform: scale(1.2);
                                }
                                100% {
                                    transform: scale(1);
                                }
                            }
                        </style>
                    `;
                    
                    if (quizContainer) {
                        quizContainer.innerHTML = successHTML;
                    } else if (quizQuestionsContainer) {
                        quizQuestionsContainer.innerHTML = successHTML;
                        if (quizNavigation) {
                            quizNavigation.style.display = 'none';
                        }
                    }
                } else {
                    return response.json().then(errData => {
                        console.error('❌ Erreur lors de l\'envoi:', errData);
                        throw new Error(errData.error || 'Erreur lors de l\'envoi');
                    });
                }
            })
            .catch(error => {
                console.error('❌ Erreur:', error);
                alert('Une erreur est survenue lors de l\'envoi de votre demande. Veuillez réessayer ou nous contacter directement à domtomconnect@gmail.com.');
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalBtnText;
                }
            });
        }
    </script>
</body>
</html>
