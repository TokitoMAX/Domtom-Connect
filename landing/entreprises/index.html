        // Fonction pour déterminer le pack selon le budget
        function getPackInfo(budget) {
            if (budget === 'moins-300' || budget === '300-1000') {
                return { name: 'Pack Business (SaaS)', price: '29€/mois', description: 'Visibilité boostée, Missions illimitées, Podcast dédié, Contenus réseaux sociaux & Point Stratégique' };
            } else if (budget === '1000-3000' || budget === 'plus-3000' || budget === 'non-defini') {
                return { name: 'Solution Enterprise', price: 'Sur Devis', description: 'Accompagnement stratégique 360°, sourcing Diaspora dédié et gestion de projet de A à Z' };
            }
            return null;
        }

        // Fonction pour afficher le pack après sélection du budget
        function showPackAfterBudget(budget) {
            const packInfo = getPackInfo(budget);
            if (!packInfo) return;

            // Supprimer l'info pack précédente si elle existe
            const existingPackInfo = document.getElementById('pack-info-entreprise');
            if (existingPackInfo) {
                existingPackInfo.remove();
            }

            // Créer l'élément d'info pack
            const packInfoHTML = `
                <div id="pack-info-entreprise" style="background: linear-gradient(135deg, #00BFA6 0%, #00A896 100%); border-radius: 20px; padding: 2rem; color: white; margin: 2rem 0; animation: fadeInSlide 0.5s ease;">
                    <h3 style="font-size: 1.3rem; font-weight: 700; margin-bottom: 0.5rem; color: white;">${packInfo.name}</h3>
                    <div style="font-size: 2.5rem; font-weight: 900; margin-bottom: 1rem; color: white;">${packInfo.price}</div>
                    <p style="font-size: 1rem; color: rgba(255, 255, 255, 0.9);">${packInfo.description}</p>
                </div>
            `;

            // Trouver la question budget et insérer l'info pack après
            const budgetQuestion = document.querySelector('[data-question-id="budget_accompagnement"]');
            if (budgetQuestion) {
                // Essayer plusieurs méthodes pour insérer le pack
                const questionContent = budgetQuestion.querySelector('.quiz-question-content');
                const questionOptions = budgetQuestion.querySelector('.quiz-options');
                const questionContainer = budgetQuestion.querySelector('.quiz-question-container');

                if (questionOptions) {
                    // Insérer après les options radio
                    questionOptions.insertAdjacentHTML('afterend', packInfoHTML);
                } else if (questionContent) {
                    // Insérer après le contenu de la question
                    questionContent.insertAdjacentHTML('afterend', packInfoHTML);
                } else if (questionContainer) {
                    // Insérer après le container de la question
                    questionContainer.insertAdjacentHTML('afterend', packInfoHTML);
                } else {
                    // En dernier recours, insérer après la question entière
                    budgetQuestion.insertAdjacentHTML('afterend', packInfoHTML);
                }
            } else {
                // Si la question n'est pas trouvée, essayer de trouver le container des questions
                const quizContainer = document.getElementById('quiz-questions-container');
                if (quizContainer) {
                    quizContainer.insertAdjacentHTML('beforeend', packInfoHTML);
                }
            }
        }

        let quiz;
        document.addEventListener('DOMContentLoaded', () => {
            quiz = new LandingQuiz(entreprisesQuestions, 'landing-form', 'entreprise', entreprisesQuestionsSimplified);

            // Utiliser un MutationObserver pour détecter quand la question budget est affichée
            const observer = new MutationObserver(() => {
                const budgetQuestion = document.querySelector('[data-question-id="budget_accompagnement"]');
                if (budgetQuestion) {
                    // Attacher les listeners aux radio buttons
                    const budgetInputs = budgetQuestion.querySelectorAll('input[type="radio"]');
                    budgetInputs.forEach(input => {
                        // Vérifier si le listener n'est pas déjà attaché
                        if (!input.hasAttribute('data-pack-listener')) {
                            input.setAttribute('data-pack-listener', 'true');
                            input.addEventListener('change', (e) => {
                                const selectedBudget = e.target.value;
                                showPackAfterBudget(selectedBudget);
                            });
                        }
                    });

                    // Si une réponse est déjà sélectionnée, afficher le pack immédiatement
                    const selectedBudget = budgetQuestion.querySelector('input[type="radio"]:checked');
                    if (selectedBudget) {
                        showPackAfterBudget(selectedBudget.value);
                    }
                }
            });

            // Observer les changements dans le container des questions
            const quizContainer = document.getElementById('quiz-questions-container');
            if (quizContainer) {
                observer.observe(quizContainer, {
                    childList: true,
                    subtree: true
                });
            }
        });

        async function handleQuizFormSubmit(event) {
            event.preventDefault();
            if (!quiz) return;

            const data = quiz.collectAllAnswers();
            data.profil = 'entreprise';

            // Filet de sécurité : récupérer depuis quiz.answers si data est incomplet
            [['prenom', 'question_prenom'], ['nom', 'question_nom'], ['email', 'question_email'], ['telephone', 'question_telephone'], ['ile', 'question_ile'], ['entreprise', 'question_entreprise']].forEach(([field, key]) => {
                if ((!data[field] || !String(data[field]).trim()) && quiz.answers[key]) {
                    data[field] = String(quiz.answers[key]).trim();
                }
            });

            // Bloquer l'envoi si champs obligatoires manquants
            const prenomVal = (data.prenom || data.question_prenom || '').trim();
            const nomVal = (data.nom || data.question_nom || '').trim();
            const emailVal = (data.email || data.question_email || '').trim();
            const telVal = (data.telephone || data.question_telephone || '').trim();
            const ileVal = (data.ile || data.question_ile || '').trim();
            const entrepriseVal = (data.entreprise || data.question_entreprise || '').trim();
            const emailInvalide = !emailVal || !emailVal.includes('@');
            if (emailInvalide || !prenomVal || !nomVal || !telVal || !ileVal || !entrepriseVal) {
                const champs = [];
                if (!prenomVal) champs.push('Prénom');
                if (!nomVal) champs.push('Nom');
                if (emailInvalide) champs.push('Email');
                if (!telVal) champs.push('Téléphone');
                if (!ileVal) champs.push('Territoire');
                if (!entrepriseVal) champs.push('Nom de l\'entreprise');
                if (champs.length) {
                    alert('Pour envoyer votre inscription, merci de remplir tous les champs obligatoires : ' + champs.join(', ') + '.');
                    return;
                }
            }

            // Validation silencieuse (sans alertes) - juste pour collecter les infos
            const validator = new FormValidator();
            const validation = await validator.validateForm(data);

            // Ajouter les résultats de validation aux données (pour l'email) mais ne pas bloquer
            if (validation.credibilityScore) {
                data.credibility_score = validation.credibilityScore.score;
                data.credibility_level = validation.credibilityScore.level;
            }
            if (validation.inconsistencies.length > 0) {
                data.inconsistencies = JSON.stringify(validation.inconsistencies);
            }

            // Préparer les données pour l'envoi
            const prenom = data.prenom || data.question_prenom || '';
            const nom = data.nom || data.question_nom || '';
            const email = data.email || data.question_email || '';
            const telephone = data.telephone || data.question_telephone || '';
            const entreprise = data.entreprise || data.question_entreprise || '';
            const ile = data.ile || data.question_ile || '';
            const besoin = data.besoin || data.question_besoin || '';
            const budget_accompagnement = data.budget_accompagnement || data.question_budget_accompagnement || '';

            // Déterminer le pack selon le budget
            let packInfo = getPackInfo(budget_accompagnement);

            // Préparer le message pour l'email
            let messageBody = `ENTREPRISE - NOUVELLE INSCRIPTION
Source: Landing Page entreprises
Date: ${new Date().toLocaleString('fr-FR')}

BLOC 1 - PROFIL & ORIGINE
Prénom: ${prenom}
Nom: ${nom}
Email: ${email}
Téléphone: ${telephone || 'Non renseigné'}
Entreprise: ${entreprise || 'Non renseigné'}
Territoire: ${ile || 'Non renseigné'}

BLOC 2 - BESOIN
Besoin principal: ${besoin || 'Non renseigné'}

BLOC 3 - BUDGET & PACK
Budget: ${budget_accompagnement || 'Non renseigné'}
${packInfo ? `Pack sélectionné: ${packInfo.name} (${packInfo.price})` : 'Pack: Non défini'}

VALIDATION
Certification acceptée: OUI

PROCHAINES ÉTAPES
1. Contacter ${prenom} ${nom}${entreprise ? ' (' + entreprise + ')' : ''} pour un appel découverte gratuit
2. Après l'appel, décider (oui/non) selon alignement avec mission
3. Si oui, envoyer récap + lien paiement
4. Planifier première session de travail

DONNÉES COMPLÈTES
${Object.keys(data).filter(key => {
                // Exclure les champs déjà affichés et les champs techniques
                const excludedKeys = ['profil', 'credibility_score', 'credibility_level', 'inconsistencies', 'website'];
                const displayedKeys = ['prenom', 'nom', 'email', 'telephone', 'entreprise', 'ile', 'besoin', 'budget_accompagnement'];
                return !excludedKeys.includes(key) && !displayedKeys.includes(key) && !key.startsWith('question_');
            }).map(key => {
                const value = data[key];
                if (value && value !== '' && value !== null && value !== undefined) {
                    const label = key.charAt(0).toUpperCase() + key.slice(1).replace(/_/g, ' ');
                    return `${label}: ${value}`;
                }
                return null;
            }).filter(line => line !== null).join('\n') || 'Aucune donnée supplémentaire'}`;

            const formDataToSend = new FormData();
            formDataToSend.append('_to', 'domtomconnect@gmail.com');
            formDataToSend.append('_subject', `ENTREPRISE${packInfo ? ' - ' + packInfo.name : ''} - ${entreprise || 'Nouvelle Entreprise'} - ${prenom} ${nom}`);
            formDataToSend.append('_replyto', email);
            formDataToSend.append('message', messageBody);

            // Données structurées
            formDataToSend.append('Prénom', prenom);
            formDataToSend.append('Nom', nom);
            formDataToSend.append('Email', email);
            formDataToSend.append('Téléphone', telephone || '');
            formDataToSend.append('Entreprise', entreprise || '');
            formDataToSend.append('Territoire', ile || '');
            formDataToSend.append('Besoin', besoin || '');
            formDataToSend.append('Budget Accompagnement', budget_accompagnement || '');
            formDataToSend.append('Profil', 'entreprise');

            // Ajouter TOUTES les autres données collectées
            Object.keys(data).forEach(key => {
                const excludedKeys = ['profil', 'credibility_score', 'credibility_level', 'inconsistencies', 'website'];
                const alreadyAdded = ['prenom', 'nom', 'email', 'telephone', 'entreprise', 'ile', 'besoin', 'budget_accompagnement'];
                if (!excludedKeys.includes(key) && !alreadyAdded.includes(key) && !key.startsWith('question_')) {
                    const value = data[key];
                    if (value && value !== '' && value !== null && value !== undefined) {
                        const label = key.charAt(0).toUpperCase() + key.slice(1).replace(/_/g, ' ');
                        formDataToSend.append(label, String(value));
                    }
                }
            });

            if (packInfo) {
                formDataToSend.append('Pack sélectionné', `${packInfo.name} (${packInfo.price})`);
            }
            if (validation.credibilityScore) {
                formDataToSend.append('Score crédibilité', validation.credibilityScore.score);
                formDataToSend.append('Niveau crédibilité', validation.credibilityScore.level);
            }

            // Gérer le bouton
            const submitBtn = event.target.querySelector('button[type="submit"]') ||
                document.querySelector('#quiz-btn-next[type="submit"]');
            const originalBtnText = submitBtn ? (submitBtn.textContent || submitBtn.innerHTML) : '';

            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = 'Envoi en cours...';
            }

            // Envoyer à Formspree
            const formspreeUrl = 'https://formspree.io/f/myzbqepy';

            fetch(formspreeUrl, {
                method: 'POST',
                body: formDataToSend,
                headers: {
                    'Accept': 'application/json'
                }
            })
                .then(response => {
                    console.log('📧 Réponse Formspree:', response.status, response.statusText);

                    if (response.ok) {
                        console.log('✅ Email envoyé avec succès');

                        // Afficher le message de succès
                        const quizContainer = document.querySelector('.quiz-container');
                        const quizQuestionsContainer = document.getElementById('quiz-questions-container');
                        const quizNavigation = document.getElementById('quiz-navigation');

                        const successHTML = `
                        <div style="text-align: center; padding: 3rem 2rem; max-width: 600px; margin: 0 auto; animation: fadeInSlide 0.5s ease;">
                            <div style="font-size: 4rem; margin-bottom: 1.5rem; animation: bounceIn 0.6s ease;">✅</div>
                            <h3 style="color: var(--primary-color); margin-bottom: 1.5rem; font-size: 1.75rem; font-weight: 700;">✓ Demande envoyée avec succès !</h3>
                            <div style="color: var(--text-secondary); margin-bottom: 2rem; line-height: 1.8; font-size: 1.05rem; white-space: pre-line; text-align: left; background: linear-gradient(135deg, rgba(0, 191, 166, 0.08), rgba(0, 168, 150, 0.05)); padding: 1.5rem; border-radius: 12px; border-left: 4px solid var(--primary-color);">
                                Merci ${prenom ? prenom + ' !' : ' !'} 🎉

Votre demande a bien été reçue et enregistrée.

📧 Vous allez recevoir un email de confirmation avec le récapitulatif de votre demande dans quelques instants.

📞 Réservez votre appel découverte gratuit maintenant :

                            <div style="margin: 2rem 0;">
                                <!-- Widget Calendly - Remplacez 'votre-lien-calendly' par votre lien Calendly réel -->
                                <div class="calendly-inline-widget" 
                                     data-url="https://calendly.com/domtomconnect/30min" 
                                     style="min-width:320px;height:700px;border-radius: 12px; overflow: hidden;">
                                </div>
                            </div>

Ou nous vous recontactons sous 24h si vous préférez qu'on vous contacte directement.

En attendant, n'hésitez pas à consulter notre site pour en savoir plus sur Domtom Connect.
                            </div>
                            ${packInfo ? `
                                <div style="background: linear-gradient(135deg, #00BFA6 0%, #00A896 100%); border-radius: 20px; padding: 2rem; color: white; margin: 2rem 0;">
                                    <h3 style="font-size: 1.3rem; font-weight: 700; margin-bottom: 0.5rem; color: white;">${packInfo.name}</h3>
                                    <div style="font-size: 2.5rem; font-weight: 900; margin-bottom: 1rem; color: white;">${packInfo.price}</div>
                                    <p style="font-size: 1rem; color: rgba(255, 255, 255, 0.9);">${packInfo.description}</p>
                                </div>
                            ` : ''}
                            ${!packInfo && budget_accompagnement ? `
                                <div style="background: #f8fafc; border-radius: 16px; padding: 2rem; margin-top: 2rem; border-left: 4px solid var(--primary-color);">
                                    <p style="font-size: 1rem; color: var(--text-secondary); line-height: 1.6;">
                                        <strong>Note :</strong> Votre budget (${budget_accompagnement}) sera discuté lors de l'appel découverte pour déterminer le pack le plus adapté à vos besoins.
                                    </p>
                                </div>
                            ` : ''}
                            <a href="../../index.html" class="cta-button primary" style="text-decoration: none; display: inline-block; padding: 1rem 2rem; background: var(--gradient-primary); color: white; border-radius: 8px; font-weight: 600; transition: transform 0.2s; box-shadow: 0 4px 12px rgba(0, 191, 166, 0.3);">Retour à l'accueil</a>
                        </div>
                        <style>
                            @keyframes fadeInSlide {
                                from {
                                    opacity: 0;
                                    transform: translateY(20px);
                                }
                                to {
                                    opacity: 1;
                                    transform: translateY(0);
                                }
                            }
                            @keyframes bounceIn {
                                0% {
                                    transform: scale(0);
                                }
                                50% {
                                    transform: scale(1.2);
                                }
                                100% {
                                    transform: scale(1);
                                }
                            }
                        </style>
                    `;

                        if (quizContainer) {
                            quizContainer.innerHTML = successHTML;
                        } else if (quizQuestionsContainer) {
                            quizQuestionsContainer.innerHTML = successHTML;
                            if (quizNavigation) {
                                quizNavigation.style.display = 'none';
                            }
                        }

                        // Initialiser le widget Calendly après l'injection du HTML
                        setTimeout(() => {
                            const calendlyWidget = document.querySelector('.calendly-inline-widget');
                            if (calendlyWidget) {
                                // Si Calendly est déjà chargé, initialiser directement
                                if (window.Calendly && window.Calendly.initInlineWidget) {
                                    try {
                                        window.Calendly.initInlineWidget({
                                            url: 'https://calendly.com/domtomconnect/30min',
                                            parentElement: calendlyWidget,
                                            prefill: {
                                                email: email || '',
                                                name: `${prenom} ${nom}`.trim() || ''
                                            }
                                        });
                                    } catch (e) {
                                        console.error('Erreur initialisation Calendly:', e);
                                    }
                                } else {
                                    // Si Calendly n'est pas encore chargé, attendre qu'il le soit
                                    const checkCalendly = setInterval(() => {
                                        if (window.Calendly && window.Calendly.initInlineWidget) {
                                            clearInterval(checkCalendly);
                                            try {
                                                window.Calendly.initInlineWidget({
                                                    url: 'https://calendly.com/domtomconnect/30min',
                                                    parentElement: calendlyWidget,
                                                    prefill: {
                                                        email: email || '',
                                                        name: `${prenom} ${nom}`.trim() || ''
                                                    }
                                                });
                                            } catch (e) {
                                                console.error('Erreur initialisation Calendly:', e);
                                            }
                                        }
                                    }, 100);

                                    // Arrêter après 10 secondes si Calendly ne se charge pas
                                    setTimeout(() => clearInterval(checkCalendly), 10000);
                                }
                            }
                        }, 1000);
                    } else {
                        return response.json().then(errData => {
                            console.error('Erreur lors de l\'envoi:', errData);
                            throw new Error(errData.error || 'Erreur lors de l\'envoi');
                        });
                    }
                })
                .catch(error => {
                    console.error('Erreur:', error);
                    alert('Une erreur est survenue lors de l\'envoi de votre demande. Veuillez réessayer ou nous contacter directement à domtomconnect@gmail.com.');
                    if (submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = originalBtnText;
                    }
                });
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await loadGlobalNavbar();
        });
    </script>
</body>
