    <script>
        // --- Dashboard Navigation Persistence ---
        function syncNavActiveState() {
            const hash = window.location.hash || '#overview';
            const cleanHash = hash.split('?')[0];
            
            // 1. Mobile Nav
            document.querySelectorAll('.mobile-nav-link').forEach(link => {
                const href = link.getAttribute('href');
                if (href.includes(cleanHash) || (cleanHash === '#overview' && href === 'mon-espace.html')) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });

            // 2. Top Nav Pills
            document.querySelectorAll('.nav-market-link').forEach(link => {
                const href = link.getAttribute('href');
                if (window.location.pathname.includes(href)) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });
        }

        window.addEventListener('hashchange', syncNavActiveState);
        window.addEventListener('load', () => {
            syncNavActiveState();
            console.log("[Emergency] Forcing App Initialization...");
            if (window.App && typeof window.App.init === 'function') {
                window.App.init().catch(err => {
                    console.error("[Emergency] App.init failed:", err);
                    const target = document.getElementById('ecosystem-grid-container');
                    if (target) target.innerHTML = `<div style="padding:40px; color:#ef4444; background:white; border-radius:12px; text-align:center;">
                        <h3>⚠️ Erreur de démarrage</h3>
                        <p>${err.message}</p>
                        <button onclick="window.location.reload()" style="padding:10px 20px; background:#0f172a; color:white; border-radius:8px; border:none; cursor:pointer;">Réessayer</button>
                    </div>`;
                });
            }
        });
        
        // Wait for potential dynamic rendering
        setTimeout(syncNavActiveState, 1000);
    </script>
