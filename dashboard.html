    <script
        src="https://www.paypal.com/sdk/js?client-id=AcBmagCWJpj_JUQpRivjdlrowAA48XOvpD_B022bRdhQqQzYIHR6LgAKLdFadgLKHUa4BPqpYwstW825&currency=EUR&intent=capture"
        data-sdk-integration-source="button-factory"></script>

    <style>
        body {
            background-color: var(--bg-light);
        }

        .dashboard-layout {
            display: flex;
            min-height: 100vh;
            padding-top: 64px;
            /* Hauteur de la navbar */
        }

        /* Sidebar simplifiée (Desktop) */
        .sidebar {
            width: 250px;
            background: var(--white);
            border-right: 1px solid var(--gray-200);
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: fixed;
            top: 64px;
            bottom: 0;
            left: 0;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            border-radius: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .sidebar-link:hover {
            background: var(--gray-50);
            color: var(--text-primary);
        }

        /* Utility Widgets */
        .utility-widget {
            background: white;
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--gray-200);
            margin-top: 24px;
        }

        .widget-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--gray-50);
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .checklist-item:last-child {
            border: none;
        }

        .checklist-checkbox {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            border: 2px solid var(--gray-300);
            cursor: pointer;
        }

        .directory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }

        .directory-item {
            padding: 12px;
            background: var(--bg-light);
            border-radius: 8px;
            text-align: center;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-primary);
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .directory-item:hover {
            border-color: var(--primary-color);
            background: white;
        }

        .sidebar-link.active {
            background: var(--primary-color);
            color: var(--white);
        }

        /* Contenu principal */
        .main-content {
            flex: 1;
            margin-left: 250px;
            padding: 40px;
            max-width: 1000px;
        }

        .header-section {
            margin-bottom: 40px;
        }

        .role-badge {
            display: inline-block;
            background: rgba(16, 185, 129, 0.1);
            color: var(--emerald-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
        }

        /* Grilles et Cartes façon Linear */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
        }

        .dash-card {
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: 12px;
            padding: 24px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .dash-card:hover {
            border-color: var(--gray-300);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .dash-card.highlight {
            border: 1px solid var(--emerald-color);
            background: linear-gradient(180deg, rgba(16, 185, 129, 0.05) 0%, rgba(255, 255, 255, 0) 100%);
        }

        .card-title {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        /* Mobile Bottom Nav */
        .mobile-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--white);
            border-top: 1px solid var(--gray-200);
            padding: 12px 24px;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
        }

        .mobile-nav-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .mobile-nav-link.active {
            color: var(--primary-color);
        }

        .mobile-nav-link svg {
            width: 24px;
            height: 24px;
            stroke-width: 2;
        }

        /* Mobile */
        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }

            .main-content {
                margin-left: 0;
                padding: 24px;
                padding-bottom: 100px;
                /* Space for bottom nav */
            }

            .mobile-nav {
                display: flex;
            }

            .nav-content {
                display: none;
                /* Cache les boutons desktop sur mobile pour la navbar du haut */
            }

            .header-section {
                text-align: center;
            }
        }

        /* Job Board Premium Styles */
        .job-board-section {
            margin-top: 40px;
        }

        .job-board-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .job-card {
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: var(--border-radius-lg);
            padding: 24px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }

        .job-card.locked {
            border-color: #fca5a5;
            background: #fef2f2;
        }

        .job-info h3 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .job-meta {
            display: flex;
            gap: 16px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .job-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .job-client-blurred {
            color: transparent;
            text-shadow: 0 0 8px rgba(15, 61, 46, 0.5);
            background: #e2e8f0;
            border-radius: 4px;
            padding: 2px 8px;
            user-select: none;
        }

        .job-action {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-end;
            min-width: 250px;
        }

        .premium-lock-btn {
            background: #ef4444;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
        }

        .premium-lock-btn:hover {
            background: #dc2626;
        }
    </style>
</head>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <span
                style="font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; padding-left: 16px;">Menu

            <a href="#" class="sidebar-link active">Vue d'ensemble</a>

            <span

            <a href="/" class="sidebar-link">

                <!-- Contenu dynamique selon le rôle -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        async function loadDashboard() {
            const session = await getSession();
            if (!session) {
                window.location.href = 'login.html';
                return;
            }

            const name = session.user.user_metadata.full_name || session.user.email.split('@')[0];
            const profile = await getProfile(session.user.id);

            // Priorité : user_metadata.role (source de vérité sync avec onboarding)
            // Fallback : profile.role (table Supabase)
            const role = session.user.user_metadata.role || (profile ? profile.role : null);
            const tier = profile ? (profile.subscription_tier || 'free') : 'free';

            document.getElementById('user-greeting').textContent = `Bonjour, ${name}.`;

            if (!role) {
                // Si pas de rôle du tout, on force l'onboarding
                window.location.href = 'registration/onboarding.html';
                return;
            }

            const roleBadge = document.getElementById('user-role-badge');
            const cardsContainer = document.getElementById('dashboard-cards');
            const dashboardContent = document.getElementById('dashboard-content');

            if (role === 'expert' || role === 'prestataire') {
                roleBadge.textContent = "Profil Expert";

                // Résumé rapide en haut
                cardsContainer.innerHTML = `
                    <div class="dash-card highlight" style="border-color: #10b981;">
                        <div class="card-title">SoloPrice Pro <span style="font-size:0.7rem;background:rgba(16,185,129,0.1);color:#10b981;padding:2px 8px;border-radius:20px;">Inclus</span></div>
                        <p class="card-desc">Gérez vos devis, factures et cash-flow — l'outil financier des indépendants DOM-TOM.</p>
                        <a href="https://solopricepro.vercel.app/" target="_blank" class="cta-button primary" style="margin-top:auto;justify-content:center;background:#10b981;">Ouvrir SoloPrice Pro →</a>
                    </div>
                    <div class="dash-card">
                        <div class="card-title">Leads & Missions</div>
                        <p class="card-desc">Accédez aux projets des entreprises et institutionnels Outre-mer qui cherchent votre expertise.</p>
                        <a href="marketplace/directory.html" class="cta-button secondary" style="margin-top:auto;justify-content:center;">Voir les missions</a>
                    </div>
                `;

                // === PACKS HYBRIDES ===
                const packsHTML = `
                    <div style="margin-top:40px;">
                        <p style="font-size:0.75rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px;">Développez votre clientèle</p>
                        <h2 style="font-size:1.5rem;font-weight:800;margin-bottom:6px;color:var(--text-primary);">Votre présence sur Domtom Connect</h2>
                        <p style="color:var(--text-secondary);font-size:0.95rem;margin-bottom:32px;">Nous construisons votre visibilité pendant que vous vous concentrez sur vos missions.</p>

                        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;align-items:start;">

                            <!-- PACK 1 : PRÉSENCE -->
                            <div style="background:white;border:1.5px solid var(--gray-200);border-radius:16px;padding:28px;">
                                <div style="font-size:0.75rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;margin-bottom:12px;">Présence</div>
                                <div style="font-size:2rem;font-weight:800;color:var(--text-primary);margin-bottom:4px;">0€</div>
                                <p style="font-size:0.8rem;font-weight:600;color:var(--text-muted);margin-bottom:16px;">Gratuit — Pour toujours</p>
                                <ul style="list-style:none;padding:0;margin:0 0 24px;display:flex;flex-direction:column;gap:10px;font-size:0.875rem;color:var(--text-secondary);">
                                    <li>— Fiche profil dans l'annuaire public</li>
                                    <li>— Accès au fil du réseau</li>
                                    <li>— Mise en relation basique</li>
                                    <li style="color:var(--gray-300);">— Badge Expert Vérifié</li>
                                    <li style="color:var(--gray-300);">— Contenus réseaux sociaux</li>
                                    <li style="color:var(--gray-300);">— Podcast & leads premium</li>
                                </ul>
                                <div style="background:var(--bg-light);border-radius:8px;padding:10px;text-align:center;font-weight:600;font-size:0.875rem;color:var(--text-muted);">Votre plan actuel</div>
                            </div>

                            <!-- PACK 2 : COUP DE PROJECTEUR -->
                            <div style="background:white;border:2px solid #10b981;border-radius:16px;padding:28px;position:relative;box-shadow:0 8px 24px rgba(16,185,129,0.12);">
                                <div style="position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:#10b981;color:white;font-size:0.7rem;font-weight:800;padding:4px 14px;border-radius:20px;text-transform:uppercase;letter-spacing:0.05em;white-space:nowrap;">Recommandé pour commencer</div>
                                <div style="font-size:0.75rem;font-weight:700;color:#10b981;text-transform:uppercase;margin-bottom:12px;">Coup de Projecteur</div>
                                <div style="font-size:2rem;font-weight:800;color:var(--text-primary);margin-bottom:4px;">59€</div>
                                <p style="font-size:0.8rem;font-weight:600;color:var(--text-muted);margin-bottom:16px;">Paiement unique — Sans abonnement</p>
                                <ul style="list-style:none;padding:0;margin:0 0 24px;display:flex;flex-direction:column;gap:10px;font-size:0.875rem;color:var(--text-secondary);">
                                    <li style="font-weight:600;color:var(--text-primary);">— Badge <strong>Expert Vérifié</strong> (permanent)</li>
                                    <li style="font-weight:600;color:var(--text-primary);">— <strong>4 posts</strong> créés & publiés pour vos réseaux</li>
                                    <li style="font-weight:600;color:var(--text-primary);">— Boost annuaire pendant <strong>30 jours</strong></li>
                                    <li>— Accès aux leads & missions du mois</li>
                                    <li style="color:var(--gray-300);">— Contenus récurrents chaque mois</li>
                                    <li style="color:var(--gray-300);">— Interview podcast</li>
                                </ul>
                                <div id="paypal-projecteur" style="margin-top:4px;"></div>
                                <p style="text-align:center;font-size:0.7rem;color:var(--text-muted);margin-top:10px;">Paiement sécurisé — Badge permanent acquis</p>
                            </div>

                            <!-- PACK 3 : INFLUENCE CONTINUE -->
                            <div style="background:linear-gradient(160deg,#1e1b4b 0%,#312e81 100%);border:1.5px solid #6366f1;border-radius:16px;padding:28px;position:relative;">
                                <div style="font-size:0.75rem;font-weight:700;color:#a5b4fc;text-transform:uppercase;margin-bottom:12px;">Influence Continue</div>
                                <div style="font-size:2rem;font-weight:800;color:white;margin-bottom:4px;">39€<span style="font-size:1rem;font-weight:400;color:#a5b4fc">/mois</span></div>
                                <p style="font-size:0.8rem;font-weight:600;color:#a5b4fc;margin-bottom:16px;">Abonnement — Sans engagement minimum</p>
                                <ul style="list-style:none;padding:0;margin:0 0 24px;display:flex;flex-direction:column;gap:10px;font-size:0.875rem;color:#e0e7ff;">
                                    <li>— Tout le pack Coup de Projecteur</li>
                                    <li style="font-weight:600;color:white;">— Position TOP 3 dans votre secteur</li>
                                    <li style="font-weight:600;color:white;">— <strong>8 posts/mois</strong> rédigés & publiés pour vous</li>
                                    <li style="font-weight:600;color:white;">— 1 interview podcast <em>(tous les 3 mois)</em></li>
                                    <li>— Accès prioritaire aux grands comptes</li>
                                    <li>— Rapport mensuel de visibilité</li>
                                </ul>
                                <div id="paypal-influence" style="margin-top:4px;"></div>
                                <p style="text-align:center;font-size:0.7rem;color:#a5b4fc;margin-top:10px;">Résiliation en 1 clic — Sans frais cachés</p>
                            </div>

                        </div>
                    </div>
                `;
                dashboardContent.insertAdjacentHTML('beforeend', packsHTML);

                // === PAYPAL SMART BUTTONS ===
                if (typeof paypal !== 'undefined') {
                    // Coup de Projecteur — 59€ paiement unique
                    paypal.Buttons({
                        style: { layout: 'horizontal', color: 'black', shape: 'rect', label: 'pay', height: 40, tagline: false },
                        createOrder: function (data, actions) {
                            return actions.order.create({
                                purchase_units: [{ description: 'Coup de Projecteur — Domtom Connect', amount: { currency_code: 'EUR', value: '59.00' } }]
                            });
                        },
                        onApprove: function (data, actions) {
                            return actions.order.capture().then(function () {
                                alert('Paiement confirmé. Votre Pack Coup de Projecteur est activé. Domtom Connect vous contactera sous 24h.');
                            });
                        }
                    }).render('#paypal-projecteur');

                    // Influence Continue — 39€/mois
                    paypal.Buttons({
                        style: { layout: 'horizontal', color: 'white', shape: 'rect', label: 'pay', height: 40, tagline: false },
                        createOrder: function (data, actions) {
                            return actions.order.create({
                                purchase_units: [{ description: 'Influence Continue (1er mois) — Domtom Connect', amount: { currency_code: 'EUR', value: '39.00' } }]
                            });
                        },
                        onApprove: function (data, actions) {
                            return actions.order.capture().then(function () {
                                alert('Paiement confirmé. Votre abonnement Influence Continue est activé. Domtom Connect vous contactera sous 24h.');
                            });
                        }
                    }).render('#paypal-influence');
                }

            } else if (role === 'entreprise') {
                roleBadge.textContent = "Profil Entreprise";
                roleBadge.style.color = "#0284c7";
                roleBadge.style.background = "rgba(2, 132, 199, 0.1)";

                cardsContainer.innerHTML = `
                    <div class="dash-card highlight" style="border-color: #0284c7;">
                        <div class="card-title">Recrutement & Talents</div>

        async function handleDeleteAccount() {
            if (confirm("Êtes-vous sûr de vouloir supprimer définitivement votre compte Domtom Connect ? Cette action effacera également votre profil de l'annuaire de manière permanente.")) {
                try {
                    // Si on a une fonction backend pour supprimer, on l'appelle.
                    // Sinon, ici en JS front, on appelle la fct RPC ou un update explicite
                    const { error } = await _supabase.rpc('delete_user_account');
                    if (error) {
                        // Plan B si pas de RPC paramétrée : demander à l'Admin
                        alert("Pour des raisons de sécurité, veuillez envoyer un email à domtomconnect@gmail.com pour confirmer la suppression (RGPD).");
                    } else {
                        alert("Compte supprimé avec succès.");
                        window.location.href = '/login.html';
                    }
                } catch (e) {
                    alert("Pour valider la suppression de vos données, veuillez nous contacter à domtomconnect@gmail.com. (Conformité RGPD)");
                }
            }
        }

        loadDashboard();
