    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const session = await getSession();
            
            // --- INITIALIZE MOBILE NAV ---
            if (session && typeof renderMobileNav === 'function') {
                const role = session.user.user_metadata?.role || 'user';
                renderMobileNav(role);
            }

            const container = document.getElementById('business-standalone-view');
            if (typeof BusinessModule !== 'undefined') {
                await BusinessModule.renderView(container);
            }
            
            // Masquer les liens réservés si pas expert
            if (session) {
                const role = session.user?.user_metadata?.role;
                // Allow both expert and entreprise for now as enterprise needs billing too
                if (role !== 'expert' && role !== 'entreprise' && role !== 'admin') {
                    window.location.href = '/mon-espace';
                }
            } else {
                window.location.href = '/login';
            }
        });
    </script>
